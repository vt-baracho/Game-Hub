<p style="font-size:12px;margin:6px">Jogador fora da posicao ideal sofre penalidade nos atributos.</p><button class=c onclick="start()">Iniciar partida</button><button class=c onclick="screen('main')">Voltar</button>`,
teams:()=>`<h2>Times</h2><div class=row>${[0,1].map(t=>`<div><b style="color:${TC[t]}">${TN[t]}</b><table><tr><th>Nome<th>Pos${AL.map(a=>'<th>'+a.slice(0,3)).join('')}</tr>${ROST[t].map(d=>`<tr><td>${d.name}<td>${d.pos}${AT.map(a=>'<td>'+d[a]).join('')}</tr>`).join('')}</table></div>`).join('')}</div><button class=c onclick="screen('main')">Voltar</button>`,
editor:()=>{const d=E();return`<h2>Editor de jogadores</h2><select onchange="ed.t=+this.value;ed.i=0;screen('editor')">${opt(TN,ed.t)}</select><select onchange="ed.i=+this.value;screen('editor')">${opt(ROST[ed.t].map(x=>x.name),ed.i)}</select>
<table><tr><td>Nome<td><input type=text value="${d.name}" onchange="E().name=this.value"></tr><tr><td>Posicao<td><select onchange="E().pos=['GK','ZAG','MEI','ATA'][+this.value]">${opt(['GK','ZAG','ZAG','MEI','MEI','ATA'].filter((x,i,a)=>a.indexOf(x)===i),['GK','ZAG','MEI','ATA'].indexOf(d.pos))}</select></tr>
${AT.map((a,i)=>`<tr><td>${AL[i]}<td><input type=range min=20 max=99 value=${d[a]} oninput="E().${a}=+this.value;this.nextSibling.textContent=this.value"><span>${d[a]}</span></tr>`).join('')}
<tr><td>Cabelo<td><input type=color value="${d.hair}" onchange="E().hair=this.value"></tr><tr><td>Sprite PNG<td><input type=file accept="image/png" onchange="imp(this.files[0])"> ${d.img?`<button onclick="E().img=null;screen('editor')">Remover</button>`:''}</tr></table>

create:()=>crt(),
cfg:()=>`<h2>Configuracoes</h2><table><tr><td>Duracao<td><select onchange="S.dur=+this.value;save()">${[60,120,180,300].map(v=>`<option ${S.dur===v?'selected':''} value=${v}>${v/60} min</option>`).join('')}</select></tr><tr><td>Volume efeitos<td><input type=range min=0 max=100 value=${S.sfx} oninput="S.sfx=+this.value;save();snd(440,.1)"></tr><tr><td>Efeitos/particulas<td><input type=checkbox ${S.fx?'checked':''} onchange="S.fx=this.checked?1:0;save()"></tr></table><button class=c onclick="screen(back)">Voltar</button>`,
keys:()=>`<h2>Controles</h2><p style="font-size:12px">Clique em uma tecla e pressione a nova. Com a bola: passe, passe longo, chute, especial. Sem a bola: carrinho, trocar jogador, especial (roubada).</p><div class=row>${S.keys.map((k,i)=>`<div><b>Jogador ${i+1}</b><table>${Object.keys(LBL).map(c=>`<tr><td>${LBL[c]}<td><button onclick="rb=[${i},'${c}'];this.textContent='...'">${k[c].replace('Key','').replace('Arrow','Seta ')}</button></tr>`).join('')}</table></div>`).join('')}</div><button onclick="S.keys=JSON.parse(JSON.stringify(DK));save();screen('keys')">Padrao</button><button onclick="screen('main')">Voltar</button>`,

res:()=>{const w=sc[0]===sc[1]?'Empate!':'Vitoria: '+TN[sc[0]>sc[1]?0:1];return`<h2>Fim de jogo</h2><h1 style="font-size:40px">${sc[0]} x ${sc[1]}</h1><p><b>${w}</b></p><p>Duracao: ${S.dur/60} min</p><table><tr><th><th>${TN[0]}<th>${TN[1]}</tr><tr><td>Chutes<td>${stat[0].sh}<td>${stat[1].sh}</tr><tr><td>Passes<td>${stat[0].pa}<td>${stat[1].pa}</tr><tr><td>Roubadas<td>${stat[0].st}<td>${stat[1].st}</tr></table><button class=c onclick="start()">Revanche</button><button class=c onclick="menu()">Menu</button>`}};
screen('main');
