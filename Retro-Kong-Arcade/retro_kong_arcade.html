<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Retro Kong Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #07070b;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .arcade-cabinet {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      height: 100%;
      max-height: 100vh;
      padding: 8px;
      gap: 10px;
    }

    .screen-bezel {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #11131c;
      border: 4px solid #2a2f45;
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 0 28px rgba(0, 0, 0, 0.9), inset 0 0 18px rgba(0, 0, 0, 0.85);
    }

    canvas {
      display: block;
      background-color: #000000;
      border-radius: 8px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Subtle CRT scanline overlay */
    .crt-overlay {
      pointer-events: none;
      position: absolute;
      inset: 6px;
      border-radius: 8px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0px,
        rgba(255, 255, 255, 0) 2px,
        rgba(0, 0, 0, 0.22) 3px,
        rgba(0, 0, 0, 0.22) 4px
      );
      z-index: 2;
    }

    /* Controls bar below screen */
    .controls-panel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 6px;
      gap: 12px;
      flex-shrink: 0;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 42px);
      gap: 4px;
    }

    .dpad-btn {
      background: linear-gradient(145deg, #2b3044, #1b1e2b);
      border: 2px solid #444b68;
      border-radius: 10px;
      color: #e2e8f0;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #0d0f17;
      transition: transform 0.06s, box-shadow 0.06s;
      touch-action: none;
    }

    .dpad-btn:active, .dpad-btn.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0d0f17;
      background: #3a425e;
      color: #38bdf8;
    }

    .dpad-empty {
      visibility: hidden;
    }

    .center-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mute-btn {
      background: #1d2233;
      border: 2px solid #3c4563;
      border-radius: 8px;
      color: #cbd5e1;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 8px 10px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0b0d14;
      touch-action: manipulation;
    }

    .mute-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0b0d14;
    }

    .jump-btn {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4b6e, #b91c1c);
      border: 3px solid #fca5a5;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 6px 0 #7f1d1d, 0 8px 16px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      transition: transform 0.06s, box-shadow 0.06s;
    }

    .jump-btn:active, .jump-btn.active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #7f1d1d;
    }

    /* Overlay for Start / Game Over */
    .overlay {
      position: absolute;
      inset: 6px;
      background: rgba(0, 0, 0, 0.82);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 5;
      padding: 20px;
      gap: 16px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h1 {
      font-size: 20px;
      color: #ef4444;
      text-shadow: 3px 3px 0 #7f1d1d;
      margin: 0;
      line-height: 1.4;
    }

    .overlay p {
      font-size: 10px;
      color: #38bdf8;
      line-height: 1.8;
      margin: 0;
    }

    .overlay .final-score {
      font-size: 13px;
      color: #facc15;
    }

    .arcade-btn {
      background: linear-gradient(180deg, #facc15, #ca8a04);
      color: #000000;
      border: 3px solid #fef08a;
      border-radius: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 14px 22px;
      cursor: pointer;
      box-shadow: 0 5px 0 #854d0e;
      touch-action: manipulation;
    }

    .arcade-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #854d0e;
    }

    @media (min-width: 768px) {
      .dpad {
        grid-template-columns: repeat(3, 44px);
        grid-template-rows: repeat(3, 38px);
      }
      .jump-btn {
        width: 74px;
        height: 74px;
      }
    }
  </style>
</head>
<body>
  <div class="arcade-cabinet">
    <div class="screen-bezel">
      <canvas id="gameCanvas" width="448" height="512"></canvas>
      <div class="crt-overlay"></div>

      <!-- Start / Game Over Overlay -->
      <div id="gameOverlay" class="overlay">
        <h1 id="overlayTitle">RETRO KONG</h1>
        <p id="overlayDesc">CLIMB THE GIRDERS!<br>JUMP OVER BARRELS!<br>RESCUE THE PRINCESS!</p>
        <div id="finalScoreText" class="final-score hidden">SCORE: 000000</div>
        <button id="startBtn" class="arcade-btn">INSERT COIN / PLAY</button>
        <p style="color:#94a3b8; font-size:8px;">ARROWS / WASD + SPACE</p>
      </div>
    </div>

    <!-- On-screen Touch & Mouse Controls -->
    <div class="controls-panel">
      <div class="dpad">
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="up" aria-label="Up">▲</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="left" aria-label="Left">◀</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="right" aria-label="Right">▶</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="down" aria-label="Down">▼</button>
        <div class="dpad-empty"></div>
      </div>

      <div class="center-actions">
        <button id="muteBtn" class="mute-btn">SFX: ON</button>
      </div>

      <button id="jumpBtn" class="jump-btn" aria-label="Jump">JUMP</button>
    </div>
  </div>

  <script>
    /**
     * Retro Kong Arcade - Complete 1981-inspired Platformer
     * Single-file HTML5 Canvas + Web Audio API implementation
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const finalScoreText = document.getElementById('finalScoreText');
    const startBtn = document.getElementById('startBtn');
    const muteBtn = document.getElementById('muteBtn');
    const jumpBtn = document.getElementById('jumpBtn');

    // Logical arcade resolution
    const W = 448;
    const H = 512;

    // ---------------------------------------------------------
    // 1. WEB AUDIO API (8-BIT RETRO SOUND EFFECTS)
    // ---------------------------------------------------------
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freqStart, freqEnd, duration, type = 'square', volume = 0.12) {
      if (isMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
        if (freqEnd !== freqStart) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Ignore audio errors if blocked
      }
    }

    const sfx = {
      jump: () => playTone(260, 580, 0.16, 'square', 0.1),
      score: () => {
        playTone(660, 660, 0.08, 'square', 0.1);
        setTimeout(() => playTone(990, 990, 0.14, 'square', 0.1), 70);
      },
      hit: () => playTone(220, 55, 0.45, 'sawtooth', 0.15),
      win: () => {
        const notes = [523, 659, 784, 1046];
        notes.forEach((n, i) => {
          setTimeout(() => playTone(n, n, 0.14, 'square', 0.12), i * 110);
        });
      },
      throwBarrel: () => playTone(140, 90, 0.08, 'triangle', 0.08)
    };

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? 'SFX: OFF' : 'SFX: ON';
    });

    // ---------------------------------------------------------
    // 2. LEVEL GEOMETRY (6 SLANTED GIRDERS + TOP PLATFORM)
    // ---------------------------------------------------------
    // Each girder has x1, y1, x2, y2.
    // Index 0 = bottom, Index 5 = top ape girder, Index 6 = princess platform
    const girders = [
      { x1: 16,  y1: 484, x2: 432, y2: 468 }, // 0: Bottom (slopes up to right)
      { x1: 16,  y1: 404, x2: 404, y2: 420 }, // 1: Slopes down to right
      { x1: 44,  y1: 348, x2: 432, y2: 332 }, // 2: Slopes up to right
      { x1: 16,  y1: 268, x2: 404, y2: 284 }, // 3: Slopes down to right
      { x1: 44,  y1: 212, x2: 432, y2: 196 }, // 4: Slopes up to right
      { x1: 16,  y1: 136, x2: 404, y2: 146 }, // 5: Ape girder (flat-ish, slight slope)
      { x1: 168, y1: 88,  x2: 268, y2: 88  }  // 6: Princess top platform
    ];

    // Helper: Get exact Y on a girder at given X
    function getGirderY(index, x) {
      const g = girders[index];
      if (x < g.x1 || x > g.x2) return null;
      const t = (x - g.x1) / (g.x2 - g.x1);
      return g.y1 + t * (g.y2 - g.y1);
    }

    // Climbable ladders connecting girders
    const ladders = [
      { x: 368, bottomGirder: 0, topGirder: 1 },
      { x: 96,  bottomGirder: 1, topGirder: 2 },
      { x: 208, bottomGirder: 1, topGirder: 2 },
      { x: 356, bottomGirder: 2, topGirder: 3 },
      { x: 112, bottomGirder: 3, topGirder: 4 },
      { x: 248, bottomGirder: 3, topGirder: 4 },
      { x: 364, bottomGirder: 4, topGirder: 5 },
      { x: 252, bottomGirder: 5, topGirder: 6 } // Leads to Princess!
    ];

    // Decorative broken ladders (classic arcade detail)
    const brokenLadders = [
      { x: 180, yTop: 422, yBottom: 434 },
      { x: 180, yTop: 460, yBottom: 474 },
      { x: 144, yTop: 280, yBottom: 294 },
      { x: 144, yTop: 324, yBottom: 340 }
    ];

    // ---------------------------------------------------------
    // 3. GAME STATE
    // ---------------------------------------------------------
    let gameState = 'MENU'; // MENU, PLAYING, HIT, WIN, GAMEOVER
    let score = 0;
    let highScore = parseInt(localStorage.getItem('retroKongHighScore') || '0', 10);
    let level = 1;
    let lives = 3;
    let bonus = 5000;
    let bonusTimer = 0;
    let stateTimer = 0;
    let frameCount = 0;

    // Input state
    const keys = {
      left: false,
      right: false,
      up: false,
      down: false,
      jump: false
    };

    // Player object
    const player = {
      x: 68,
      y: 482,
      vx: 0,
      vy: 0,
      w: 16,
      h: 22,
      facing: 1, // 1 = right, -1 = left
      onGround: true,
      onLadder: false,
      currentGirder: 0,
      walkFrame: 0,
      jumpScoredBarrels: new Set()
    };

    // Ape / Gorilla state
    const ape = {
      x: 64,
      y: 136,
      throwTimer: 0,
      animState: 'idle' // idle, beat, throw
    };

    // Barrels & Floating Popups
    let barrels = [];
    let popups = [];

    function resetPlayer() {
      player.x = 68;
      player.y = getGirderY(0, 68);
      player.vx = 0;
      player.vy = 0;
      player.facing = 1;
      player.onGround = true;
      player.onLadder = false;
      player.currentGirder = 0;
      player.jumpScoredBarrels.clear();
    }

    function startNewGame() {
      initAudio();
      score = 0;
      level = 1;
      lives = 3;
      bonus = 5000;
      barrels = [];
      popups = [];
      resetPlayer();
      ape.throwTimer = 1.0;
      gameState = 'PLAYING';
      overlay.classList.add('hidden');
    }

    function nextLevel() {
      level++;
      bonus = 5000;
      barrels = [];
      popups = [];
      resetPlayer();
      ape.throwTimer = 1.0;
      gameState = 'PLAYING';
    }

    function addScore(pts) {
      score += pts;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('retroKongHighScore', highScore.toString());
      }
    }

    // ---------------------------------------------------------
    // 4. INPUT HANDLING (KEYBOARD + TOUCH)
    // ---------------------------------------------------------
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === ' ' || e.code === 'Space') {
        if (gameState === 'MENU' || gameState === 'GAMEOVER') {
          startNewGame();
        } else {
          keys.jump = true;
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === ' ' || e.code === 'Space') keys.jump = false;
    });

    // Touch / Mouse D-Pad bindings
    document.querySelectorAll('.dpad-btn').forEach((btn) => {
      const key = btn.dataset.key;
      const press = (e) => {
        e.preventDefault();
        initAudio();
        keys[key] = true;
        btn.classList.add('active');
      };
      const release = (e) => {
        e.preventDefault();
        keys[key] = false;
        btn.classList.remove('active');
      };
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
    });

    // Jump Button bindings
    const pressJump = (e) => {
      e.preventDefault();
      initAudio();
      keys.jump = true;
      jumpBtn.classList.add('active');
    };
    const releaseJump = (e) => {
      e.preventDefault();
      keys.jump = false;
      jumpBtn.classList.remove('active');
    };
    jumpBtn.addEventListener('mousedown', pressJump);
    jumpBtn.addEventListener('mouseup', releaseJump);
    jumpBtn.addEventListener('mouseleave', releaseJump);
    jumpBtn.addEventListener('touchstart', pressJump, { passive: false });
    jumpBtn.addEventListener('touchend', releaseJump, { passive: false });
    jumpBtn.addEventListener('touchcancel', releaseJump, { passive: false });

    startBtn.addEventListener('click', startNewGame);

    // ---------------------------------------------------------
    // 5. UPDATE LOGIC
    // ---------------------------------------------------------
    function spawnBarrel() {
      const speed = 1.65 + Math.min(level - 1, 5) * 0.18;
      barrels.push({
        id: Math.random(),
        x: ape.x + 36,
        y: getGirderY(5, ape.x + 36),
        vx: speed,
        vy: 0,
        girder: 5,
        onLadder: false,
        rot: 0
      });
      sfx.throwBarrel();
    }

    function update(dt) {
      frameCount++;

      if (gameState === 'HIT') {
        stateTimer -= dt;
        if (stateTimer <= 0) {
          lives--;
          if (lives <= 0) {
            gameState = 'GAMEOVER';
            overlayTitle.textContent = 'GAME OVER';
            overlayDesc.innerHTML = 'THE BARRELS GOT YOU!';
            finalScoreText.textContent = `FINAL SCORE: ${String(score).padStart(6, '0')}`;
            finalScoreText.classList.remove('hidden');
            startBtn.textContent = 'PLAY AGAIN';
            overlay.classList.remove('hidden');
          } else {
            barrels = [];
            resetPlayer();
            gameState = 'PLAYING';
          }
        }
        return;
      }

      if (gameState === 'WIN') {
        stateTimer -= dt;
        if (stateTimer <= 0) {
          nextLevel();
        }
        return;
      }

      if (gameState !== 'PLAYING') return;

      // Bonus countdown
      bonusTimer += dt;
      if (bonusTimer >= 2.0) {
        bonusTimer = 0;
        if (bonus > 100) bonus -= 100;
      }

      // Ape barrel throwing
      const throwInterval = Math.max(1.3, 2.7 - (level - 1) * 0.25);
      ape.throwTimer -= dt;
      if (ape.throwTimer <= 0.35 && ape.throwTimer > 0) {
        ape.animState = 'throw';
      } else if (ape.throwTimer <= 0) {
        spawnBarrel();
        ape.throwTimer = throwInterval;
        ape.animState = 'idle';
      } else if (Math.floor(frameCount / 20) % 2 === 0) {
        ape.animState = 'beat';
      } else {
        ape.animState = 'idle';
      }

      // --- PLAYER MOVEMENT ---
      const moveSpeed = 1.9;
      const climbSpeed = 1.5;

      // Check if player is near any ladder
      let activeLadder = null;
      for (const lad of ladders) {
        if (Math.abs(player.x - lad.x) < 10) {
          const yBot = getGirderY(lad.bottomGirder, lad.x);
          const yTop = getGirderY(lad.topGirder, lad.x);
          if (player.y <= yBot + 6 && player.y >= yTop - 6) {
            activeLadder = lad;
            break;
          }
        }
      }

      if (player.onLadder) {
        // Climbing state
        player.vx = 0;
        player.vy = 0;
        if (keys.up) {
          player.y -= climbSpeed;
          player.walkFrame += 0.2;
        } else if (keys.down) {
          player.y += climbSpeed;
          player.walkFrame += 0.2;
        }

        if (activeLadder) {
          const yBot = getGirderY(activeLadder.bottomGirder, activeLadder.x);
          const yTop = getGirderY(activeLadder.topGirder, activeLadder.x);
          if (player.y <= yTop) {
            player.y = yTop;
            player.onLadder = false;
            player.onGround = true;
            player.currentGirder = activeLadder.topGirder;
          } else if (player.y >= yBot) {
            player.y = yBot;
            player.onLadder = false;
            player.onGround = true;
            player.currentGirder = activeLadder.bottomGirder;
          }
        } else {
          player.onLadder = false;
        }
      } else {
        // Normal running & jumping
        if (keys.left) {
          player.vx = -moveSpeed;
          player.facing = -1;
          player.walkFrame += 0.22;
        } else if (keys.right) {
          player.vx = moveSpeed;
          player.facing = 1;
          player.walkFrame += 0.22;
        } else {
          player.vx = 0;
        }

        // Enter ladder
        if (activeLadder && (keys.up || keys.down)) {
          const yBot = getGirderY(activeLadder.bottomGirder, activeLadder.x);
          const yTop = getGirderY(activeLadder.topGirder, activeLadder.x);
          if (keys.up && player.y > yTop + 2) {
            player.onLadder = true;
            player.onGround = false;
            player.x = activeLadder.x;
          } else if (keys.down && player.y < yBot - 2) {
            player.onLadder = true;
            player.onGround = false;
            player.x = activeLadder.x;
          }
        }

        // Jump
        if (keys.jump && player.onGround) {
          player.vy = -4.6;
          player.onGround = false;
          player.jumpScoredBarrels.clear();
          sfx.jump();
        }

        // Apply gravity & velocity
        player.x += player.vx;
        player.x = Math.max(20, Math.min(W - 20, player.x));

        if (!player.onGround) {
          player.vy += 0.24;
          player.y += player.vy;

          // Check landing on any girder
          if (player.vy >= 0) {
            for (let i = 0; i < girders.length; i++) {
              const gy = getGirderY(i, player.x);
              if (gy !== null && player.y >= gy && player.y - player.vy <= gy + 6) {
                player.y = gy;
                player.vy = 0;
                player.onGround = true;
                player.currentGirder = i;
                break;
              }
            }
          }
        } else {
          // Follow slanted girder
          const gy = getGirderY(player.currentGirder, player.x);
          if (gy !== null) {
            player.y = gy;
          } else {
            player.onGround = false;
          }
        }
      }

      // Check Win Condition (Reached Princess platform #6)
      if (player.currentGirder === 6 && player.onGround && player.x <= 245) {
        addScore(bonus);
        sfx.win();
        gameState = 'WIN';
        stateTimer = 2.0;
        return;
      }

      // --- BARREL PHYSICS & COLLISIONS ---
      for (let i = barrels.length - 1; i >= 0; i--) {
        const b = barrels[i];
        b.rot += b.vx * 0.12;

        if (b.onLadder) {
          b.y += 2.2;
          const targetY = getGirderY(b.girder, b.x);
          if (targetY !== null && b.y >= targetY) {
            b.y = targetY;
            b.onLadder = false;
            // Reverse direction when reaching new girder
            b.vx = (b.girder % 2 === 0 ? -1 : 1) * Math.abs(b.vx);
          }
        } else {
          b.x += b.vx;
          const gy = getGirderY(b.girder, b.x);

          if (gy !== null) {
            b.y = gy;
            // Occasionally drop down a ladder
            for (const lad of ladders) {
              if (lad.topGirder === b.girder && Math.abs(b.x - lad.x) < 3 && Math.random() < 0.25) {
                b.onLadder = true;
                b.girder = lad.bottomGirder;
                b.x = lad.x;
                break;
              }
            }
          } else {
            // Fell off edge of girder
            b.vy += 0.25;
            b.y += b.vy;
            if (b.girder > 0) {
              const nextGirder = b.girder - 1;
              const nextY = getGirderY(nextGirder, b.x);
              if (nextY !== null && b.y >= nextY) {
                b.y = nextY;
                b.vy = 0;
                b.girder = nextGirder;
                b.vx = (nextGirder % 2 === 0 ? -1 : 1) * Math.abs(b.vx);
              }
            }
          }
        }

        // Remove barrel if it reaches bottom-left oil drum
        if (b.girder === 0 && b.x <= 56) {
          barrels.splice(i, 1);
          continue;
        }
        if (b.y > H + 20) {
          barrels.splice(i, 1);
          continue;
        }

        // Check Jump-Over Score (+100)
        if (!player.onGround && !player.onLadder && !player.jumpScoredBarrels.has(b.id)) {
          if (Math.abs(player.x - b.x) < 12 && player.y < b.y - 6 && player.y > b.y - 42) {
            player.jumpScoredBarrels.add(b.id);
            addScore(100);
            sfx.score();
            popups.push({ x: player.x, y: player.y - 24, text: '100', life: 0.8 });
          }
        }

        // Check Collision with Player
        const dx = Math.abs(player.x - b.x);
        const dy = Math.abs((player.y - 10) - (b.y - 6));
        if (dx < 11 && dy < 11) {
          sfx.hit();
          gameState = 'HIT';
          stateTimer = 1.3;
          return;
        }
      }

      // Update floating popups
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].y -= 0.5;
        popups[i].life -= dt;
        if (popups[i].life <= 0) popups.splice(i, 1);
      }
    }

    // ---------------------------------------------------------
    // 6. RENDERING (PIXEL-ART STYLE ON CANVAS)
    // ---------------------------------------------------------
    function drawHUD() {
      ctx.font = '12px "Press Start 2P", monospace';
      ctx.textAlign = 'left';

      // 1UP
      ctx.fillStyle = '#ef4444';
      ctx.fillText('1UP', 24, 22);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(score).padStart(6, '0'), 14, 38);

      // HIGH SCORE
      ctx.fillStyle = '#ef4444';
      ctx.textAlign = 'center';
      ctx.fillText('HIGH SCORE', W / 2, 22);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(highScore).padStart(6, '0'), W / 2, 38);

      // Level
      ctx.fillStyle = '#38bdf8';
      ctx.textAlign = 'right';
      ctx.fillText(`L=${String(level).padStart(2, '0')}`, W - 20, 56);

      // Lives icons (mini red/blue caps)
      for (let i = 0; i < lives; i++) {
        const lx = 20 + i * 18;
        const ly = 50;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(lx, ly, 10, 4);
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(lx + 1, ly + 4, 8, 5);
      }

      // BONUS Box
      const bx = W - 96;
      const by = 66;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, 78, 30);
      ctx.fillStyle = '#ef4444';
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BONUS', bx + 39, by + 11);
      ctx.fillStyle = '#facc15';
      ctx.font = '11px "Press Start 2P", monospace';
      ctx.fillText(String(bonus).padStart(4, '0'), bx + 39, by + 25);
    }

    function drawGirder(g) {
      const dx = g.x2 - g.x1;
      const dy = g.y2 - g.y1;
      const len = Math.hypot(dx, dy);
      const steps = Math.floor(len / 12);

      // Top & Bottom rails
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(g.x1, g.y1);
      ctx.lineTo(g.x2, g.y2);
      ctx.moveTo(g.x1, g.y1 + 9);
      ctx.lineTo(g.x2, g.y2 + 9);
      ctx.stroke();

      // Truss zigzag
      ctx.strokeStyle = '#be123c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < steps; i++) {
        const t1 = i / steps;
        const t2 = (i + 1) / steps;
        const xA = g.x1 + t1 * dx;
        const yA = g.y1 + t1 * dy;
        const xB = g.x1 + t2 * dx;
        const yB = g.y1 + t2 * dy;
        if (i % 2 === 0) {
          ctx.moveTo(xA, yA + 1);
          ctx.lineTo(xB, yB + 8);
        } else {
          ctx.moveTo(xA, yA + 8);
          ctx.lineTo(xB, yB + 1);
        }
      }
      ctx.stroke();
    }

    function drawLadders() {
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 2;

      for (const lad of ladders) {
        const yTop = getGirderY(lad.topGirder, lad.x);
        const yBot = getGirderY(lad.bottomGirder, lad.x);

        // Rails
        ctx.beginPath();
        ctx.moveTo(lad.x - 6, yTop);
        ctx.lineTo(lad.x - 6, yBot);
        ctx.moveTo(lad.x + 6, yTop);
        ctx.lineTo(lad.x + 6, yBot);
        ctx.stroke();

        // Rungs
        for (let y = yTop + 6; y < yBot - 2; y += 7) {
          ctx.beginPath();
          ctx.moveTo(lad.x - 6, y);
          ctx.lineTo(lad.x + 6, y);
          ctx.stroke();
        }
      }

      // Decorative broken ladders
      for (const bl of brokenLadders) {
        ctx.beginPath();
        ctx.moveTo(bl.x - 6, bl.yTop);
        ctx.lineTo(bl.x - 6, bl.yBottom);
        ctx.moveTo(bl.x + 6, bl.yTop);
        ctx.lineTo(bl.x + 6, bl.yBottom);
        ctx.stroke();
        for (let y = bl.yTop + 4; y < bl.yBottom; y += 6) {
          ctx.beginPath();
          ctx.moveTo(bl.x - 6, y);
          ctx.lineTo(bl.x + 6, y);
          ctx.stroke();
        }
      }
    }

    function drawBarrelStack() {
      const bx = 18;
      const by = getGirderY(5, 24) - 24;
      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 2; col++) {
          const x = bx + col * 14;
          const y = by + row * 12;
          ctx.fillStyle = '#d97706';
          ctx.fillRect(x, y, 12, 11);
          ctx.fillStyle = '#78350f';
          ctx.fillRect(x, y + 3, 12, 2);
          ctx.fillRect(x, y + 7, 12, 2);
        }
      }
    }

    function drawOilDrum() {
      const x = 36;
      const y = getGirderY(0, 44) - 22;
      // Drum
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(x, y, 18, 22);
      ctx.fillStyle = '#93c5fd';
      ctx.fillRect(x, y + 4, 18, 2);
      ctx.fillRect(x, y + 16, 18, 2);
      ctx.fillStyle = '#ffffff';
      ctx.font = '6px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('OIL', x + 9, y + 13);

      // Animated Flames
      const flicker = Math.floor(frameCount / 6) % 2;
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(x + 2, y);
      ctx.lineTo(x + 6, y - 10 - flicker * 4);
      ctx.lineTo(x + 10, y - 4);
      ctx.lineTo(x + 14, y - 12 + flicker * 3);
      ctx.lineTo(x + 17, y);
      ctx.fill();

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.moveTo(x + 5, y);
      ctx.lineTo(x + 9, y - 7 - flicker * 2);
      ctx.lineTo(x + 13, y);
      ctx.fill();
    }

    function drawApe() {
      const x = ape.x;
      const y = getGirderY(5, x);

      // Body
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(x - 16, y - 34, 32, 26);
      // Chest
      ctx.fillStyle = '#fb923c';
      ctx.fillRect(x - 10, y - 28, 20, 14);
      // Head
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(x - 10, y - 44, 20, 12);
      ctx.fillStyle = '#fdba74';
      ctx.fillRect(x - 7, y - 41, 14, 7);
      // Eyes
      ctx.fillStyle = '#000000';
      ctx.fillRect(x - 4, y - 40, 2, 2);
      ctx.fillRect(x + 2, y - 40, 2, 2);

      // Arms (animated)
      ctx.fillStyle = '#991b1b';
      if (ape.animState === 'throw') {
        ctx.fillRect(x + 14, y - 38, 12, 8);
        ctx.fillRect(x - 24, y - 30, 10, 14);
      } else if (ape.animState === 'beat') {
        ctx.fillRect(x - 24, y - 38, 10, 12);
        ctx.fillRect(x + 14, y - 38, 10, 12);
      } else {
        ctx.fillRect(x - 24, y - 30, 10, 18);
        ctx.fillRect(x + 14, y - 30, 10, 18);
      }

      // Legs
      ctx.fillRect(x - 14, y - 8, 10, 8);
      ctx.fillRect(x + 4, y - 8, 10, 8);
    }

    function drawPrincess() {
      const x = 196;
      const y = girders[6].y1;
      const wave = Math.floor(frameCount / 15) % 2;

      // Dress
      ctx.fillStyle = '#ec4899';
      ctx.fillRect(x - 6, y - 14, 12, 14);
      // Head
      ctx.fillStyle = '#fde047';
      ctx.fillRect(x - 4, y - 22, 8, 8);
      // Face
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(x - 2, y - 20, 5, 5);
      // Arms
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(x - 9, y - 14 - wave * 3, 3, 5);
      ctx.fillRect(x + 6, y - 14 - wave * 3, 3, 5);

      // "HELP!" text
      if (Math.floor(frameCount / 25) % 2 === 0) {
        ctx.fillStyle = '#22d3ee';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('HELP!', x + 12, y - 22);
      }
    }

    function drawPlayer() {
      if (gameState === 'HIT' && Math.floor(frameCount / 4) % 2 === 0) return;

      const x = Math.round(player.x);
      const y = Math.round(player.y);

      // Cap
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x - 5, y - 20, 10, 4);
      // Face
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(x - 4, y - 16, 8, 5);
      // Shirt
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(x - 5, y - 11, 10, 6);
      // Overalls / Legs
      ctx.fillStyle = '#ef4444';
      const step = Math.floor(player.walkFrame) % 2;
      if (!player.onGround && !player.onLadder) {
        ctx.fillRect(x - 6, y - 5, 5, 5);
        ctx.fillRect(x + 1, y - 6, 5, 5);
      } else if (player.vx !== 0 || player.onLadder) {
        ctx.fillRect(x - 5 + step * 2, y - 5, 4, 5);
        ctx.fillRect(x + 1 - step * 2, y - 5, 4, 5);
      } else {
        ctx.fillRect(x - 5, y - 5, 4, 5);
        ctx.fillRect(x + 1, y - 5, 4, 5);
      }
    }

    function drawBarrels() {
      for (const b of barrels) {
        ctx.save();
        ctx.translate(b.x, b.y - 6);
        ctx.rotate(b.rot);
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(5, 0);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawPopups() {
      ctx.font = '8px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      for (const p of popups) {
        ctx.fillText(p.text, p.x, p.y);
      }
    }

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      drawHUD();
      for (const g of girders) drawGirder(g);
      drawLadders();
      drawBarrelStack();
      drawOilDrum();
      drawApe();
      drawPrincess();
      drawBarrels();
      drawPlayer();
      drawPopups();

      if (gameState === 'WIN') {
        ctx.fillStyle = '#facc15';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('STAGE CLEAR!', W / 2, H / 2 - 20);
      }
    }

    // ---------------------------------------------------------
    // 7. MAIN GAME LOOP
    // ---------------------------------------------------------
    let lastTime = 0;
    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
