/* ---- buraco negro ------------------------------------------------ */
function updHole(dt) {
  const h = HOLE;
  if (!h) return;
  h.t += dt;
  if (h.s === 'grow') {
    h.r = Math.min(h.R, h.r + dt * 60);
    if (h.r >= h.R) h.s = 'on';
  } else if (h.s === 'shrink') {
    h.r -= dt * 120;
    if (h.r <= 0) { HOLE = null; return; }
  }
  if (h.s !== 'on') return;

  for (const p of vivos()) {
    const dx = h.x - (p.x + p.w/2),
          dy = h.y - (p.y + p.h/2),
          d = Math.hypot(dx,dy) || 1,
          f = 85 * dt;
    p.x += dx / d * f;
    p.y += dy / d * f;
    limitaArena(p); // gravidade suave (70px/s < velocidade da nave)
    if (cr(h.x, h.y, h.r * .5, hb(p))) dano(p);
  }

  const emit = B.ph === 2 || h.t < 4;
  h.e -= dt;
  h.cv -= dt;
  if (h.e <= 0 && emit) {
    h.e = .1;
    h.a += .3;
    const arms = B.ph === 2 ? 2 : 3;
    for (let i = 0; i < arms; i++) {
      const a = h.a + i * TAU / arms;
      E.push(bul(h.x, h.y, Math.cos(a) * 215, Math.sin(a) * 215, '#a0f', 5));
    }
  }
  if (h.cv <= 0 && emit) {
    h.cv = 2.4;
    for (const cx of [20, W - 20]) {
      const b0 = Math.atan2(H - h.y, cx - h.x);
      for (let j = -1; j <= 1; j++)
        E.push(bul(h.x, h.y, Math.cos(b0 + j * .13) * 255, Math.sin(b0 + j * .13) * 255, '#f80', 6));
    }
  } // rajadas rumo às quinas
}

/* ---- chefe ------------------------------------------------------- */
function updBoss(b,dt) {
  b.t += dt;
  b.hit -= dt;
  b.hg = Math.max(0, b.hg - dt);
  b.jaw = Math.max(0, b.jaw - dt * 1.6);
  const h = b.seg[0];

  b.sc += (b.sct - b.sc) * (1 - Math.exp(-1.3 * dt));
  SC = b.sc;
  PSC += Math.sign(b.pt - PSC) * Math.min(Math.abs(b.pt - PSC), dt * .127);
  // escalas independentes: chefe (SC) e naves (PSC)

  if (!LAS && !(ZN && !ZN.fired) && b.mode !== 'cone' && b.mode !== 'guarda')
    b.lw = Math.max(0, b.lw - dt * 2);

  if (b.st === 'dead') {
    b.mt -= dt;
    b.sd -= dt;
    shake = .35;
    if (b.sd <= 0 && b.ex < NS) {
      const s = b.seg[b.ex++];
      boom(s.x, s.y, ['#fff','#ff0','#f80',PAL[2][2]][rnd(0,4) | 0], 40, 320, 1.2);
      Som.boom();
      b.sd = .05;
    }
    if (b.mt <= 0) { B = null; fimJogo(true); }
    return;
  }

  const tri = u => Math.abs(((u % 2) + 2) % 2 - 1) * 2 - 1; // onda triangular = ida e volta com velocidade constante
  let tx = 400 + 300 * tri(b.t * [.2,.24,.28][b.ph - 1]),
      ty = [190,210,230][b.ph - 1],
      sp = b.st === 'enter' ? 230 : 520;

  if (b.mode === 'hole')        { tx = 400 + 250 * Math.cos(b.t * .8); ty = 170 + 40 * Math.sin(b.t * 1.6); }
  else if (b.mode === 'coil')   { tx = 400 + 120 * Math.cos(b.t * 2.2); ty = 230 + 70 * Math.sin(b.t * 2.2); }
  else if (b.mode === 'recua')  { tx = 400; ty = -230; sp = 450; }
  else if (b.mode === 'final')  { tx = 400; ty = 250; sp = 500; }
  else if (b.mode === 'guarda') {
    tx = 400 + 60 * Math.sin(b.t * .9); ty = 250; sp = 520;
    b.la = Math.PI / 2;
    b.lw = Math.min(1, b.lw + dt * 1.8);
    b.jaw = Math.max(b.jaw,.7);
  }
  else if (b.mode === 'cone') {
    b.ft += dt;
    tx = 400 + 190 * Math.sin(b.ft * .75); ty = 185; sp = 420;
    b.ca = angL(b.ca, coneAng(b), 1 - Math.exp(-2.2 * dt));
    b.la = b.ca;
    b.lw = Math.min(1, b.lw + dt * 1.8);
    b.jaw = Math.max(b.jaw,.75);
  }
  else if (b.mode === 'vl' && LAS) { tx = LAS.x; ty = 120; sp = 1000; }
  else if (b.mode === 'aim' && b.dv) {
    tx = b.dv.x0; ty = b.dv.y0; sp = 1500;
    b.m += dt;
    if (b.m >= b.tel) {
      resetCorpo(b, b.dv.x0, b.dv.y0, b.dv.ux, b.dv.uy);
      b.mode = 'lunge';
      b.m = 0;
      b.hin = false;
      b.fd = false;
      b.lzd = false;
      Som.verme();
      Som.rugido();
    }
  }

  if (b.mode === 'slither' && ZN && !ZN.fired) {
    tx = 400; ty = 250; sp = 800;
    b.la = Math.PI / 2;
    b.lw = Math.min(1, b.lw + dt * 1.8);
    b.jaw = Math.max(b.jaw,.8);
  } // carrega a explosão: vai ao centro e encara a arena

  if (b.mode === 'lunge' && b.dv) {
    h.cx += b.dv.ux * 1250 * dt;
    h.cy += b.dv.uy * 1250 * dt;
    b.m += dt;
    const out = h.cx < -170 || h.cx > W + 170 || h.cy < -170 || h.cy > H + 170;
    if (!b.hin && h.cx > -60 && h.cx < W + 60 && h.cy > -60 && h.cy < H + 60) b.hin = true;
    if (!b.fd && h.cx > 10 && h.cx < W - 10 && h.cy > 10 && h.cy < H - 10) {
      b.fd = true;
      spit(b, SHOTS[b.ph - 1]);
    } // leque no início de cada investida, assim que a cabeça entra na tela (fora dela o projétil seria descartado)
    if (b.hin && !b.lzd && out) {
      b.lzd = true;
      if (b.ph === 3) {
        b.lz.push({ x0:b.dv.x0, y0:b.dv.y0, ux:b.dv.ux, uy:b.dv.uy, age:0 });
        Som.alerta();
      }
    } // laser residual só na fase 3   // logo após o chefe passar, nasce um laser na mesma faixa e fica até o fim das 5 investidas
    if (b.m > .5 && b.seg.every(s => s.cx < -170 || s.cx > W + 170 || s.cy < -170 || s.cy > H + 170)) {
      b.dives--;
      b.dv = null;
      resetCorpo(b,400);
      b.mode = 'slither';
      if (b.dives > 0) aim(b);
    } // só termina quando a cauda saiu da tela
  }
  else {
    const dx = tx - h.cx, dy = ty - h.cy, d = Math.hypot(dx,dy) || 1, m = Math.min(d, sp * dt);
    h.cx += dx / d * m;
    h.cy += dy / d * m;
  }

  for (let i = 1; i < NS; i++) {
    const p = b.seg[i - 1],
          s = b.seg[i],
          dx = s.cx - p.cx,
          dy = s.cy - p.cy,
          d = Math.hypot(dx,dy) || 1,
          w = spc(i);
    s.cx = p.cx + dx / d * w;
    s.cy = p.cy + dy / d * w;
  }
  for (const s of b.seg) { s.x = s.cx; s.y = s.cy; }
  for (let i = 1; i < NS; i++) {
    const p = b.seg[i - 1], s = b.seg[i];
    s.a = Math.atan2(p.y - s.y, p.x - s.x);
  }
  h.a = b.seg[1].a;
  if (b.lw > 0) h.a = angL(h.a, b.la, b.lw);

  if (b.st === 'enter') {
    shake = Math.max(shake,.15); // ENTRADA ÉPICA: desce devagar, treme a tela e ruge duas vezes
    if (b.t > 1.5 && !b.e1) { b.e1 = 1; Som.verme(); flash = .8; }
    if (b.t > 3.2 && !b.e2) { b.e2 = 1; Som.verme(); Som.impacto(); flash = 1; }
    if (b.t > 4.8) b.st = 'fight';
    return;
  }

  b.sn = (b.sn || 0) - dt;
  if (b.sn <= 0 && h.y > 0) { Som.rastejar(); b.sn = 1.1; } // rastejar contínuo

  if (b.tr > 0) {
    if (b.wv) {
      if (A.length) b.tr = Math.max(b.tr,2);
      else { b.wv = false; b.tr = Math.min(b.tr,1.2); }
    }
    b.tr -= dt;
    if (Math.random() < dt * 14) boom(h.x, h.y, PAL[b.ph][3], 8, 200, .6);
    if (b.tr <= 0) { b.ph++; b.mode = 'slither'; b.cd = 1.5; b.n = 0; b.last = ''; }
    return;
  } // transição explícita: ninguém ataca até aqui

  if (!b.atk) {
    b.cd -= dt;
    if (b.cd <= 0 && vivos().length) begin(b);
  } else {
    b.at += dt;
    while (b.q.length && b.q[0].t <= b.at) b.q.shift().f();
    if (b.atk === 'vl') {
      updVL(b,dt);
      if (LAS && LAS.done) endAtk(b);
    }
    else if (b.atk === 'dive') {
      if (b.dives <= 0 && b.mode === 'slither') {
        b.hold += dt;
        if (b.hold > (b.ph === 3 ? 1.6 : .6)) endAtk(b);
      }
    }
    else if (b.atk === 'final') updFinal(b,dt);
    else if (b.at >= b.len) endAtk(b);
  }

  if (b.fan && b.atk && !(LAS && LAS.s === 'fire') && b.mode !== 'aim' && b.mode !== 'lunge') {
    b.fanT -= dt;
    if (b.fanT <= 0) { b.fanT = b.fan; spit(b, SHOTS[b.ph - 1]); }
  } // leque periódico

  if (b.mode !== 'aim')
    for (const p of vivos()) {
      const r = hb(p);
      for (let i = 0; i < NS; i++) {
        const s = b.seg[i];
        if (s.y > -20 && cr(s.x, s.y, rad(i) * .95, r)) { dano(p); break; }
      }
    } // contato com o corpo
}

/* ---- update principal -------------------------------------------- */
function update(dt) {
  T += dt;
  for (const s of stars) { s.y += s.z * 20 * dt; if (s.y > H) { s.y = 0; s.x = rnd(0,W); } }
  for (const q of PT) { q.x += q.vx * dt; q.y += q.vy * dt; q.l -= dt; }
  PT = PT.filter(q => q.l > 0);
  for (const q of HT) { q.y -= 45 * dt; q.l -= dt; }
  HT = HT.filter(q => q.l > 0);

  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt * 1.4;
  if (banner.t > 0) banner.t -= dt;

  if (estado === 'AVISO') {
    avisoT -= dt;
    if (Math.floor(T * 4) % 2 && Math.random() < .2) Som.alerta();
    if (avisoT <= 0) {
      B = novoBoss();
      estado = 'PLAY';
      Som.entrada();
      banner = { t:4.6, s:'LEVIATÃ DO VAZIO', u:'O DEVORADOR DE ESTRELAS' };
    }
    return;
  }
  if (estado !== 'PLAY' && estado !== 'VITORIA') return;
  if (estado === 'VITORIA') {
    if (Math.random() < dt * 4)
      boom(rnd(100,700), rnd(80,350), ['#f0f','#0ff','#ff0','#5f5'][rnd(0,4) | 0], 60, 230, 1.5);
    return;
  }

  movePlayers(dt);

  for (const p of vivos()) {
    const dn = keys[p.k.cl.t];
    p.cd -= dt; p.inv -= dt; p.esc -= dt; p.vel -= dt;

    if (p.arma === 'E') {
      // Charge: toque = tiro fraco · segurar e soltar = projétil grande (10 de dano, atravessa)
      if (dn) {
        if (p.hold === 0) Som.cargaStart(p.k.n, ct(p));
        p.hold += dt;
        if (!p.cr && p.hold >= ct(p)) { p.cr = 1; Som.cargaPronto(); }
      } else if (p.hold > 0) {
        Som.cargaStop(p.k.n);
        p.cr = 0;
        if (p.hold >= ct(p)) {
          PB.push({ x:p.x + p.w/2 - 17, y:p.y - 40, w:34, h:48, o:p, dm:10, ig:1, big:1, pi:1, hs:[] });
          Som.cargaTiro();
          p.cd = .2 * ct(p);
        } else if (p.cd <= 0) {
          PB.push({ x:p.x + p.w/2 - 1, y:p.y, w:2, h:6, o:p, dm:.5 });
          Som.tiro();
          p.cd = .25 * ct(p);
        }
        p.hold = 0;
      }
    } else if (dn && p.cd <= 0) {
      p.cd = (p.arma === 'L' ? .3 : .4) * ct(p);
      Som.tiro();
      disp(p);
    }
  }

  // tiros dos jogadores
  for (const b of PB) {
    if (b.rb) {
      if (b.ph === 0) {
        b.y -= 480 * dt;
        if (b.y <= H * .10) { b.ph = 1; b.pz = .15; b.hs = []; }
      } else if (b.ph === 1) {
        b.pz -= dt;
        if (b.pz <= 0) { b.ph = 2; b.hs = []; }
      } else b.y += 520 * dt;
    }
    else if (b.ch) {
      const t = alvo(b);
      if (t) {
        const dx = t.x - (b.x + b.w/2),
              dy = t.y - (b.y + b.h/2),
              d = Math.hypot(dx,dy) || 1;
        b.x += dx / d * 620 * dt;
        b.y += dy / d * 620 * dt;
      } else b.y -= 620 * dt;
    }
    else b.y -= (b.big ? 480 : 520) * dt;
  }

  if (B) updBoss(B,dt);
  updA(dt); updHole(dt); updRot(dt); updZN(dt); updSW(dt); updLZ(dt); updFL(dt); updPU(dt);

  // colisão tiro dos jogadores x aliens
  for (const b of PB)
    for (const a of [...A]) {
      if (b.y <= -50) break;
      if (hit(b,a) && usa(b,a)) {
        a.hp -= b.dm || 1;
        if (a.hp <= 0) matar(a,b.o);
        else boom(a.x + a.w/2, a.y + a.h/2, '#fff', 5, 90, .3);
        if (!b.rb && !b.pi) break;
      }
    }

  // colisão tiro dos jogadores x chefe
  if (B && B.st !== 'dead')
    for (const b of PB) {
      if (b.y <= -50) continue;
      if (HOLE && HOLE.s === 'on' && !b.ig && Math.hypot(b.x - HOLE.x, b.y - HOLE.y) < HOLE.r + 6) {
        b.y = -100;
        boom(b.x, HOLE.y + HOLE.r, '#a0f', 5, 80, .3);
        continue;
      } // o buraco negro engole tiros comuns
      const r = { x:b.x, y:b.y, w:b.w, h:b.h };
      for (let i = 0; i < NS; i++) {
        const s = B.seg[i];
        if (s.y < -10 || s.y > H + 10) continue;
        if (cr(s.x, s.y, rad(i), r) && usa(b,B)) {
          boom(b.x, b.y + 40, '#fff', 3, 70, .2);
          hurt((i ? .4 : 1) * (b.dm || 1), b.o, !i, b.big ? 'E' : 'p');
          if (!b.rb && !b.pi) break;
        }
      }
    }
  PB = PB.filter(b => b.y > -50 && b.y < H + 20);

  // zonas (barreiras, raios e avisos)
  for (const z of Z) {
    z.age += dt;
    if (z.dmg && z.age >= z.tel + .04 && z.age < z.tel + z.act) {
      const rs = z.kind === 'side' ? sideR(z) : [{ x:z.x, y:100, w:z.w, h:H }];
      for (const p of vivos()) if (rs.some(r => hit(hb(p), r))) dano(p);
    }
  }
  Z = Z.filter(z => z.age < z.tel + z.act + .3);

  // projéteis do chefe
  for (const e of E) {
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    for (const p of vivos()) if (cr(e.x, e.y, e.r * .8, hb(p))) { e.y = 1e4; dano(p); }
  }
  E = E.filter(e => e.y < H + 20 && e.y > -40 && e.x > -30 && e.x < W + 30);
}

function fimJogo(v) {
  estado = v ? 'VITORIA' : 'OVER';
  window.dispatchEvent(new CustomEvent('boss5:fim', { detail:{ vitoria:v, pontos:tot() } }));
}

function iniciar() {
  P = CFG.slice(0, dupla ? 2 : 1).map((k,i) => {
    const d = campanhaEntrada && campanhaEntrada[i] && typeof campanhaEntrada[i] === 'object' ? campanhaEntrada[i] : {};
    const base = {
      k, i,
      x: dupla ? (i ? 520 : 240) : 380,
      y: PY, px:0, py:0, w:39, h:24,
      cd:0, inv:2, vid: dupla ? 7 : 5, vivo:true,
      pts:0, mov:false, mult:0, esc:0, vel:0,
      arma:'', hold:0
    };
    const num = (v,fallback,min,max) => Number.isFinite(Number(v)) ? clamp(Math.floor(Number(v)),min,max) : fallback;
    return {
      ...base,
      vid: num(d.vid, base.vid, 1, 99),
      pts: num(d.pts, 0, 0, 999999999),
      mult: num(d.mult, 0, 0, 3),
      esc: Number.isFinite(Number(d.esc)) ? clamp(Number(d.esc),0,12) : 0,
      vel: Number.isFinite(Number(d.vel)) ? clamp(Number(d.vel),0,12) : 0,
      arma: ['C','E','L'].includes(d.arma) ? d.arma : ''
    };
  });
  Som.cargaStopAll();
  B = null; A = []; FX = []; E = []; FL = []; HT = []; PB = []; Z = []; PT = [];
  HOLE = null; LAS = null; ROT = null; ZN = null; SW = []; PU = [];
  PSC = 1; SC = 1.5; shake = flash = 0;
  estado = 'AVISO'; avisoT = 3;
}

/* =====================================================================
   11. ENTRADA (teclado / clique)
   ===================================================================== */
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','F1','F2','F3'].includes(e.code)) e.preventDefault();
  Som.init();
  keys[e.code] = true;
  const livre = estado === 'MENU' || estado === 'OVER' || estado === 'VITORIA';
  if ((e.code === 'F1' || e.code === 'Enter') && livre) iniciar();
  if ((e.code === 'F2' || e.code === 'Digit2' || e.code === 'Numpad2') && livre) dupla = true;
  if ((e.code === 'Digit1' || e.code === 'Numpad1') && livre) dupla = false;
  // F2 no Mac exige Fn: 1/2 e o botão MODO também funcionam
  if (e.code === 'KeyP') {
    if (estado === 'PLAY') estado = 'PAUSE';
    else if (estado === 'PAUSE') estado = 'PLAY';
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

// solta todas as teclas ao perder o foco (evita nave 'presa' andando sozinha ou travada com tecla fantasma)
const soltaTudo = () => {
  for (const k in keys) keys[k] = false;
  Som.cargaStopAll();
};
addEventListener('blur', soltaTudo);
document.addEventListener('visibilitychange', () => { if (document.hidden) soltaTudo(); });

cv.addEventListener('click', () => {
  Som.init();
  if (estado === 'MENU' || estado === 'OVER' || estado === 'VITORIA') iniciar();
});

/* =====================================================================
   12. DESENHO
   ===================================================================== */

// Nave original (desenho procedural idêntico ao jogo base), caixa 39x24
function nave(x,y,k,bl,sc = 1) {
  const col = bl ? '#fff' : k.cor,
        p1 = k.n === 'P1',
        dk = p1 ? '#0b6b26' : '#9a7000',
        li = p1 ? '#c8ffd8' : '#fff6b8',
        ac = p1 ? '#00c8ff' : '#ff7a1a';
  c.save();
  c.translate(x,y);
  c.scale(sc,sc);
  const fl = 5 + 3 * Math.sin(T * 50 + x * .1);
  for (const ex of [12.5,26.5]) {
    c.shadowColor = '#ff7a00';
    c.shadowBlur = 10;
    c.fillStyle = '#ff9a3a';
    poly([[ex-3,22],[ex,22+fl],[ex+3,22]]);
    c.shadowBlur = 0;
    c.fillStyle = '#fff3c4';
    poly([[ex-1.4,22],[ex,22+fl*.55],[ex+1.4,22]]);
  }
  c.fillStyle = dk;
  poly([[0,23],[2,12],[11,7],[14,22]]);
  poly([[39,23],[37,12],[28,7],[25,22]]);
  c.fillStyle = col;
  poly([[2,22],[4,13],[11,10],[13,21]]);
  poly([[37,22],[35,13],[28,10],[26,21]]);
  c.shadowColor = col;
  c.shadowBlur = 10;
  c.fillStyle = col;
  poly([[19.5,0],[25.5,9],[28,22],[11,22],[13.5,9]]);
  c.shadowBlur = 0;
  c.fillStyle = dk;
  poly([[19.5,6],[22,13],[21,22],[18,22],[17,13]]);
  c.fillStyle = ac;
  c.fillRect(8,17,3,2);
  c.fillRect(28,17,3,2);
  c.fillStyle = '#bff';
  c.beginPath(); c.ellipse(19.5,12,2.8,4.6,0,0,TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,.85)';
  c.beginPath(); c.ellipse(18.8,10.5,1,2,0,0,TAU); c.fill();
  c.fillStyle = Math.floor(T * 6) % 2 ? '#ff4d4d' : '#fff';
  c.fillRect(0,21,3,2);
  c.fillRect(36,21,3,2);
  c.fillStyle = li;
  c.fillRect(18.5,-3,2,5);
  c.restore();
}

/* ---- segmento da serpente --------------------------------------- */
function drawSeg(b,i,k) {
  const s = b.seg[i],
        r = rad(i);
  if (i > b.ex) {
    const p = b.seg[i - 1],
          w = (r + rad(i - 1)) * .96;
    // casco contínuo entre segmentos
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(s.x,s.y);
    c.lineTo(p.x,p.y);
    c.strokeStyle = rgba(k[2], .55);
    c.lineWidth = w + 4;
    c.stroke();
    c.strokeStyle = k[0];
    c.lineWidth = w;
    c.stroke();
    c.strokeStyle = rgba(k[1], .8);
    c.lineWidth = w * .5;
    c.stroke();
  }
  c.save();
  c.translate(s.x,s.y);
  c.rotate(s.a);
  if (i > 1) {
    c.fillStyle = k[2];
    for (const sg of [-1,1])
      poly([[-r*.55, sg*r*.85], [-r*.1, sg*(r + r*(i % 2 ? .45 : .9))], [r*.4, sg*r*.85]]);
  } // espinhos laterais
  c.fillStyle = k[0];
  c.beginPath(); c.ellipse(0,0,r*1.12,r,0,0,TAU); c.fill();
  c.fillStyle = rgba(k[1], .9);
  c.beginPath(); c.ellipse(-r*.05, -r*.22, r*.9, r*.55, 0, 0, TAU); c.fill();
  const g = c.createRadialGradient(r*.2, r*.15, 1, r*.2, r*.15, r*.9);
  g.addColorStop(0, rgba(k[2], .5));
  g.addColorStop(1, rgba(k[2], 0));
  c.fillStyle = g;
  c.beginPath(); c.ellipse(0,0,r*1.05,r*.95,0,0,TAU); c.fill(); // nebulosa
  c.strokeStyle = rgba(k[2], .55);
  c.lineWidth = 1.5;
  c.beginPath(); c.ellipse(0,0,r*1.12,r,0,0,TAU); c.stroke();
  c.strokeStyle = rgba(k[2], .4);
  c.beginPath(); c.arc(r*.6,0,r*.85,-1.1,1.1); c.stroke(); // junta da placa
  c.strokeStyle = rgba(k[3], .35);
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(r*.35, -r*.95); c.lineTo(r*.35, r*.95);
  c.moveTo(-r*.55, -r*.9); c.lineTo(-r*.55, r*.9);
  c.stroke();
  c.fillStyle = rgba(k[3], .22);
  c.beginPath();
  c.moveTo(-r*.9, -r*.15); c.lineTo(r*.2, -r*.5); c.lineTo(r*.9, 0);
  c.lineTo(r*.2, r*.5); c.lineTo(-r*.9, r*.15); c.closePath();
  c.fill(); // anéis de blindagem e placa dorsal
  for (let j = -1; j <= 1; j++) {
    c.beginPath(); c.arc(-r*.5, j*r*.5, r*.36, -1.3, 1.3); c.stroke();
    c.beginPath(); c.arc(-r*.1, j*r*.5 + r*.25*(j ? 0 : 1), r*.2, -1.3, 1.3); c.stroke();
  } // placas em escama
  for (let j = 0; j < 5; j++) {
    const a = i * 2.3 + j * 1.7,
          d = (.15 + .6 * ((i*7 + j*3) % 5) / 5) * r;
    c.fillStyle = rgba('#ffffff', .25 + .6 * Math.abs(Math.sin(T*2 + i + j)));
    c.fillRect(Math.cos(a)*d, Math.sin(a)*d*.8, 1.8, 1.8);
  } // estrelas dentro da carapaça
  const w = .5 + .5 * Math.sin(T*4 - i*.5);
  c.strokeStyle = rgba(k[3], .3 + .4*w);
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(-r*.6, -r*.3); c.lineTo(-r*.1, 0); c.lineTo(-r*.6, r*.3);
  c.stroke(); // runa
  c.fillStyle = rgba(k[3], .25 + .6*w);
  c.beginPath(); c.ellipse(-r*.15, 0, r*.3, r*.16, 0, 0, TAU); c.fill(); // onda de energia ao longo do corpo
  c.restore();
}

/* ---- cabeça do Leviatã ------------------------------------------ */
function drawHead(b,k) {
  const s = b.seg[0],
        f = b.hit > 0;
  c.save();
  c.translate(s.x,s.y);
  c.rotate(s.a);
  c.scale(SC,SC);
  const j = .12 + b.jaw*.5 + (b.mode === 'aim' || b.mode === 'lunge' ? .35 : 0) + .04 * Math.sin(b.t*5);
  const g = c.createRadialGradient(54,0,2,54,0,10 + j*55);
  g.addColorStop(0,k[3]);
  g.addColorStop(.4,rgba(k[2],.8));
  g.addColorStop(1,rgba(k[2],0));
  c.fillStyle = g;
  c.beginPath(); c.arc(54,0,10 + j*55,0,TAU); c.fill(); // brilho da goela
  for (const sg of [-1,1]) {
    c.save();
    c.translate(24, sg*11);
    c.rotate(sg*j);
    c.scale(1,sg); // mandíbulas
    c.fillStyle = k[0];
    c.strokeStyle = k[2];
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(0,-4);
    c.quadraticCurveTo(30,-8,58,8);
    c.lineTo(36,5);
    c.lineTo(0,7);
    c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = k[3];
    for (let i = 0; i < 4; i++)
      poly([[8+i*10,-3],[13+i*10,-3],[10.5+i*10,-11]]);
    c.restore();
  }
  c.fillStyle = k[1];
  for (const sg of [-1,1]) {
    poly([[-4, sg*24], [-44, sg*56], [-30, sg*20]]);
    poly([[20, sg*20], [48, sg*36], [34, sg*16]]);
    poly([[-14, sg*20], [-76, sg*72], [-42, sg*12]]);
  } // chifres e presas
  c.fillStyle = k[2];
  for (const sg of [-1,1])
    poly([[-34, sg*14], [-92, sg*30], [-38, sg*6]]); // cristas traseiras
  c.fillStyle = k[3];
  for (const sg of [-1,1]) {
    poly([[30, sg*22], [74, sg*34], [46, sg*14]]);
    poly([[-2, sg*28], [18, sg*52], [14, sg*26]]);
  } // chifres frontais
  const sk = c.createLinearGradient(-26,0,48,0);
  sk.addColorStop(0,k[0]);
  sk.addColorStop(.5,k[1]);
  sk.addColorStop(1,k[0]);
  c.fillStyle = sk;
  c.strokeStyle = k[2];
  c.lineWidth = 2;
  c.shadowColor = k[2];
  c.shadowBlur = 14;
  c.beginPath();
  [[-26,-22],[-8,-30],[18,-22],[40,-10],[50,0],[40,10],[18,22],[-8,30],[-26,22]]
    .forEach((q,i) => i ? c.lineTo(q[0],q[1]) : c.moveTo(q[0],q[1]));
  c.closePath();
  c.fill(); c.stroke();
  c.shadowBlur = 0;
  for (const sg of [-1,1]) {
    c.fillStyle = k[0];
    poly([[2, sg*6], [30, sg*8], [22, sg*19], [0, sg*20]]);
    c.strokeStyle = rgba(k[3], .7);
    c.lineWidth = 1.4;
    c.beginPath();
    c.moveTo(2, sg*6); c.lineTo(30, sg*8); c.lineTo(22, sg*19); c.lineTo(0, sg*20);
    c.closePath(); c.stroke(); // placas de blindagem (no lugar dos olhos)
    c.fillStyle = rgba(k[3], .3 + .3 * Math.sin(b.t*3 + sg));
    c.beginPath();
    c.moveTo(6, sg*10); c.lineTo(24, sg*11); c.lineTo(18, sg*16); c.closePath();
    c.fill();
  }
  c.strokeStyle = rgba(k[2], .7);
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(-24,0); c.lineTo(40,0);
  c.moveTo(-10,-14); c.lineTo(20,-5);
  c.moveTo(-10,14); c.lineTo(20,5);
  c.moveTo(-6,-22); c.lineTo(-18,-8);
  c.moveTo(-6,22); c.lineTo(-18,8);
  c.stroke(); // placas do crânio
  c.shadowColor = k[3];
  c.shadowBlur = 18;
  c.fillStyle = rgba(k[3], .6 + .4 * Math.sin(b.t*4));
  c.beginPath();
  c.moveTo(-14,0); c.lineTo(-6,-7); c.lineTo(8,0); c.lineTo(-6,7); c.closePath();
  c.fill();
  c.shadowBlur = 0; // cristal do vazio na testa
  if (f) {
    c.fillStyle = 'rgba(255,255,255,.45)';
    c.beginPath(); c.ellipse(12,0,34,24,0,0,TAU); c.fill();
  }
  c.restore();
}

function drawBoss(b) {
  const k = PAL[b.ph - 1],
        h = b.seg[0];
  const g = c.createRadialGradient(h.x, h.y, 10, h.x, h.y, 260);
  g.addColorStop(0, rgba(k[2], .22));
  g.addColorStop(1, rgba(k[2], 0));
  c.fillStyle = g;
  c.fillRect(h.x - 260, h.y - 260, 520, 520);
  for (let i = NS - 1; i >= b.ex; i--) drawSeg(b,i,k);
  if (b.ex < 1) drawHead(b,k);
}

/* ---- barreiras laterais ----------------------------------------- */
function drawSide(z,k) {
  const a = z.cx - z.gw / 2,
        b = z.cx + z.gw / 2,
        y0 = 100,
        hh = H - y0,
        col = '#ff4b3a';
  if (z.age < z.tel) {
    const pl = Math.floor(T * 10) % 2;
    c.fillStyle = rgba(col, .06 + .09*pl);
    c.fillRect(0,y0,a,hh);
    c.fillRect(b,y0,W - b,hh);
    c.strokeStyle = rgba(col, .85);
    c.lineWidth = 2;
    c.setLineDash([10,8]);
    c.strokeRect(1,y0,a - 1,hh);
    c.strokeRect(b,y0,W - b - 1,hh);
    c.setLineDash([]);
    c.fillStyle = 'rgba(60,255,120,.10)';
    c.fillRect(a,y0,b - a,hh);
    c.strokeStyle = 'rgba(80,255,140,.85)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(a,y0); c.lineTo(a,H);
    c.moveTo(b,y0); c.lineTo(b,H);
    c.stroke();
    const q = (T * 1.3) % 1;
    for (let i = 0; i < 5; i++) {
      const yy = y0 + 90 + i * 140;
      txt('▶▶', a * (.1 + .5*q), yy, 22, rgba(col, .8), 'center', false);
      txt('◀◀', b + (W - b) * (.9 - .5*q), yy, 22, rgba(col, .8), 'center', false);
    }
    txt('ABERTURA', z.cx, y0 + hh*.5, 18, 'rgba(80,255,140,.8)', 'center', false);
    return;
  }
  const f = z.age > z.tel + z.act ? clamp(1 - (z.age - z.tel - z.act) / .3, 0, 1) : 1;
  c.save();
  c.globalAlpha = f;
  sideR(z).forEach((r,j) => {
    if (r.w < 1) return;
    const g = c.createLinearGradient(r.x,0,r.x + r.w,0);
    g.addColorStop(0, rgba(col, j ? .95 : .3));
    g.addColorStop(1, rgba(col, j ? .3 : .95));
    c.shadowColor = col;
    c.shadowBlur = 22;
    c.fillStyle = g;
    c.fillRect(r.x, r.y, r.w, r.h);
    c.shadowBlur = 0;
    c.fillStyle = '#fff';
    c.fillRect(j ? r.x - 1 : r.x + r.w - 2, r.y, 3, r.h); // borda de ataque
    c.fillStyle = rgba('#ffffff', .6);
    for (let i = 0; i < 26; i++)
      c.fillRect(r.x + ((i*61) % Math.max(4, r.w - 3)), y0 + ((T*480 + i*47) % hh), 2, 9);
  });
  c.restore();
}

/* ---- laser vertical --------------------------------------------- */
function drawLaser(b,k) {
  const L = LAS;
  if (!L) return;
  for (const w of L.wl) {
    const a = clamp(w.t / .3, 0, 1) * (L.s === 'rest' ? clamp((1.1 - L.t) / .3, 0, 1) : 1);
    c.save();
    c.globalAlpha = a;
    c.shadowColor = '#4fd';
    c.shadowBlur = 18;
    const g = c.createLinearGradient(w.x,0,w.x + w.w,0);
    g.addColorStop(0,'rgba(80,255,210,.3)');
    g.addColorStop(.5,'rgba(190,255,240,.9)');
    g.addColorStop(1,'rgba(80,255,210,.3)');
    c.fillStyle = g;
    c.fillRect(w.x, WY, w.w, 24);
    c.shadowBlur = 0;
    c.fillStyle = '#fff';
    c.fillRect(w.x, WY, w.w, 3);
    c.restore();
  } // paredes de energia = abrigo (sem dano)
  if (L.s !== 'charge' && L.s !== 'fire') return;
  const y0 = b.seg[0].y + 10,
        x1 = L.x - L.vw / 2,
        sg = beamSegs(L),
        rects = [
          [x1, y0, L.vw, WY - y0],
          ...sg.map(([s,e]) => [s, WY, e - s, H - WY])
        ];
  if (L.s === 'charge') {
    const q = L.t / 2.1,
          pl = .5 + .5 * Math.sin(T * 18 * (.4 + q));
    c.fillStyle = rgba(k[2], .05 + .13*q*pl);
    for (const r of rects) c.fillRect(...r);
    c.strokeStyle = rgba(k[3], .5 + .4*pl);
    c.lineWidth = 2;
    c.setLineDash([12,8]);
    c.strokeRect(x1, y0, L.vw, H - y0);
    c.setLineDash([]);
    const rr = 14 + 70*q,
          o = c.createRadialGradient(L.x, y0, 2, L.x, y0, rr);
    o.addColorStop(0,'#fff');
    o.addColorStop(.4, rgba(k[2], .8));
    o.addColorStop(1, rgba(k[2], 0));
    c.fillStyle = o;
    c.beginPath(); c.arc(L.x, y0, rr, 0, TAU); c.fill();
    return;
  }
  const a = L.t < .1 ? L.t / .1 : L.t > .7 ? clamp((.85 - L.t) / .15, 0, 1) : 1;
  c.save();
  c.globalAlpha = a;
  c.shadowColor = k[2];
  c.shadowBlur = 40;
  c.fillStyle = rgba(k[2], .6);
  for (const r of rects) c.fillRect(...r);
  c.shadowBlur = 0;
  c.fillStyle = rgba(k[3], .9);
  for (const r of rects) c.fillRect(r[0] + r[2]*.2, r[1], r[2]*.6, r[3]);
  c.fillStyle = '#fff';
  for (const r of rects) c.fillRect(r[0] + r[2]*.4, r[1], r[2]*.2, r[3]);
  for (const w of L.wl) {
    const e = c.createRadialGradient(w.x + w.w/2, WY, 2, w.x + w.w/2, WY, 50);
    e.addColorStop(0,'#fff');
    e.addColorStop(1,'rgba(127,255,212,0)');
    c.fillStyle = e;
    c.beginPath(); c.arc(w.x + w.w/2, WY, 50, 0, TAU); c.fill();
  }
  c.restore();
}

/* ---- lasers giratórios ------------------------------------------ */
function drawRot(k) {
  const R = ROT;
  if (!R) return;
  const on = R.t >= R.tel,
        a = on ? clamp((R.tel + R.dur - R.t) / .4, 0, 1) : 1,
        pl = .5 + .5 * Math.sin(T * 14);
  c.save();
  c.globalAlpha = a;
  c.lineCap = 'round';
  for (let i = 0; i < R.n; i++) {
    const an = R.a + i * TAU / R.n,
          ex = RPX + Math.cos(an) * RL,
          ey = RPY + Math.sin(an) * RL;
    if (!on) {
      c.strokeStyle = rgba(k[3], .3 + .4*pl);
      c.lineWidth = 3;
      c.setLineDash([12,8]);
      c.beginPath(); c.moveTo(RPX,RPY); c.lineTo(ex,ey); c.stroke();
      c.setLineDash([]);
      continue;
    }
    c.shadowColor = k[2];
    c.shadowBlur = 30;
    c.strokeStyle = rgba(k[2], .55);
    c.lineWidth = 44;
    c.beginPath(); c.moveTo(RPX,RPY); c.lineTo(ex,ey); c.stroke();
    c.shadowBlur = 0;
    c.strokeStyle = rgba(k[3], .95);
    c.lineWidth = 22;
    c.stroke();
    c.strokeStyle = '#fff';
    c.lineWidth = 8;
    c.stroke();
  }
  const o = c.createRadialGradient(RPX,RPY,2,RPX,RPY,46);
  o.addColorStop(0,'#fff');
  o.addColorStop(.4, rgba(k[2], .9));
  o.addColorStop(1, rgba(k[2], 0));
  c.fillStyle = o;
  c.beginPath(); c.arc(RPX,RPY,46,0,TAU); c.fill();
  c.restore();
}

/* ---- zonas seguras (devastador / explosão total) ---------------- */
function drawZN(k) {
  const Zn = ZN;
  if (!Zn) return;
  const pre = Zn.t < Zn.tel,
        q0 = Math.min(1, Zn.t / Zn.tel),
        pl = .5 + .5 * Math.sin(T * 10),
        col = Zn.kind === 'xplo' ? '#ff8a1a' : '#ff3030';
  c.save();
  c.beginPath();
  c.rect(0,0,W,H);
  for (const q of Zn.cs) { c.moveTo(q.x + q.r, q.y); c.arc(q.x, q.y, q.r, 0, TAU); }
  c.fillStyle = rgba(col, pre ? .08 + .1*q0 + .1*pl*q0 : clamp(.8 - (Zn.t - Zn.tel) * 1.6, 0, .8));
  c.fill('evenodd');
  for (const q of Zn.cs) {
    c.shadowColor = '#39ff7a';
    c.shadowBlur = 18;
    c.fillStyle = 'rgba(60,255,120,.10)';
    c.strokeStyle = 'rgba(80,255,140,.95)';
    c.lineWidth = 4;
    c.beginPath(); c.arc(q.x, q.y, q.r, 0, TAU); c.fill(); c.stroke();
    c.shadowBlur = 0;
    if (pre) {
      c.lineWidth = 2;
      c.beginPath(); c.arc(q.x, q.y, q.r * (1 + (1 - q0) * .6), 0, TAU); c.stroke();
    }
    txt('SEGURO', q.x, q.y - q.r - 10, 16, 'rgba(120,255,170,.95)', 'center', false);
  }
  c.restore();
}

/* ---- esfera de carga (guarda / cone) ---------------------------- */
function drawCharge(b,q,col) {
  const h = b.seg[0],
        R = (8 + 62 * q * q) * SC / 1.5,
        ox = h.x + Math.cos(h.a) * 50 * SC,
        oy = h.y + Math.sin(h.a) * 50 * SC,
        pl = .5 + .5 * Math.sin(T * 16); // esfera de energia na boca do chefe
  c.save();
  c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(ox, oy, 1, ox, oy, R * 2.4);
  g.addColorStop(0,'rgba(255,255,255,.95)');
  g.addColorStop(.25, rgba(col, .8));
  g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g;
  c.beginPath(); c.arc(ox, oy, R * 2.4, 0, TAU); c.fill();
  for (let i = 0; i < 20; i++) {
    const f = (T * 1.3 + i * .137) % 1,
          an = i * 2.399 + T * .8,
          d = R + (150 * SC / 1.5) * (1 - f);
    c.fillStyle = rgba(col, .15 + .7*f);
    c.fillRect(ox + Math.cos(an)*d - 2, oy + Math.sin(an)*d - 2, 4, 4);
  } // energia sendo sugada para dentro
  c.strokeStyle = rgba(col, .5 + .4*pl);
  c.lineWidth = 2;
  c.beginPath(); c.arc(ox, oy, R * 1.35, 0, TAU); c.stroke();
  c.restore();
}

function drawGuarda(b) {
  const q = Math.min(1, b.at / GC),
        pl = .5 + .5 * Math.sin(T * (b.heal ? 8 : 26)),
        col = '#5dff9a',
        g = Math.min(1, b.hg * 4);
  if (b.heal) {
    c.save();
    for (let i = b.ex; i < NS; i++) {
      const s = b.seg[i];
      if (s.y < -60 || s.y > H + 60) continue;
      const r = rad(i) * 1.3 + (i ? 0 : 14); // bolha de escudo sobre o corpo todo
      c.fillStyle = rgba(col, .09 + .06*pl + .28*g);
      c.beginPath(); c.arc(s.x, s.y, r, 0, TAU); c.fill();
      c.strokeStyle = rgba(col, .45 + .3*pl + .25*g);
      c.lineWidth = 2;
      c.stroke();
    }
    c.restore();
  }
  if (b.at < GC + .6) drawCharge(b,q,col); // esfera de carga na boca: cresce até o fim do escudo e pulsa rápido antes dos leques
}

function drawConeFX(b,k) {
  const h = b.seg[0],
        pl = .5 + .5 * Math.sin(T * 12);
  c.save();
  c.fillStyle = rgba(k[2], b.ft >= 1.8 ? .06 + .04*pl : .04 + .1 * b.ft / 1.8);
  c.beginPath();
  c.moveTo(h.x,h.y);
  c.arc(h.x, h.y, 1200, b.ca - .6, b.ca + .6);
  c.closePath();
  c.fill();
  c.restore();
}

function drawConeHead(b,k) {
  const h = b.seg[0],
        pl = .5 + .5 * Math.sin(T * 12);
  if (b.ft < 1.8) drawCharge(b, b.ft / 1.8, k[2]);
  c.save();
  c.strokeStyle = rgba('#ffffff', .5 + .4*pl);
  c.shadowColor = k[3];
  c.shadowBlur = 14;
  c.lineWidth = 3;
  c.setLineDash([8,6]);
  c.beginPath();
  c.arc(h.x, h.y, 48 * SC / 1.5, T * 2, T * 2 + TAU * .9);
  c.stroke();
  c.restore(); // anel na cabeça = único ponto vulnerável
}

function drawFL(k) {
  c.save();
  c.lineCap = 'round';
  for (const l of FL) {
    const on = l.age >= l.tel,
          ex = l.x0 + Math.cos(l.a) * 2400,
          ey = l.y0 + Math.sin(l.a) * 2400;
    if (!on) {
      c.strokeStyle = rgba(k[3], .35 + .4 * (.5 + .5 * Math.sin(T * 22)));
      c.lineWidth = 2;
      c.setLineDash([10,8]);
      c.beginPath(); c.moveTo(l.x0, l.y0); c.lineTo(ex, ey); c.stroke();
      c.setLineDash([]);
      continue;
    }
    c.globalAlpha = clamp((l.tel + l.act + .25 - l.age) / .25, 0, 1);
    c.shadowColor = k[2];
    c.shadowBlur = 22;
    c.strokeStyle = rgba(k[2], .7);
    c.lineWidth = 14;
    c.beginPath(); c.moveTo(l.x0, l.y0); c.lineTo(ex, ey); c.stroke();
    c.shadowBlur = 0;
    c.strokeStyle = '#fff';
    c.lineWidth = 4;
    c.stroke();
    c.globalAlpha = 1;
  }
  c.restore();
}

function drawSW(k) {
  if (!SW.length) return;
  c.save();
  c.lineCap = 'round';
  for (const w of SW) {
    const a0 = w.g + w.gw,
          a1 = w.g + TAU - w.gw;
    c.shadowColor = k[2];
    c.shadowBlur = 26;
    c.strokeStyle = rgba(k[2], .55);
    c.lineWidth = 30;
    c.beginPath(); c.arc(400,400,w.r,a0,a1); c.stroke();
    c.shadowBlur = 0;
    c.strokeStyle = rgba(k[3], .95);
    c.lineWidth = 12;
    c.stroke();
    c.strokeStyle = '#fff';
    c.lineWidth = 3;
    c.stroke();
  }
  c.restore();
}

function drawDV(b,k) {
  const d = b.dv,
        w = 2 * rad(1) * .8,
        pl = .5 + .5 * Math.sin(T * 14);
  c.save();
  c.translate(d.x0, d.y0);
  c.rotate(Math.atan2(d.uy, d.ux));
  c.fillStyle = rgba('#ff3df0', .08 + .12*pl);
  c.fillRect(0, -w/2, 2400, w);
  c.strokeStyle = rgba('#ff3df0', .85);
  c.lineWidth = 2;
  c.setLineDash([10,8]);
  c.strokeRect(0, -w/2, 2400, w);
  c.setLineDash([]);
  c.restore();
}

function drawHole(h,k) {
  const r = h.r;
  if (r <= 0) return;
  c.save();
  c.translate(h.x, h.y);
  let g = c.createRadialGradient(0,0,r*.6,0,0,r*3.2);
  g.addColorStop(0, rgba(k[2], .5));
  g.addColorStop(1, rgba(k[2], 0));
  c.fillStyle = g;
  c.beginPath(); c.arc(0,0,r*3.2,0,TAU); c.fill();
  if (h.s === 'grow') {
    c.strokeStyle = rgba(k[3], .7);
    c.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const q = ((T*1.5 + i/3) % 1);
      c.beginPath(); c.arc(0,0,r*(4 - q*3),0,TAU);
      c.globalAlpha = q;
      c.stroke();
    }
    c.globalAlpha = 1;
  }
  for (let n = 0; n < 3; n++) {
    const rx = r * (1.6 + n*.55),
          ry = rx * .3;
    c.strokeStyle = rgba(k[2], .35 - n*.07);
    c.lineWidth = 2;
    c.beginPath(); c.ellipse(0,0,rx,ry,0,0,TAU); c.stroke();
    for (let i = 0; i < 14; i++) {
      const a = T * (1.6 - n*.3) + i * TAU / 14 + n;
      c.fillStyle = rgba(k[3], .35 + .5 * Math.sin(a*2));
      c.fillRect(Math.cos(a)*rx - 1.5, Math.sin(a)*ry - 1.5, 3, 3);
    }
  }
  c.fillStyle = '#000';
  c.shadowColor = k[3];
  c.shadowBlur = 24;
  c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
  c.shadowBlur = 0;
  c.strokeStyle = k[3];
  c.lineWidth = 3;
  c.beginPath(); c.arc(0,0,r + 1,0,TAU); c.stroke();
  c.fillStyle = '#000';
  c.beginPath(); c.arc(0,0,r*.92,0,TAU); c.fill();
  c.restore();
}

function drawZone(z,k) {
  if (z.kind === 'side') return drawSide(z,k);
  const col = { wall:'#ff4b3a', beam:k[2], lane:'#ff3df0' }[z.kind],
        on = z.age >= z.tel && z.dmg,
        y0 = 100,
        hh = H - y0;
  if (!on) {
    const pl = Math.floor(T * 10) % 2;
    c.fillStyle = rgba(col, .07 + .1*pl);
    c.fillRect(z.x, y0, z.w, hh);
    c.strokeStyle = rgba(col, .85);
    c.lineWidth = 2;
    c.setLineDash([10,8]);
    c.strokeRect(z.x, y0, z.w, hh);
    c.setLineDash([]);
    return;
  }
  const f = clamp(1 - (z.age - z.tel - z.act + .3) / .3, 0, 1),
        a = z.age - z.tel > z.act ? f : 1;
  c.save();
  c.globalAlpha = a;
  const g = c.createLinearGradient(z.x, 0, z.x + z.w, 0);
  if (z.kind === 'wall') {
    g.addColorStop(0, rgba(col, .25));
    g.addColorStop(.5, rgba(col, .55));
    g.addColorStop(1, rgba(col, .25));
  } else {
    g.addColorStop(0, rgba(col, 0));
    g.addColorStop(.3, col);
    g.addColorStop(.5, '#fff');
    g.addColorStop(.7, col);
    g.addColorStop(1, rgba(col, 0));
  }
  c.shadowColor = col;
  c.shadowBlur = 22;
  c.fillStyle = g;
  c.fillRect(z.x, y0, z.w, hh);
  c.shadowBlur = 0;
  c.fillStyle = rgba('#ffffff', .7);
  for (let i = 0; i < 22; i++) {
    const yy = y0 + ((T*480 + i*47) % hh);
    c.fillRect(z.x + ((i*61) % Math.max(4, z.w - 3)), yy, 2, 9);
  } // faíscas correndo na barreira
  if (z.kind === 'wall') {
    c.fillStyle = '#fff';
    c.fillRect(z.x - 1, y0, 3, hh);
    c.fillRect(z.x + z.w - 2, y0, 3, hh);
  }
  c.restore();
}

function bg(k) {
  c.fillStyle = '#000';
  c.fillRect(-20, -20, W + 40, H + 40);
  let g = c.createRadialGradient(400,0,10,400,0,520);
  g.addColorStop(0, rgba(k[1], .55));
  g.addColorStop(1, rgba(k[1], 0));
  c.fillStyle = g;
  c.fillRect(0,0,W,H);
  g = c.createRadialGradient(120,H,10,120,H,520);
  g.addColorStop(0, rgba(k[2], .16));
  g.addColorStop(1, rgba(k[2], 0));
  c.fillStyle = g;
  c.fillRect(0,0,W,H);
  for (const s of stars) {
    c.fillStyle = `rgba(255,255,255,${.25 + s.z * .18})`;
    c.fillRect(s.x, s.y, s.z > 2.5 ? 2 : 1, s.z > 2.5 ? 2 : 1);
  }
  const p = .5 + .5 * Math.sin(T * 3);
  for (const x of [5, W - 5]) {
    c.shadowColor = k[2];
    c.shadowBlur = 14;
    c.strokeStyle = rgba(k[2], .45 + .3*p);
    c.lineWidth = 3;
    c.beginPath(); c.moveTo(x, 96); c.lineTo(x, H); c.stroke();
  } // trilhos de energia (somem quando o anel fecha)
  c.shadowBlur = 0;
  c.strokeStyle = rgba(k[2], .25);
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(5,96); c.lineTo(W - 5,96); c.stroke();
  c.globalAlpha = 1;
}

function drawE(e) {
  c.save();
  c.translate(e.x,e.y);
  c.shadowColor = e.cor;
  c.shadowBlur = 10;
  c.fillStyle = e.cor;
  c.beginPath(); c.arc(0,0,e.r,0,TAU); c.fill();
  c.shadowBlur = 0;
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(0,0,e.r*.45,0,TAU); c.fill();
  c.restore();
}

function hud() {
  P.forEach((p,i) => {
    const r = i === 1,
          x = r ? W - 15 : 15;
    txt(p.k.n + ' ' + pad(p.pts), x, 22, 18, p.k.cor, r ? 'right' : 'left');
    for (let j = 0; j < p.vid; j++)
      nave(r ? W - 15 - (j+1)*27 : 15 + j*27, 31, p.k, false, .55);
    {
      const it = [];
      if (p.mult) it.push('P' + p.mult);
      if (p.arma) it.push(NOME_ARMA[p.arma]);
      if (p.esc > 0) it.push('S' + Math.ceil(p.esc));
      if (p.vel > 0) it.push('V' + Math.ceil(p.vel));
      if (it.length) txt(it.join(' '), x, H - 10, 14, p.k.cor, r ? 'right' : 'left', false);
    }
    if (!p.vivo) txt('MORTO', x, H - 28, 14, p.k.cor, r ? 'right' : 'left', false);
  });
  txt('HI ' + pad(Math.max(0, tot())), W/2, 22, 18, '#ffe600');
  if (B) {
    const x = 150,
          bw = 500,
          ph = B.ph;
    c.fillStyle = 'rgba(0,0,0,.6)';
    c.fillRect(x - 12, 48, bw + 24, 42);
    c.strokeStyle = '#fff';
    c.lineWidth = 1;
    c.strokeRect(x, 54, bw, 14);
    c.fillStyle = PAL[ph - 1][2];
    c.fillRect(x + 2, 56, (bw - 4) * Math.max(0, B.hp) / B.max, 10);
    c.fillStyle = '#fff';
    for (const m of [.33,.66]) c.fillRect(x + 2 + (bw - 4) * m, 52, 2, 18);
    txt('LEVIATÃ DO VAZIO · FASE ' + ph + ' — ' + NOMEF[ph - 1], W/2, 82, 13, '#fff', 'center', false);
    if (B.imune) txt('IMUNE', W/2 + 245, 82, 13, '#ff0', 'center', false);
    if (B.heal)  txt('NÃO ATIRE!', W/2 + 245, 82, 13, '#5dff9a', 'center', false);
  }
}

function overlay(tit,col,sub) {
  c.fillStyle = 'rgba(0,0,0,.7)';
  c.fillRect(0,0,W,H);
  txt(tit, W/2, 150, 48, col);
  if (sub) txt(sub, W/2, 195, 22, '#4ff');
  P.forEach((p,i) => txt(`${p.k.n} (${p.k.nm}): ${pad(p.pts)}`, W/2, 270 + i*38, 28, p.k.cor));
  txt('TOTAL: ' + pad(tot()), W/2, 270 + P.length*38 + 16, 26, '#fff');
  if (Math.floor(T * 2) % 2 === 0) txt('Enter (ou clique) para jogar novamente', W/2, 430, 18, '#39ff14');
}

function menu() {
  txt('CHEFE 5', W/2, 110, 60, '#ff4b45');
  txt('LEVIATÃ DO VAZIO', W/2, 160, 34, '#a14dff');
  txt('Batalha final · 3 fases · tiros do jogador base: 1 dano na cabeça, 0,4 no corpo', W/2, 200, 14, '#aaa', 'center', false);
  txt('MODO: ' + (dupla ? 'DUPLA (7 vidas, 1200 HP)' : 'SOLO (5 vidas, 900 HP)') + '   [botão MODO ou teclas 1 / 2]', W/2, 260, 18, '#ffe600', 'center', false);
  txt('CONTROLES — P1 WASD+G · P2 ←↑↓→+L', W/2, 292, 16, '#4ff', 'center', false);
  for (let i = 0; i < 2; i++) nave(300 + i*130, 350, CFG[i], false, 1.4);
  if (Math.floor(T * 2) % 2 === 0) txt('Aperte Enter (ou clique) para lutar', W/2, 450, 20, '#39ff14');
}

function draw() {
  const k = PAL[(B ? B.ph : 1) - 1];
  c.save();
  if (shake > 0) c.translate(rnd(-5,5), rnd(-5,5));
  bg(k);

  if (estado === 'MENU') menu();
  else {
    for (const z of Z) drawZone(z,k);
    if (HOLE) drawHole(HOLE,k);
    if (B) for (const l of B.lz) drawLZ(l,k);
    if (ROT) drawRot(k);
    if (ZN) drawZN(k);
    drawFL(k);
    if (B && B.atk === 'cone') drawConeFX(B,k);
    if (B && B.dv && B.mode === 'aim') drawDV(B,k);
    drawSW(k);
    if (B && LAS) drawLaser(B,k);
    drawA();
    if (B) drawBoss(B);
    if (B && B.st === 'fight' && ZN && !ZN.fired)
      drawCharge(B, ZN.t / ZN.tel, ZN.kind === 'xplo' ? '#ff8a1a' : '#ff3030');
    if (B && B.atk === 'cone')  drawConeHead(B,k);
    if (B && B.atk === 'guarda') drawGuarda(B);

    for (const b of PB) drawPB(b);
    for (const e of E)  drawE(e);
    for (const u of PU) drawPU(u);

    for (const p of vivos())
      if (p.inv <= 0 || Math.floor(T * 14) % 2) {
        const lim = ct(p),
              bl = p.arma === 'E' && p.hold > .25 && Math.floor(T * (p.hold >= lim ? 24 : 10)) % 2;
        nave(p.x, p.y, p.k, bl, PSC);
        if (p.arma === 'E' && p.hold > 0) {
          c.fillStyle = '#fff';
          c.fillRect(p.x, p.y + p.h + 4, Math.min(1, p.hold / lim) * p.w, 3);
        }
        if (p.esc > 0) {
          const cx = p.x + p.w/2,
                cy = p.y + p.h/2,
                R = 30 * PSC + 6;
          c.fillStyle = 'rgba(80,255,255,.12)';
          c.beginPath(); c.arc(cx,cy,R,0,TAU); c.fill();
          c.strokeStyle = '#4ff';
          c.shadowColor = '#0ff';
          c.shadowBlur = 12;
          c.lineWidth = 2;
          c.beginPath(); c.arc(cx,cy,R,T*3,T*3 + 4.2); c.stroke();
          c.shadowBlur = 0;
        }
      }

    for (const q of PT) {
      c.globalAlpha = Math.max(0, q.l / q.m);
      c.fillStyle = q.col;
      c.fillRect(q.x, q.y, q.s, q.s);
    }
    c.globalAlpha = 1;

    for (const q of HT) {
      c.globalAlpha = clamp(q.l / .5, 0, 1);
      txt('+' + q.v, q.x, q.y, q.v > 3 ? 26 : 18, '#5dff9a', 'center', false);
    }
    c.globalAlpha = 1;

    if (flash > 0) {
      c.fillStyle = `rgba(255,255,255,${Math.min(.8, flash)})`;
      c.fillRect(0,0,W,H);
    }

    hud();

    if (banner.t > 0) {
      const a = Math.min(1, banner.t * 1.5);
      c.globalAlpha = a;
      txt(banner.s, W/2, 390, 44, k[3]);
      txt(banner.u, W/2, 426, 20, '#fff');
      c.globalAlpha = 1;
    }

    if (estado === 'AVISO') {
      c.fillStyle = 'rgba(180,0,0,.35)';
      c.fillRect(0,330,W,130);
      if (Math.floor(T * 4) % 2 === 0) {
        txt('!! FINAL BOSS !!', W/2, 400, 50, '#ff3030');
        txt('LEVIATÃ DO VAZIO', W/2, 440, 24, '#fff');
      }
    }
    if (estado === 'PAUSE') {
      c.fillStyle = 'rgba(0,0,0,.6)';
      c.fillRect(0,0,W,H);
      txt('PAUSADO', W/2, 400, 54, '#ffe600');
    }
    if (estado === 'OVER')    overlay('GAME OVER', '#ff3030', null);
    if (estado === 'VITORIA') overlay('CONGRATULATIONS!', '#ffe600', 'VOCÊ SALVOU A GALÁXIA');
  }

  c.restore();
}

/* =====================================================================
   13. LOOP PRINCIPAL e CONTROLES MOBILE
   ===================================================================== */
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0);
  last = ts;
  musicaEstado();
  if (estado === 'MENU') T += dt;
  else if (estado !== 'PAUSE') update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ---- botões / controle mobile ----------------------------------- */
// CONTROLE: botão no menu alterna WASD ⇄ MOBILE (direcional + FOGO). Vindo do jogo principal, herda a escolha via ?mobile=0|1
(() => {
  const $ = id => document.getElementById(id);
  const tc = $('tc'), joy = $('joy'), kn = $('knob'), fb = $('fire'), mb = $('mob'), ctl0 = $('ctl').innerHTML;
  const qm = (location.search.match(/[?&]mobile=([01])/) || [])[1];
  let mob = qm ? qm === '1' : (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window);

  const set = (ax,ay) => {
    keys.KeyD = ax > .35;
    keys.KeyA = ax < -.35;
    keys.KeyS = ay > .35;
    keys.KeyW = ay < -.35;
  };

  function setMob(on) {
    mob = on;
    tc.style.display = on ? 'flex' : 'none';
    $('ctl').innerHTML = on
      ? 'Direcional: move a nave nas 4 direções · FOGO: segure para atirar'
      : ctl0;
    mb.textContent = 'CONTROLE: ' + (on ? 'MOBILE' : 'WASD');
    if (!on) { set(0,0); keys.KeyG = false; }
  }

  const mv = e => {
    const r = joy.getBoundingClientRect(),
          R = r.width / 2;
    let dx = e.clientX - (r.left + R),
        dy = e.clientY - (r.top + R);
    const d = Math.hypot(dx,dy),
          m = R * .6;
    if (d > m) { dx *= m / d; dy *= m / d; }
    kn.style.transform = `translate(${dx}px,${dy}px)`;
    set(dx/m, dy/m);
  };
  joy.addEventListener('pointerdown', e => { Som.init(); joy.setPointerCapture(e.pointerId); mv(e); e.preventDefault(); });
  joy.addEventListener('pointermove', e => { if (joy.hasPointerCapture(e.pointerId)) mv(e); });
  const up = () => { kn.style.transform = ''; set(0,0); };
  joy.addEventListener('pointerup', up);
  joy.addEventListener('pointercancel', up);

  fb.addEventListener('pointerdown', e => { Som.init(); fb.setPointerCapture(e.pointerId); keys.KeyG = true; fb.classList.add('on'); e.preventDefault(); });
  const fu = () => { keys.KeyG = false; fb.classList.remove('on'); };
  fb.addEventListener('pointerup', fu);
  fb.addEventListener('pointercancel', fu);
  document.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('#tc')) e.preventDefault(); }, { passive:false });

  mb.addEventListener('click', e => { Som.init(); setMob(!mob); mb.blur(); e.stopPropagation(); });
  setMob(mob);

  const md = $('modo');
  md.addEventListener('click', e => {
    if (estado === 'MENU' || estado === 'OVER' || estado === 'VITORIA') dupla = !dupla;
    md.textContent = 'MODO: ' + (dupla ? 'DUPLA' : 'SOLO');
    md.blur();
    e.stopPropagation();
  });

  setInterval(() => {
    const l = estado === 'MENU' || estado === 'OVER' || estado === 'VITORIA';
    mb.style.display = md.style.display = l ? 'block' : 'none';
    md.textContent = 'MODO: ' + (dupla ? 'DUPLA' : 'SOLO');
  }, 150);
})();

// vindo do jogo principal (Salvar a galáxia): a batalha começa direto
{
  const q = new URLSearchParams(location.search);
  if (q.get('start') === '1') {
    dupla = q.get('dupla') === '1';
    iniciar();
  }
}

requestAnimationFrame(loop);
