<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chefe 5 — Leviatã do Vazio</title>
<style>
:root{--bg:#050611;--text:#e5eaff;--muted:#929bbd}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 0%,#21134a,transparent 55%),var(--bg);color:var(--text);font-family:"Courier New",monospace}
#box{position:relative;width:min(800px,100%,calc(100vh - 90px));aspect-ratio:1/1;border:2px solid #7950ff;box-shadow:0 0 30px #7950ff66;background:#000}
canvas{display:block;width:100%;height:100%}
#tc{display:none;width:min(800px,100%);margin-top:14px;justify-content:space-between;align-items:center;padding:0 18px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#joy{position:relative;width:160px;height:160px;border-radius:50%;border:2px solid #5145a5;background:radial-gradient(circle,#1a1440aa,#0c1024cc);box-shadow:0 0 18px #7950ff55,inset 0 0 20px #7950ff33;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:#40eaff;box-shadow:0 0 18px #40eaffaa;opacity:.85;pointer-events:none}
#fire{display:flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;border:2px solid #39ff88;background:#39ff88;color:#04130a;font:bold 18px "Courier New",monospace;letter-spacing:1px;box-shadow:0 0 22px #39ff8877;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#fire.on{filter:brightness(1.3);transform:scale(.94)}
#mob,#modo{position:absolute;left:15px;bottom:15px;transform:none;min-width:0;z-index:2;padding:10px 16px;border:1px solid #40eaff;border-radius:5px;background:#40eaff;color:#04131a;font:bold 13px "Courier New",monospace;letter-spacing:1px;cursor:pointer;box-shadow:0 0 18px #40eaff66;transition:transform .2s,filter .2s}
#modo{left:auto;right:15px;border-color:#ffe600;background:#ffe600;box-shadow:0 0 18px #ffe60066}
#modo:hover{transform:translateY(-3px);filter:brightness(1.12)}
#mob:hover{transform:translateY(-3px);filter:brightness(1.12);background:#40eaff!important}
#ctl{margin-top:10px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div id="box"><canvas id="c" width="800" height="800"></canvas><button id="mob">CONTROLE: WASD</button><button id="modo">MODO: SOLO</button></div>
<div id="tc"><div id="joy"><div id="knob"></div></div><div id="fire">FOGO</div></div>
<div id="ctl">P1: W A S D · G atira &nbsp;|&nbsp; P2: ← ↑ ↓ → · L atira<br>F1 jogar · F2 Solo/Dupla · P pausa</div>
<script>
/* =====================================================================
   CHEFE 5 — LEVIATÃ DO VAZIO  (página independente)

   ÍNDICE
   1. Utilidades
   2. Som
   3. Música (MUS)
   4. Estado global
   5. Jogadores
   6. Chefe (serpente / Leviatã)
   7. Ataques
   8. Power-ups e projéteis dos jogadores
   9. Ondas de aliens
   10. Atualização
   11. Entrada (teclado / clique)
   12. Desenho
   13. Loop principal e controles mobile

   Evento ao terminar: window 'boss5:fim' {detail:{vitoria,pontos}}
   ===================================================================== */

/* =====================================================================
   1. UTILIDADES
   ===================================================================== */
const cv = document.getElementById('c'),
      c = cv.getContext('2d'),
      W = 800, H = 800, TAU = Math.PI * 2;

const rnd   = (a,b) => a + Math.random() * (b - a),
      clamp = (v,a,b) => Math.max(a, Math.min(b, v)),
      pad   = n => String(Math.floor(n)).padStart(6,'0');

const hit = (a,b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// círculo x retângulo
const cr = (x,y,r,R) => {
  const nx = clamp(x, R.x, R.x + R.w),
        ny = clamp(y, R.y, R.y + R.h);
  return (x - nx) ** 2 + (y - ny) ** 2 < r * r;
};

const rgba = (h,a) => {
  const n = parseInt(h.slice(1), 16);
  return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`;
};

const poly = pts => {
  c.beginPath();
  pts.forEach((q,i) => i ? c.lineTo(q[0],q[1]) : c.moveTo(q[0],q[1]));
  c.closePath();
  c.fill();
};

function txt(t,x,y,sz,col,al = 'center',glow = true) {
  c.font = `bold ${sz}px "Courier New",monospace`;
  c.textAlign = al;
  c.fillStyle = col;
  if (glow) { c.shadowColor = col; c.shadowBlur = 10; }
  c.fillText(t,x,y);
  c.shadowBlur = 0;
}

/* =====================================================================
   2. SOM
   ===================================================================== */
const Som = {
  ctx: null,
  init() {
    if (typeof MUS !== 'undefined') MUS.boot();
    if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tom(f0,f1,d,tp = 'square',v = .06,at = 0) {
    const a = this.ctx; if (!a) return;
    const t = a.currentTime + at,
          o = a.createOscillator(),
          g = a.createGain();
    o.type = tp;
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f1,t + d);
    g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(.001,t + d);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + d);
  },
  ruido(d,v = .15,at = 0) {
    const a = this.ctx; if (!a) return;
    const n = a.sampleRate * d | 0,
          b = a.createBuffer(1,n,a.sampleRate),
          x = b.getChannelData(0);
    for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(),
          f = a.createBiquadFilter(),
          g = a.createGain(),
          t = a.currentTime + at;
    s.buffer = b;
    f.type = 'lowpass';
    f.frequency.setValueAtTime(2500,t);
    f.frequency.exponentialRampToValueAtTime(100,t + d);
    g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(.001,t + d);
    s.connect(f).connect(g).connect(a.destination);
    s.start(t);
  },
  tiro()     { this.tom(400,1400,.1); },
  inim()     { this.tom(240,70,.2,'sawtooth',.05); },
  boom()     { this.ruido(.25); },
  alerta()   { this.tom(880,440,.3,'square',.08); },
  rugido()   { this.ruido(1.6,.3); this.tom(120,30,1.6,'sawtooth',.16); },
  verme()    { // grito de verme espacial
    this.tom(950,110,1.2,'sawtooth',.11);
    this.tom(1400,180,1,'square',.05,.05);
    this.tom(70,38,1.4,'sine',.2);
    this.ruido(1.1,.2);
    this.tom(300,900,.35,'triangle',.06,.9);
  },
  rastejar() { this.ruido(.55,.09); this.tom(75,42,.55,'sawtooth',.06); },
  cuspe()    { this.tom(520,130,.3,'sawtooth',.08); this.ruido(.18,.12); },
  carga(d,at = 0) { this.tom(120,900,d,'sawtooth',.06,at); this.tom(240,1700,d,'square',.025,at); },
  laser(at = 0) {
    this.ruido(1.1,.3,at);
    this.tom(1200,70,1.1,'sawtooth',.13,at);
    this.tom(320,55,1.1,'square',.09,at);
  },
  impacto()  { this.ruido(.55,.32); this.tom(170,28,.55,'sawtooth',.2); },
  entrada()  {
    this.ruido(3.2,.3);
    this.tom(38,95,3.2,'sine',.28);
    this.tom(60,28,3.2,'sawtooth',.1);
    this.tom(200,900,2.6,'triangle',.05,.4);
    this.rugido();
  },
  cg: {},
  cargaStart(id,d) {
    const a = this.ctx; if (!a) return;
    this.cargaStop(id);
    const t = a.currentTime,
          o = a.createOscillator(),
          o2 = a.createOscillator(),
          g = a.createGain();
    o.type = 'triangle'; o2.type = 'sine';
    o.frequency.setValueAtTime(140,t);
    o.frequency.exponentialRampToValueAtTime(900,t + d);
    o2.frequency.setValueAtTime(70,t);
    o2.frequency.exponentialRampToValueAtTime(450,t + d);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.032,t + d);
    o.connect(g); o2.connect(g); g.connect(a.destination);
    o.start(t); o2.start(t);
    this.cg[id] = { o, o2, g };
  },
  cargaStop(id) {
    const c = this.cg[id], a = this.ctx;
    if (!c || !a) return;
    const t = a.currentTime;
    c.g.gain.cancelScheduledValues(t);
    c.g.gain.setTargetAtTime(.0001,t,.03);
    c.o.stop(t + .2); c.o2.stop(t + .2);
    delete this.cg[id];
  },
  cargaStopAll() { for (const id of Object.keys(this.cg)) this.cargaStop(id); },
  cargaPronto()  { this.tom(660,920,.2,'sine',.04); this.tom(990,1240,.26,'sine',.025,.1); },
  cargaTiro()    { this.ruido(.4,.11); this.tom(1000,80,.5,'sawtooth',.05); this.tom(400,50,.6,'square',.035); }
};

/* =====================================================================
   3. MÚSICA (MUS)
   YouTube IFrame API / player escondido. Precisa de internet e de abrir a página por http(s); M liga/desliga.
   ===================================================================== */
const MUS = {
  boss12:  new Audio('boss5(1-2).m4a'),
  boss3:   new Audio('chefe5(fase-3).m4a'),
  decisao: new Audio('decisao(ir-ficar).m4a'), // tela de derrota (mesma faixa do jogo principal)
  cur: null,
  play(name) {
    if (this.cur === name) return;
    const ant = this[this.cur];
    if (ant) { ant.pause(); ant.currentTime = 0; } // pausa a música ANTERIOR
    this.cur = name;
    const audio = this[name];
    audio.loop = true;
    audio.volume = 0.4;
    audio.play().catch(e => console.log('Erro ao tocar musica', e));
  },
  boot() { if (this.cur) this[this.cur].play().catch(() => {}); }, // chamado a cada tecla/clique: destrava o autoplay bloqueado pelo navegador
  toggle() { return false; }
};
addEventListener('keydown', e => { if (e.code === 'KeyM') MUS.toggle(); });

function musicaEstado() {
  let k = null;
  if (estado === 'OVER') k = 'decisao';
  else if (estado === 'PLAY' || estado === 'PAUSE' || estado === 'AVISO') {
    k = B && B.ph === 3 ? 'boss3' : 'boss12';
  }
  if (k) MUS.play(k);
} // chefe 5 até a fase 2 · fase 3 · derrota

/* =====================================================================
   4. ESTADO GLOBAL
   ===================================================================== */
const CFG = [
  { n:'P1', nm:'Verde',   cor:'#39ff14', cl:{ e:'KeyA', d:'KeyD', c:'KeyW', b:'KeyS', t:'KeyG' } },
  { n:'P2', nm:'Amarelo', cor:'#ffe600', cl:{ e:'ArrowLeft', d:'ArrowRight', c:'ArrowUp', b:'ArrowDown', t:'KeyL' } }
];

// PSC: escala dos jogadores · LAS: estado do laser · SC: escala do corpo
let estado = 'MENU', dupla = false, T = 0, last = 0, shake = 0, flash = 0,
    avisoT = 0, banner = { t:0, s:'', u:'' }, PSC = 1, LAS = null, SC = 1.5;

let P = [], B = null, E = [], PB = [], Z = [], PT = [], HOLE = null, ROT = null,
    ZN = null, SW = [], PU = [], A = [], AX0 = 0, AY0 = 130, ADIR = 1, diveT = 0,
    ntot = 20, FX = [], lzT = 3, FL = [], HT = [];
// HT: textos flutuantes de cura (+N) · FL: lasers finos do ataque final

const campanhaEntrada = (() => {
  try {
    const raw = new URLSearchParams(location.search).get('save');
    const v = raw ? JSON.parse(raw) : null;
    return Array.isArray(v) ? v : null;
  } catch(e) {
    console.warn('Dados de campanha inválidos; iniciando com valores padrão.', e);
    return null;
  }
})();

const keys = {};
const stars = Array.from({ length:110 }, () => ({ x:rnd(0,W), y:rnd(0,H), z:1 + rnd(0,3) }));

const vivos = () => P.filter(p => p.vivo),
      tot   = () => P.reduce((s,p) => s + p.pts, 0),
      nearest = x => vivos().sort((a,b) => Math.abs(a.x+19.5-x) - Math.abs(b.x+19.5-x))[0] || P[0];

function boom(x,y,col,n,v = 170,l = .6) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0,TAU), s = rnd(0,v);
    PT.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, l:l*rnd(.5,1.5), m:l, col, s:2 + rnd(0,3) });
  }
}

/* =====================================================================
   5. JOGADORES (movimento e hitbox de referência)
   ===================================================================== */
const PY = 740, HY = 400, SHOTS = [5,7,10];
// PY: linha-base dos jogadores · HY: altura do buraco negro

const hb = p => ({ x:p.x + 9*PSC, y:p.y + 5*PSC, w:21*PSC, h:14*PSC });
// hitbox menor que o desenho (acompanha a escala do jogador)

function limitaArena(p) {
  const ow = p.w, oh = p.h;
  p.w = 39*PSC; p.h = 24*PSC;
  p.x += (ow - p.w) / 2; p.y += (oh - p.h) / 2; // escala muda mantendo o centro da nave
  p.x = clamp(p.x, 10, W - 10 - p.w);
  p.y = clamp(p.y, 110, H - 10 - p.h);            // limites normais da tela (abaixo do HUD)
}

function movePlayers(dt) {
  for (const p of vivos()) {
    const k = p.k;
    p.px = p.x; p.py = p.y;
    const ax = (keys[k.cl.d] ? 1 : 0) - (keys[k.cl.e] ? 1 : 0),
          ay = (keys[k.cl.b] ? 1 : 0) - (keys[k.cl.c] ? 1 : 0),
          l  = Math.hypot(ax,ay) || 1;
    const v = p.vel > 0 ? 500 : 330;
    p.x += ax / l * v * dt;
    p.y += ay / l * v * dt;
    limitaArena(p);
    p.mov = Math.abs(p.x - p.px) + Math.abs(p.y - p.py) > .01;
  }
}

function dano(p) {
  if (!p.vivo || p.inv > 0) return;
  if (p.esc > 0) {
    // escudo absorve 1 dano
    p.esc = 0; p.inv = 1;
    boom(p.x+20, p.y+10, '#4ff', 25);
    Som.boom();
    return;
  }
  p.vid--;
  p.inv = 2;
  p.mult = Math.max(0, p.mult - 1);
  p.arma = '';
  p.hold = 0;
  p.cr = 0;
  Som.cargaStop(p.k.n);
  boom(p.x+20, p.y+10, '#fff', 40, 220, .8);
  shake = .4;
  Som.boom();
  if (p.vid <= 0) {
    p.vivo = false;
    boom(p.x+20, p.y+10, '#f55', 90, 300, 1.2);
    if (!vivos().length) fimJogo(false);
  }
}

/* =====================================================================
   6. CHEFE: serpente de 34 segmentos em cadeia
   ===================================================================== */
const NS = 32;
const rad = i => (i ? Math.max(9, 26 - i * .56) : 30) * SC;
const spc = i => Math.max(24, rad(i) * 1.7); // 64 segmentos, escala SC (1.5 normal · 2.1 no anel)

const PAL = [
  ['#120a2e','#3d1d80','#a14dff','#f0c8ff'],
  ['#06202e','#0f5f78','#43eaff','#d4fbff'],
  ['#2b0810','#85182a','#ff5a40','#ffe2b0']
];
const NOMEF = ['DESPERTAR','SINGULARIDADE','DEVORAÇÃO'];

function resetCorpo(b,x,y = -100,ux = 0,uy = 1) {
  let px = x, py = y;
  b.seg.forEach((s,i) => {
    if (i) { px -= ux * spc(i); py -= uy * spc(i); }
    s.x = s.cx = px;
    s.y = s.cy = py;
    s.a = Math.atan2(uy,ux);
  });
}
// cadeia alinhada atrás de (x,y), contra a direção do movimento

function novoBoss() {
  const hp = dupla ? 1200 : 900;
  const b = {
    hp, max:hp, ph:1, t:0,
    seg: Array.from({ length:NS }, () => ({ x:0, y:0, cx:0, cy:0, a:0 })),
    st:'enter', mode:'slither', atk:'', cd:1.8, at:0, q:[], len:0, hit:0,
    jaw:0, tr:0, dives:0, lx:400, m:0, last:'', amb:1.5, mt:0, sd:0, ex:0,
    sc:1.5, sct:1.5, pt:1, imune:false, dv:null, pun:0, wv:false, lz:[],
    hin:false, lzd:false, hold:0, fs:'', ft:0, nw:0, n:0, lw:0, la:0,
    fc:0, fan:0, fanT:0, ca:1.57, heal:false, hg:0
  };
  // heal: escudo vampírico ativo (dano vira cura) · hg: brilho do último hit
  // fc: ataques finais já usados · fan/fanT: leque periódico · ca: eixo do cone
  // sct: escala-alvo do chefe · pt: escala-alvo das naves
  SC = 1.5; PSC = 1; LAS = ROT = ZN = null; SW = [];
  resetCorpo(b,400);
  return b;
}

const angL = (a,b,t) => a + (((b - a + Math.PI * 3) % TAU) - Math.PI) * t;
const dAng = (a,b)   => ((a - b + Math.PI) % TAU + TAU) % TAU - Math.PI;

const bul = (x,y,vx,vy,cor,r) => ({ x, y, vx, vy, cor, r });
const zone = (x,w,tel,act,kind,dmg = true) => Z.push({ x, w, tel, act, age:0, kind, dmg });

function hurt(n,p,head,kind) {
  const b = B;
  if (b.st !== 'fight' || b.tr > 0 || b.imune) return;
  if (b.atk === 'cone' && !head) return;

  if (b.heal) {
    // ESCUDO VAMPÍRICO: 1 projétil = 3 HP (2 na dupla) · Charge = 8 HP (6 na dupla); não rende pontos
    const v = kind === 'E' ? (dupla ? 6 : 8) : (dupla ? 2 : 3);
    b.hp = Math.min(b.max, b.hp + v);
    b.hg = .25;
    const h = b.seg[0];
    if (HT.length < 24) HT.push({ x:h.x + rnd(-40,40), y:h.y - 50*SC/1.5, v, l:.9 });
    boom(h.x + rnd(-30,30), h.y + rnd(-20,20), '#5dff9a', kind === 'E' ? 10 : 4, 120, .4);
    return;
  }

  // ataque final: só a cabeça recebe dano
  b.hp -= n;
  b.hit = .08;
  if (p) p.pts += head ? 5 : 2;

  while (b.pun < 4 && b.hp <= b.max * (1 - .2 * (b.pun + 1))) { b.pun++; dropPU(b); } // power-up a cada 20% de vida perdida

  const lim = b.ph === 1 ? .66 : b.ph === 2 ? .33 : 0;
  if (lim && b.hp <= b.max * lim) {
    b.hp = b.max * lim;
    startTrans(b);
  } else if (b.hp <= 0) {
    b.hp = 0; b.st = 'dead'; b.mt = 3.6; b.ex = 0; b.sd = 0;
    E = []; FL = []; Z = []; HOLE = null; LAS = ROT = ZN = null; SW = [];
    b.imune = false; b.heal = false; b.dv = null; b.lz = [];
    if (p) p.pts += 1250;
    flash = 1;
    Som.rugido();
  }
}

function limpa(b) {
  // apaga todo ataque/efeito/estado temporário
  E = []; FL = []; b.fan = 0; Z = []; LAS = null; ROT = null; ZN = null; SW = [];
  b.dv = null; b.lz = []; b.imune = false; b.heal = false; b.q = []; b.atk = ''; b.dives = 0;
}

function startTrans(b) {
  b.tr = 4.2;
  limpa(b);
  A = [];
  b.wv = true;
  novaOnda(b.ph === 1 ? [3,3] : [3,4,4]);
  // fim da fase 1: 2 fileiras de roxos · fim da fase 2: 1 de roxos + 2 de laranjas
  b.mode = 'recua';
  HOLE = null; // fase 1→2: chefe recua e invoca a onda; só volta quando ela for destruída
  flash = 1; shake = .8;
  Som.rugido(); Som.verme();
  b.sct = b.ph === 1 ? 2.0 : 2.4;
  b.pt  = .62;
  // chefe cresce (fase 2: 2,0 · fase 3: 2,4) e as naves encolhem; posições e vidas não são tocadas
  banner = { t:4.2, s:'FASE ' + (b.ph + 1), u:NOMEF[b.ph] };
  for (const s of b.seg) boom(s.x, s.y, PAL[b.ph][2], 4, 260, .8);
}

/* =====================================================================
   7. ATAQUES
   ===================================================================== */

/* ---- INVESTIDA (fase 3) ------------------------------------------- */
// Vertical, diagonal ou horizontal. A cadeia é reposicionada fora da tela, atrás do ponto de partida.
function aim(b) {
  const p = nearest(400),
        q = hb(p),
        px = q.x + q.w / 2,
        py = q.y + q.h / 2,
        tx = clamp(px + rnd(-40,40), 80, 720),
        r = Math.random();
  let x0, y0, ux, uy;
  if (r < .4) {
    x0 = tx; y0 = -150; ux = 0; uy = 1;
  } else if (r < .75) {
    const sg = Math.random() < .5 ? -1 : 1;
    x0 = tx - sg * 450; y0 = -150;
    const dx = tx - x0, dy = py - y0, l = Math.hypot(dx,dy);
    ux = dx / l; uy = dy / l;
  } else {
    const sg = Math.random() < .5 ? 1 : -1;
    y0 = clamp(py + rnd(-50,50), 160, 740);
    x0 = sg > 0 ? -170 : W + 170;
    ux = sg; uy = 0;
  }
  b.dv = { x0, y0, ux, uy };
  b.mode = 'aim';
  b.m = 0;
  b.tel = b.ph === 2 ? .85 : 1.15;
  Som.alerta();
}

/* ---- LEQUE (cuspe) ------------------------------------------------ */
function spit(b,n) {
  const s = b.seg[0],
        p = nearest(s.x),
        base = Math.atan2(p.y + 12 - s.y, p.x + 19.5 - s.x),
        st = n === 1 ? 0 : [.21,.2,.17][b.ph - 1];
  b.jaw = 1;
  Som.inim();
  if (n > 1) Som.cuspe();
  // n disparos em leque: 5 / 7 / 10 por fase
  for (let j = 0; j < n; j++) {
    const a = base + (j - (n - 1) / 2) * st;
    E.push(bul(s.x, s.y, Math.cos(a) * 230, Math.sin(a) * 230, '#f4f', n === 1 ? 6 : [9,10,11][b.ph - 1]));
  }
}

/* ---- PAREDES VERMELHAS -------------------------------------------- */
// Nascem nas duas laterais, avançam ao centro e deixam uma abertura central segura
function walls(i,tel) {
  const ph = B.ph,
        gw = [200,180,165][ph - 1] + (dupla ? 50 : 0),
        cx = 400 + (i ? rnd(-1,1) * [0,50,80][ph - 1] : 0);
  Z.push({ kind:'side', cx, gw, tel, mv:.8, act:1.4, age:0, dmg:true });
  Som.alerta();
}

const sideR = z => {
  const s = clamp((z.age - z.tel) / z.mv, 0, 1),
        e = s * s * (3 - 2 * s),
        a = z.cx - z.gw / 2,
        b = z.cx + z.gw / 2;
  return [
    { x:0, y:100, w:a * e, h:H },
    { x:W - (W - b) * e, y:100, w:(W - b) * e, h:H }
  ];
};

/* ---- ANEL DE PROJÉTEIS (buraco negro) ----------------------------- */
function ring(b) {
  if (!HOLE) return;
  const p = nearest(HOLE.x),
        g = Math.atan2(p.y + 12 - HOLE.y, p.x + 19.5 - HOLE.x),
        N = 30;
  Som.boom();
  for (let i = 0; i < N; i++) {
    const a = g + (i + .5) * TAU / N;
    let d = Math.abs(((a - g) % TAU + TAU + Math.PI) % TAU - Math.PI);
    if (d < .45) continue; // vão de ~50° mirado no jogador
    E.push(bul(HOLE.x, HOLE.y, Math.cos(a) * 250, Math.sin(a) * 250, '#a0f', 6));
  }
}

/* ---- SELEÇÃO DE ATAQUE -------------------------------------------- */
function begin(b) {
  const ph = b.ph, k0 = b.n++;
  let n;

  if (ph === 3 && b.fc < 2 && b.hp <= b.max * [.2,.07][b.fc]) {
    b.fc++; n = 'cone';
  } // ATAQUE FINAL: com 20% e de novo com 7% de vida
  else if (ph === 3) n = ['dive','xplo','final','spit','guarda','vl','rot'][k0 % 7];
  // fase 3: ciclo fixo (investidas → explosão total → buraco final → leque → lasers)
  else {
    const pool = [ ['spit','walls','hole','rot'], ['spit','rot','dev','hole','vl','dive'] ][ph - 1];
    do { n = pool[rnd(0,pool.length) | 0]; } while (n === b.last);
  }

  b.last = n; b.atk = n; b.at = 0; b.q = []; b.len = 0;

  const Q = (t,f) => b.q.push({ t, f }),
        tel = [1.15,1,.9][ph - 1];

  b.fan = { rot:2.6, dev:2.4, xplo:2.4, vl:2.4 }[n] || 0;
  b.fanT = 1.3;
  // leque periódico em todo ataque, exceto buraco negro (hole/final), investida e paredes (que têm disparo próprio)

  if (n === 'spit') {
    const k = [4,5,6][ph - 1],
          iv = [.7,.62,.55][ph - 1],
          sh = SHOTS[ph - 1];
    for (let i = 0; i < k; i++) Q(.6 + i * iv, () => spit(b,sh));
    b.len = .6 + k * iv + .8;
  }
  else if (n === 'walls') {
    const k = 2, d = tel + 1.85, sh = SHOTS[ph - 1];
    for (let i = 0; i < k; i++) {
      Q(i * d, () => walls(i,tel));
      Q(i * d + tel, () => spit(b,sh));
      Q(i * d + tel + 1.1, () => spit(b,sh));
    }
    b.len = k * d + .2;
  } // leque ao lançar cada parede e de novo com ela fechada
  else if (n === 'rot') { Q(0, () => rotSet(b)); b.len = 1.4 + (ph === 3 ? 9 : 8) + .8; }
  else if (n === 'dev') {
    b.imune = true;
    Q(.3, () => zn(1,2.6,'dev'));
    Q(3.9, () => zn(1,2.4,'dev'));
    b.len = 7.2;
  }
  else if (n === 'xplo') { b.imune = true; Q(.3, () => zn(3,3.2,'xplo')); b.len = 5.2; }
  else if (n === 'dive') {
    b.imune = true;
    b.dives = ph === 3 ? 5 : 4;
    b.hold = 0;
    b.lz = [];
    aim(b);
  } // fase 2: 4 investidas sem laser residual · fase 3: 5 com laser   // imune do início ao fim das 5 investidas (endAtk desliga)
  else if (n === 'vl') {
    b.imune = true;
    LAS = { c:0, s:'move', t:0, x:ph === 3 ? rnd(300,500) : rnd(130,670), vw:ph === 3 ? 860 : 520, wl:[], done:false };
    b.mode = 'vl';
  }
  else if (n === 'guarda') startGuarda(b);
  else if (n === 'cone')   startCone(b);
  else if (n === 'final')  startFinal(b);
  else if (n === 'hole') {
    b.mode = 'hole';
    HOLE = { x:400, y:HY, r:0, s:'grow', t:0, a:0, e:0, cv:1.5, R:70 };
    b.len = ph === 2 ? 7.5 : 9;
    Q(b.len - 1.6, () => ring(b));
  }
}

function endAtk(b) {
  b.atk = '';
  b.mode = 'slither';
  b.q = [];
  FL = [];
  b.fan = 0;
  b.cd = [1.7,.7,.8][b.ph - 1];
  LAS = null; ROT = null; ZN = null; SW = [];
  b.dv = null; b.lz = []; b.dives = 0;
  b.imune = false; b.heal = false;
  if (HOLE) HOLE.s = 'shrink';
}

/* ---- LASER VERTICAL (fase 2) -------------------------------------- */
// Cabeça no topo → trava x → surgem 3 paredes (abrigo, sem dano) → carrega → dispara 4× com pausa
const WY = 630; // altura do topo das paredes (largura do feixe: LAS.vw — 520 na fase 2, 860 na fase 3)

function beamSegs(L) {
  let sg = [[L.x - L.vw / 2, L.x + L.vw / 2]];
  // trechos do feixe NÃO cobertos por parede (chegam ao chão); a colisão usa exatamente isto
  for (const w of L.wl) {
    const a = w.x, e2 = w.x + w.w;
    sg = sg.flatMap(([s,e]) => (e2 <= s || a >= e)
      ? [[s,e]]
      : [ ...(a > s ? [[s,a]] : []), ...(e2 < e ? [[e2,e]] : []) ]);
  }
  return sg;
}

// paredes de abrigo: fase 2 = 2 (a 1ª ao alcance do jogador, a outra em qualquer ponto do feixe) · fase 3 = 1, aleatória
function vlWalls(b,L) {
  const f3 = b.ph === 3,
        n = f3 ? 1 : 2,
        ww = f3 ? 100 : 80,
        q = hb(nearest(400)),
        px = q.x + q.w / 2,
        xs = [];
  let k = 0;
  while (xs.length < n && k++ < 200) {
    const x = xs.length
      ? rnd(Math.max(30, L.x - L.vw/2), Math.min(W - 30 - ww, L.x + L.vw/2 - ww))
      : clamp(px + rnd(-260,260) - ww/2, 30, W - 30 - ww);
    if (xs.every(o => Math.abs(o - x) > ww + 110)) xs.push(x);
  }
  if (!xs.length) xs.push(clamp(px - ww/2, 30, W - 30 - ww));
  L.wl = xs.map((x,i) => ({ x: i % 2 ? W + 120 : -200, tx:x, w:ww, t:-i * .3 }));
}

function updVL(b,dt) {
  const L = LAS, h = b.seg[0];
  L.t += dt;
  b.mode = 'vl';

  for (const w of L.wl) {
    w.t += dt;
    if (w.t > 0) {
      const d = w.tx - w.x;
      w.x += Math.sign(d) * Math.min(Math.abs(d), 700 * dt);
    }
  } // paredes entram deslizando pelas laterais, uma de cada vez

  if (L.s === 'move') {
    b.lw = Math.max(0, b.lw - dt * 2);
    if ((Math.abs(h.cx - L.x) < 10 && Math.abs(h.cy - 120) < 10 && L.t > .3) || L.t > 2) {
      L.s = 'charge';
      L.t = 0;
      L.x = h.x;
      // feixe travado na posição real da cabeça; só então as paredes surgem
      vlWalls(b,L);
      Som.carga(2.1);
    }
  }
  else if (L.s === 'charge') {
    b.la = Math.PI / 2;
    b.lw = Math.min(1, b.lw + dt * 1.8);
    b.jaw = Math.max(b.jaw,.9);
    if (L.t >= 2.1) {
      L.s = 'fire'; L.t = 0;
      Som.laser(); Som.verme();
      shake = .6; flash = .5;
    }
  }
  else if (L.s === 'fire') {
    b.la = Math.PI / 2;
    b.jaw = 1;
    if (L.t > .1 && L.t < .7) {
      const sg = beamSegs(L),
            x1 = L.x - L.vw / 2,
            y0 = h.y + 10;
      for (const p of vivos()) {
        const q = hb(p);
        if (q.y + q.h < y0) continue;
        const col = q.x < x1 + L.vw && q.x + q.w > x1;
        if (q.y + q.h / 2 < WY ? col : sg.some(([s,e]) => q.x < e && q.x + q.w > s)) dano(p);
      }
    } // acima da parede: exposto na coluna · abaixo: só onde nenhuma parede cobre
    if (L.t >= .85) {
      L.s = 'rest';
      L.t = 0;
      Som.boom();
      for (const w of L.wl) boom(w.x + w.w / 2, WY, '#7fffd4', 14, 160, .5);
    }
  }
  else {
    b.la = Math.PI / 2;
    b.lw = Math.max(0, b.lw - dt * 1.2);
    if (L.t >= 1.1) {
      L.wl = [];
      L.c++;
      if (L.c >= 4) L.done = true;
      else {
        L.s = 'move'; L.t = 0;
        {
          let nx;
          if (b.ph === 3) nx = rnd(300,500);
          else do { nx = rnd(130,670); } while (Math.abs(nx - L.x) < 150);
          L.x = nx;
        } /* posição do disparo sempre aleatória */
      }
    }
  }
}

/* ---- LASERES GIRATÓRIOS (3 na fase 2, 4 na fase 3) ---------------- */
// Pivô (400,480), alcance 400 → bordas da tela (~100px) ficam fora do alcance
const RPX = 400, RPY = 480, RL = 400;

const dseg = (px,py,ax,ay,bx,by) => {
  const dx = bx - ax, dy = by - ay,
        t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1);
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
};

function rotSet(b) {
  const f = b.ph === 3;
  ROT = { n: b.ph === 2 ? 3 : b.ph === 3 ? 5 : 4, a:rnd(0,TAU), w:[.65,.7,.85][b.ph - 1], dir: Math.random() < .5 ? -1 : 1, t:0, tel:1.4, dur:f ? 9 : 8 };
  Som.carga(1.4);
  Som.laser(1.4);
}

function updRot(dt) {
  const R = ROT;
  if (!R) return;
  R.t += dt;
  if (R.t < R.tel || R.t > R.tel + R.dur) return;
  R.a += R.dir * R.w * dt;
  for (const p of vivos()) {
    const q = hb(p),
          px = q.x + q.w / 2,
          py = q.y + q.h / 2;
    for (let i = 0; i < R.n; i++) {
      const a = R.a + i * TAU / R.n;
      if (dseg(px,py,RPX,RPY,RPX + Math.cos(a) * RL,RPY + Math.sin(a) * RL) < 20 + q.h / 2) { dano(p); break; }
    }
  }
}

/* ---- DEVASTADOR CIRCULAR (fase 2) e EXPLOSÃO TOTAL (fase 3) ------- */
// Círculos verdes = áreas seguras; quem estiver fora recebe dano na explosão (mesma geometria do desenho)
function zn(n,tel,kind) {
  const r = n > 1 ? 85 : 72,
        cs = [];
  let k = 0;
  while (cs.length < n && k++ < 300) {
    const x = rnd(r + 15, W - r - 15);
    if (cs.every(q => Math.abs(q.x - x) > 2 * r + 20)) cs.push({ x, y:rnd(r + 130, H - 40), r });
  }
  ZN = { cs, tel, t:0, kind, fired:false };
  Som.carga(tel);
}

function updZN(dt) {
  const Zn = ZN;
  if (!Zn) return;
  Zn.t += dt;
  if (!Zn.fired && Zn.t >= Zn.tel) {
    Zn.fired = true;
    shake = .5;
    flash = Zn.kind === 'xplo' ? .6 : .35;
    Som.impacto();
    if (Zn.kind === 'xplo') Som.verme();
    for (const p of vivos()) {
      const q = hb(p),
            cx = q.x + q.w / 2,
            cy = q.y + q.h / 2;
      if (!Zn.cs.some(a => Math.hypot(cx - a.x, cy - a.y) <= a.r)) dano(p);
    }
  }
  if (Zn.t >= Zn.tel + .9) ZN = null;
}

/* ---- BURACO NEGRO FINAL (fase 3) ---------------------------------- */
// Centro da arena, chefe imune e se cura → explode → 4 ondas em anel que expandem e recuam (cada uma com um vão)
function startFinal(b) {
  b.mode = 'final';
  b.imune = true;
  b.fs = 'sum';
  b.ft = 0;
  b.nw = 0;
  HOLE = { x:400, y:400, r:0, s:'grow', t:0, a:0, e:0, cv:99, R:85 };
  Som.rugido();
  Som.carga(5.4);
}

function spawnWave() {
  const p = nearest(400),
        q = hb(p),
        g = Math.atan2(q.y + q.h/2 - 400, q.x + q.w/2 - 400) + rnd(-.35,.35);
  SW.push({ r:30, d:1, g, gw:.5 });
  Som.impacto();
}

function updFinal(b,dt) {
  b.ft += dt;
  if (b.fs === 'sum') {
    b.hp = Math.min(b.max, b.hp + b.max * .012 * dt); // ≈ +6% da vida em 5 s
    if (b.ft >= 5.4) {
      b.fs = 'wave';
      b.ft = 0;
      b.imune = false;
      b.mode = 'slither';
      if (HOLE) HOLE.s = 'shrink';
      boom(400,400,PAL[2][3],70,420,1.1);
      shake = .8; flash = .7;
      Som.rugido();
    }
  } else {
    while (b.nw < 4 && b.ft >= b.nw * 1.1) { spawnWave(); b.nw++; }
    if (b.nw >= 4 && !SW.length) endAtk(b);
  }
}

function updSW(dt) {
  for (const w of SW) {
    w.r += w.d * 340 * dt;
    if (w.d > 0 && w.r >= 620) w.d = -1;
  }
  for (const p of vivos()) {
    const q = hb(p),
          dx = q.x + q.w/2 - 400,
          dy = q.y + q.h/2 - 400,
          d = Math.hypot(dx,dy),
          an = Math.atan2(dy,dx);
    for (const w of SW)
      if (Math.abs(d - w.r) < 16 + q.h/2 && Math.abs(dAng(an,w.g)) > w.gw) dano(p);
  } // colisão segue raio e posição reais de cada onda
  SW = SW.filter(w => w.r > 0 || w.d > 0);
}

/* ---- ESCUDO VAMPÍRICO (fase 3) ------------------------------------ */
// 5,4 s de carga com o escudo ativo (dano vira cura) → escudo cai → 4 leques em sequência
const GC = 5.4;

function startGuarda(b) {
  b.mode = 'guarda';
  b.heal = true;
  banner = { t:2.6, s:'ESCUDO VAMPÍRICO', u:'dano vira CURA — pare de atirar!' };
  Som.alerta();
  Som.carga(GC);
  const Q = (t,f) => b.q.push({ t, f });
  Q(GC, () => {
    b.heal = false;
    flash = .35;
    shake = .4;
    boom(b.seg[0].x, b.seg[0].y, '#5dff9a', 40, 260, .7);
    Som.impacto();
  }); // escudo cai: o chefe volta a receber dano normal
  for (let i = 0; i < 4; i++) Q(GC + .6 + i * .55, () => spit(b,SHOTS[2]));
  b.len = GC + .6 + 3 * .55 + .9;
}

/* ---- ATAQUE FINAL (fase 3, com 20% e 7% de vida) ------------------ */
// Carrega → rajadas em CONE + lasers finos travados. Só a cabeça recebe dano.
const coneAng = b => {
  const h = b.seg[0],
        q = hb(nearest(h.x));
  return Math.atan2(q.y + q.h/2 - h.y, q.x + q.w/2 - h.x);
};

function startCone(b) {
  b.mode = 'cone';
  b.ca = Math.PI / 2;
  b.ft = 0;
  const Q = (t,f) => b.q.push({ t, f });
  banner = { t:3, s:'ATAQUE FINAL', u:'só a CABEÇA recebe dano' };
  Som.rugido(); Som.verme();
  Som.carga(1.8);
  flash = .6; shake = .6;
  for (let i = 0; i < 14; i++) Q(1.8 + i * .62, () => coneBurst(b));
  for (let i = 0; i < 4; i++)  Q(2.6 + i * 2.3, () => fineLasers(b));
  b.q.sort((x,y) => x.t - y.t);
  b.len = 12.4;
} // a fila precisa estar em ordem de tempo

function coneBurst(b) {
  const h = b.seg[0],
        n = dupla ? 13 : 11;
  Som.cuspe();
  b.jaw = 1;
  for (let j = 0; j < n; j++) {
    const a = b.ca + (j - (n - 1) / 2) * .125 + rnd(-.012,.012),
          v = rnd(190,270);
    E.push(bul(h.x, h.y, Math.cos(a) * v, Math.sin(a) * v, j % 2 ? '#ff5a40' : '#ffd36b', 8));
  }
} // cone de ±35°

function fineLasers(b) {
  const h = b.seg[0],
        as = [];
  for (const p of vivos()) {
    const q = hb(p),
          a = Math.atan2(q.y + q.h/2 - h.y, q.x + q.w/2 - h.x);
    as.push(a, a - .3, a + .3);
  } // um sobre cada jogador + 2 laterais, travados
  for (const a of as.slice(0, dupla ? 6 : 3)) FL.push({ x0:h.x, y0:h.y, a, age:0, tel:.95, act:.4 });
  Som.alerta();
  Som.laser(.95);
}

function updFL(dt) {
  if (!B || !FL.length) return;
  const h = B.seg[0];
  for (const l of FL) {
    l.age += dt;
    l.x0 = h.x;
    l.y0 = h.y;
    if (l.age >= l.tel && l.age < l.tel + l.act)
      for (const p of vivos()) {
        const q = hb(p);
        if (dseg(q.x + q.w/2, q.y + q.h/2, l.x0, l.y0, l.x0 + Math.cos(l.a) * 2400, l.y0 + Math.sin(l.a) * 2400) < 8 + q.h/2) dano(p);
      }
  }
  FL = FL.filter(l => l.age < l.tel + l.act + .25);
}

/* =====================================================================
   8. POWER-UPS e PROJÉTEIS DOS JOGADORES
   ===================================================================== */
// Power-ups (caem do chefe a cada 20% de vida perdida) e lasers residuais das investidas
const ITEM = { P:'#ff8800', S:'#44ffff', V:'#ff44ff', B:'#ff3333', C:'#9999ff', E:'#ffffff', L:'#44ff44' };
const NOME_ARMA = { C:'ROUNDABOUT', E:'CHARGE', L:'CHASER' };
const ct = p => 1 - .2 * p.mult; // P: cada coleta reduz cooldown/carga do Charge em 20% (até 3x)

function pickPU() {
  const v = vivos(),
        armas = ['C','E','L'].filter(k => !v.length || !v.every(p => p.arma === k));
  const pool = ['P','S','V','B', ...armas];
  return pool[rnd(0,pool.length) | 0];
} // armas que todos já têm ficam fora do sorteio

function dropPU(b) {
  const h = b.seg[0];
  PU.push({ x:clamp(h.x, 40, W - 40) - 10, y:Math.max(h.y, 130), w:20, h:20, k:pickPU() });
  Som.alerta();
} // chefe: 1 item a cada 20% de vida perdida

function solta(x,y) {
  if (Math.random() >= .2) return;
  PU.push({ x:x - 10, y, w:20, h:20, k:pickPU() });
} // aliens: 20% de drop (igual ao jogo base)

function bomba(p) {
  const r = { x:p.x + p.w/2 - 50, y:0, w:100, h:H };
  FX.push({ x:r.x, w:100, t:.5 });
  Som.boom();
  shake = .4; // faixa vertical de 100px centrada na nave
  for (const a of [...A]) if (hit(r,a)) matar(a,p);
  E = E.filter(e => !(e.x > r.x && e.x < r.x + r.w));
  if (B && B.st === 'fight' && B.seg.some(s => s.y > 0 && s.y < H && cr(s.x, s.y, rad(0), r))) hurt(10,p,false,'E');
}

function pegaPU(p,k) {
  Som.tiro();
  if (k === 'P') p.mult = Math.min(3, p.mult + 1);
  else if (k === 'S') p.esc = 12;
  else if (k === 'V') p.vel = 12;
  else if (k === 'B') bomba(p);
  else if (p.arma !== k) {
    p.arma = k;
    p.hold = 0;
    p.cr = 0;
    Som.cargaStop(p.k.n);
  }
} // armas ficam até levar dano

function updPU(dt) {
  for (const u of PU) {
    u.y += 95 * dt;
    for (const p of vivos()) if (hit(u, hb(p))) { u.y = 1e4; pegaPU(p,u.k); }
  }
  PU = PU.filter(u => u.y < H);
  for (const f of FX) f.t -= dt;
  FX = FX.filter(f => f.t > 0);
}

function drawPU(u) {
  const col = ITEM[u.k],
        bob = Math.sin(T * 6 + u.x) * 1.5;
  c.save();
  c.translate(u.x, u.y + bob);
  c.shadowColor = col;
  c.shadowBlur = 14;
  c.fillStyle = col;
  c.beginPath();
  c.roundRect ? c.roundRect(0,0,u.w,u.h,6) : c.rect(0,0,u.w,u.h);
  c.fill();
  c.shadowBlur = 0;
  c.strokeStyle = '#fff';
  c.lineWidth = 1.5;
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,.28)';
  c.fillRect(2,2,u.w - 4,5);
  txt(u.k, u.w/2, u.h - 4, 15, '#000', 'center', false);
  c.restore();
}

// disparo / alvo / consumo dos projéteis dos jogadores (Roundabout [C], Charge [E], Chaser [L])
function disp(p) {
  const o = { x:p.x + p.w/2 - 2, y:p.y, w:4, h:12, o:p, dm:1 };
  if (p.arma === 'C') {
    o.w = 6; o.h = 10;
    o.rb = 1; o.ph = 0; o.hs = [];
    o.col = '#99f';
    o.x = p.x + p.w/2 - 3;
  } else if (p.arma === 'L') {
    o.w = 5; o.h = 12;
    o.ch = 1; o.dm = .5;
    o.col = '#4f4';
  }
  PB.push(o);
}

function usa(b,t) {
  if (b.rb || b.pi) {
    if (b.hs.includes(t)) return false;
    b.hs.push(t);
    return true;
  }
  b.y = -100;
  return true;
}

function alvo(b) {
  const bx = b.x + b.w/2,
        by = b.y + b.h/2;
  let m = 1e9, r = null;
  const L = A.map(a => ({ x:a.x + a.w/2, y:a.y + a.h/2 }));
  if (B && B.st !== 'dead') for (const s of B.seg) if (s.y > 0 && s.y < H) L.push({ x:s.x, y:s.y });
  for (const t of L) {
    const d = Math.hypot(t.x - bx, t.y - by);
    if (d < m) { m = d; r = t; }
  }
  return r;
}

function drawPB(b) {
  const cx = b.x + b.w/2,
        cy = b.y + b.h/2,
        col = b.col || b.o.k.cor;
  c.save();
  c.translate(cx,cy);

  if (b.big) {
    const r = 15 + 2 * Math.sin(T * 30);
    for (let i = 1; i <= 4; i++) {
      c.globalAlpha = .22 / i * 1.6;
      c.fillStyle = '#ff7bf5';
      c.beginPath();
      c.arc(0, i * 13, r * (1 - i * .15), 0, TAU);
      c.fill();
    }
    c.globalAlpha = 1;
    c.shadowColor = '#ff40f0';
    c.shadowBlur = 26;
    c.fillStyle = '#ff9cf8';
    c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(0,0,r * .55,0,TAU); c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = '#fff';
    c.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const a = T * 20 + i * 2.1;
      c.beginPath();
      c.moveTo(Math.cos(a) * r * .5, Math.sin(a) * r * .5);
      c.lineTo(Math.cos(a + .5) * r * 1.3, Math.sin(a + .5) * r * 1.3);
      c.stroke();
    }
  }
  else if (b.rb) {
    c.rotate(T * 12);
    c.shadowColor = col;
    c.shadowBlur = 12;
    c.strokeStyle = col;
    c.lineWidth = 3;
    c.beginPath(); c.arc(0,0,6.5,0,TAU); c.stroke();
    c.fillStyle = '#fff';
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.arc(Math.cos(i * 2.094) * 6.5, Math.sin(i * 2.094) * 6.5, 1.8, 0, TAU);
      c.fill();
    }
    c.shadowBlur = 0;
    c.fillStyle = rgba('#9999ff', .8);
    c.beginPath(); c.arc(0,0,2.3,0,TAU); c.fill();
  }
  else if (b.ch) {
    let ang = -Math.PI / 2;
    if (b.lx !== undefined && Math.hypot(cx - b.lx, cy - b.ly) > .3) ang = Math.atan2(cy - b.ly, cx - b.lx);
    c.rotate(ang);
    const g = c.createLinearGradient(-22,0,0,0);
    g.addColorStop(0,'rgba(80,255,80,0)');
    g.addColorStop(1,'rgba(120,255,120,.9)');
    c.fillStyle = g;
    poly([[-22,0],[0,-3.5],[0,3.5]]);
    c.shadowColor = '#4f4';
    c.shadowBlur = 12;
    c.fillStyle = '#6fff6f';
    c.beginPath(); c.arc(0,0,4,0,TAU); c.fill();
    c.shadowBlur = 0;
    c.fillStyle = '#eaffea';
    c.beginPath(); c.arc(1,0,1.8,0,TAU); c.fill();
  }
  else if (b.w <= 2) {
    c.shadowColor = col;
    c.shadowBlur = 8;
    c.fillStyle = col;
    c.beginPath(); c.arc(0,0,2.4,0,TAU); c.fill();
    c.shadowBlur = 0;
  }
  else {
    for (let i = 1; i <= 3; i++) {
      c.globalAlpha = .32 / i;
      c.fillStyle = col;
      c.fillRect(-b.w/2, b.h/2 + (i - 1) * 5, b.w, 5);
    }
    c.globalAlpha = 1;
    c.shadowColor = col;
    c.shadowBlur = 10;
    c.fillStyle = col;
    c.fillRect(-b.w/2, -b.h/2, b.w, b.h);
    c.shadowBlur = 0;
    c.fillStyle = '#fff';
    c.fillRect(-.8, -b.h/2 + 1, 1.6, b.h - 2);
  }

  c.restore();
  b.lx = cx;
  b.ly = cy;
}

   9. ONDAS DE ALIENS
   ===================================================================== */
// Ao fim da fase 1: roxos · ao fim da fase 2: roxos e laranjas
// Sprites, vida, tiros, laser fino e mergulhos do jogo base
const SPR_U = [
  ["0011001100","0111111110","1101111011","1111111111","1111111111","0110000110","1101001011","1000000001"],
  ["0011001100","0111111110","1101111011","1111111111","1111111111","0110000110","0100110010","0010000100"]
];
const SPR_R = [
  ["00100000100","00010001000","00111111100","01101110110","11111111111","10111111101","10100000101","00011011000"],
  ["00100000100","10010001001","10111111101","11101110111","11111111111","01111111110","00100000100","01000000010"]
];
const AT = {
  3: { s:SPR_U, cor:'#b84dff', pts:60, tiro:.12, bv:270, dbl:1 }, // roxo (tiro duplo)
  4: { s:SPR_R, cor:'#ff9a1f', pts:35, tiro:.07, bv:200 }          // laranja (tiro + laser fino)
};

const spr = (m,x,y,z,col) => {
  c.fillStyle = col;
  for (let r = 0; r < m.length; r++)
    for (let q = 0; q < m[r].length; q++)
      if (m[r][q] === '1') c.fillRect(x + q * z, y + r * z, z, z);
};

function novaOnda(tp) {
  A = [];
  ADIR = 1;
  AY0 = 130;
  AX0 = (W - 10 * 44) / 2;
  lzT = 3;
  const hp = 1 + (dupla ? 1 : 0); // 10 colunas; cada item de tp é o tipo de uma fileira
  tp.forEach((t,r) => {
    for (let q = 0; q < 10; q++)
      A.push({ t, gx:q * 52, gy:r * 36, x:AX0 + q * 52, y:AY0 + r * 36, w:32, h:22, hp, mx:hp, dive:false, vx:0, vy:0, lz:0 });
  });
  ntot = A.length;
}

function matar(a,p) {
  const t = AT[a.t];
  if (p) p.pts += t.pts;
  boom(a.x + 12, a.y + 8, t.cor, 16);
  Som.boom();
  solta(a.x + 12, a.y);
  const i = A.indexOf(a);
  if (i >= 0) A.splice(i,1);
}

function updA(dt) {
  if (!A.length) return;
  const n = A.length,
        sp = Math.min(200, 34 + (ntot - n) * 2.2 + 60) * .7;
  AX0 += ADIR * sp * dt;
  let mn = 1e9, mx = -1e9;

  lzT -= dt;
  if (lzT <= 0) {
    const o = A.filter(a => a.t === 4 && !a.dive && a.lz <= 0);
    if (o.length && Math.random() < .6) {
      o[rnd(0,o.length) | 0].lz = 1.6;
      lzT = 4 + rnd(0,1.5);
    } else lzT = .7;
  } // laser fino: 1 por vez, com carga

  for (const a of A) {
    const t = AT[a.t];
    if (a.dive) {
      const q = nearest(a.x);
      if (q) a.vx += Math.sign(q.x + 20 - a.x) * 140 * dt;
      a.vx = clamp(a.vx, -150, 150);
      a.x += a.vx * dt;
      a.y += a.vy * dt;
    } else {
      a.x = AX0 + a.gx;
      a.y = AY0 + a.gy;
      mn = Math.min(mn, a.x);
      mx = Math.max(mx, a.x + a.w);
      if (E.length < 36 && Math.random() < t.tiro * (1 + .18 * 9) * dt) {
        E.push(bul(a.x + (t.dbl ? 6 : 12), a.y + 14, 0, t.bv, t.cor, 4));
        if (t.dbl) E.push(bul(a.x + 18, a.y + 14, 0, t.bv, t.cor, 4));
      }
    }
    if (a.lz > 0) {
      a.lz -= dt;
      if (a.lz <= .45 && a.lz > 0) {
        const r = { x:a.x + 14, y:a.y + a.h, w:4, h:H };
        for (const p of vivos()) if (hit(r, hb(p))) dano(p);
      }
    }
  }

  if ((mx > W - 20 && ADIR > 0) || (mn < 20 && ADIR < 0)) {
    ADIR *= -1;
    AY0 = Math.min(AY0 + 16, 430);
  }

  diveT -= dt;
  if (diveT <= 0) {
    diveT = .6;
    if (Math.random() < (dupla ? .2 : .1)) {
      const el = A.filter(a => !a.dive && (dupla || a.t === 4));
      if (el.length) {
        const a = el[rnd(0,el.length) | 0];
        a.dive = true;
        a.vy = 260;
        a.vx = 0;
      }
    }
  } // solo: só laranjas mergulham · dupla: qualquer um

  for (const a of [...A]) {
    if (a.dive) {
      for (const p of vivos()) if (hit(a, hb(p))) { dano(p); matar(a,null); break; }
    }
  }
  for (const a of [...A]) if (a.dive && a.y > H) A.splice(A.indexOf(a),1);
}

function drawA() {
  for (const a of A) {
    const t = AT[a.t],
          m = t.s[Math.floor(T * (a.t === 3 ? 5 : 2.5)) % 2];
    c.globalAlpha = .13;
    c.fillStyle = t.cor;
    c.beginPath(); c.arc(a.x + a.w/2, a.y + a.h/2, 21, 0, TAU); c.fill();
    c.globalAlpha = 1;
    spr(m, a.x + (a.w - m[0].length * 3) / 2, a.y + (a.h - 24) / 2, 3, a.hp < a.mx ? '#9cf' : t.cor);
    if (a.lz > 0) {
      const cx = a.x + a.w/2;
      if (a.lz > .45) {
        if (Math.floor(T * 14) % 2) {
          c.fillStyle = 'rgba(255,154,31,.5)';
          c.fillRect(cx - 2, a.y + a.h, 4, H);
        }
      } else {
        c.fillStyle = '#ff9a1f';
        c.shadowColor = '#f80';
        c.shadowBlur = 10;
        c.fillRect(cx - 2, a.y + a.h, 4, H);
        c.shadowBlur = 0;
      }
    }
  }
  for (const f of FX) {
    c.fillStyle = `rgba(255,90,40,${f.t * 1.6})`;
    c.fillRect(f.x, 0, f.w, H);
    c.fillStyle = `rgba(255,255,255,${f.t * 1.6})`;
    c.fillRect(f.x + f.w/2 - 5, 0, 10, H);
  }
}

/* ---- lasers residuais das investidas ------------------------------ */
function updLZ(dt) {
  if (!B) return;
  for (const l of B.lz) {
    l.age += dt;
    if (l.age < .6) continue;
    for (const p of vivos()) {
      const q = hb(p);
      if (dseg(q.x + q.w/2, q.y + q.h/2, l.x0, l.y0, l.x0 + l.ux * 2600, l.y0 + l.uy * 2600) < rad(1) * .75 + q.h/2) dano(p);
    }
  }
} // mesma largura do corpo do chefe

function drawLZ(l,k) {
  const hw = rad(1) * .75,
        pre = l.age < .6;
  c.save();
  c.translate(l.x0, l.y0);
  c.rotate(Math.atan2(l.uy, l.ux));
  if (pre) {
    c.fillStyle = rgba(k[2], .15);
    c.fillRect(0, -hw, 2600, hw * 2);
    c.strokeStyle = rgba(k[3], .9);
    c.lineWidth = 3;
    c.setLineDash([12,8]);
    c.strokeRect(0, -hw, 2600, hw * 2);
    c.setLineDash([]);
  } else {
    c.shadowColor = k[2];
    c.shadowBlur = 30;
    c.fillStyle = rgba(k[2], .6);
    c.fillRect(0, -hw, 2600, hw * 2);
    c.shadowBlur = 0;
    c.fillStyle = rgba(k[3], .9);
    c.fillRect(0, -hw * .55, 2600, hw * 1.1);
    c.fillStyle = '#fff';
    c.fillRect(0, -hw * .2, 2600, hw * .4);
  }
  c.restore();
}
