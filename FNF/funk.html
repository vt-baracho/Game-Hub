<!DOCTYPE html>

<style>
:root{--bg:#0a0618;--pu:#a855f7;--bl:#38bdf8;--pk:#ff3ea5;--tx:#efe9ff;--mu:#9a8fc2;--pn:rgba(30,18,60,.72)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

#bg{position:fixed;inset:0;background:radial-gradient(circle at 80% 15%,#ff3ea540 0,transparent 20%),radial-gradient(ellipse at 50% 120%,#a855f760,transparent 60%),linear-gradient(#0a0618,#150a33 70%,#240a4a)}
#bg:before{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#9be,transparent),radial-gradient(1px 1px at 150px 20px,#f9c,transparent);background-size:200px 120px;opacity:.6;animation:tw 4s infinite alternate}
#bg:after{content:"";position:absolute;left:-50%;right:-50%;bottom:-10%;height:40%;background:repeating-linear-gradient(90deg,#a855f755 0 1px,transparent 1px 60px),repeating-linear-gradient(0deg,#38bdf844 0 1px,transparent 1px 40px);transform:perspective(300px) rotateX(60deg);mask-image:linear-gradient(transparent,#000)}
@keyframes tw{to{opacity:.25}}@keyframes in{from{opacity:0;transform:translateY(10px)}}

.btn:hover,.btn:active{transform:translateY(-2px);box-shadow:0 0 22px #a855f788,inset 0 0 12px #38bdf822;border-color:var(--bl)}

<script>
'use strict';
/* ===== Util / constantes ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LN=['←','↓','↑','→'],LC=['#a855f7','#38bdf8','#ff3ea5','#22d3ee'],L2I=[0,3,2,1];
const POSES=['Esquerda','Direita','Cima','Baixo','Vitória','Derrota'];
const DK=[['KeyA','KeyS','KeyW','KeyD'],['ArrowLeft','ArrowDown','ArrowUp','ArrowRight'],['KeyJ','KeyK','KeyI','KeyL'],['Numpad4','Numpad5','Numpad8','Numpad6']];
const DS={speed:1,offset:0,sens:1,win:70,vol:.8,voc:1,voff:0,tw:70};
const MOB=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad/i.test(navigator.userAgent);
const MAXP=MOB?2:4,DPR=Math.min(window.devicePixelRatio||1,2);
let S={n:1,mode:'free',cuts:{},song:'demo',ch:['d0','d1','d2','d3'],keys:DK.map(k=>[...k]),set:{...DS}};
let CH={},songs=[],AC,MG,bufs={},G=null,RES=[],RT=null,KM={},rebind=null,pv=null,vc='d0',noise=null,lastSc=0;
const save=()=>DB.put('kv',{k:'state',v:S}).catch(()=>{});
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)};
const kn=c=>c.replace('Key','').replace('Digit','').replace('Arrow','').replace('Left','←').replace('Right','→').replace('Up','↑').replace('Down','↓').replace('Numpad','Num ');

/* ===== Armazenamento (IndexedDB) ===== */
const DB={db:null,
 open(){return new Promise((ok,er)=>{const r=indexedDB.open('nightfunk',1);r.onupgradeneeded=()=>['kv','chars','songs'].forEach(s=>r.result.createObjectStore(s,{keyPath:s=='kv'?'k':'id'}));r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>er(r.error)})},
 tx(s,m,f){return new Promise((ok,er)=>{if(!this.db)return er('sem db');const t=this.db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>er(t.error)})},
 put(s,v){return this.tx(s,'readwrite',o=>o.put(v))},get(s,k){return this.tx(s,'readonly',o=>o.get(k))},
 all(s){return this.tx(s,'readonly',o=>o.getAll())},del(s,k){return this.tx(s,'readwrite',o=>o.delete(k))}};

/* ===== Personagens ===== */
const img=src=>{const i=new Image();i.src=src;return i};
function defSprite(k,h){
 const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),C=`hsl(${h},90%,60%)`;
 const Z=[[-10,0,[14,66],[92,90]],[10,0,[36,90],[114,66]],[0,-2,[40,22],[88,22]],[0,14,[42,112],[86,112]],[0,0,[28,18],[100,18]],[0,12,[46,100],[82,100]]][k];
 g.lineCap='round';g.strokeStyle=C;g.shadowColor=C;g.shadowBlur=8;
 const ln=(a,b,x,y,w)=>{g.lineWidth=w;g.beginPath();g.moveTo(a,b);g.lineTo(x,y);g.stroke()};
 ln(58,96,54,124,10);ln(70,96,74,124,10);ln(64,58,64,98,20);ln(52,64,Z[2][0],Z[2][1],9);ln(76,64,Z[3][0],Z[3][1],9);
 const hx=64+Z[0],hy=42+Z[1];g.fillStyle='#ffd9b0';g.beginPath();g.arc(hx,hy,22,0,7);g.fill();g.stroke();
 g.shadowBlur=0;g.fillStyle=C;g.fillRect(hx-24,hy-27,48,12);g.fillStyle='#222';g.strokeStyle='#222';g.lineWidth=3;
 [-8,8].forEach(d=>{g.beginPath();g.arc(hx+d,hy-2,3,0,7);g.fill()});g.beginPath();
 if(k==4)g.arc(hx,hy+4,9,.1,3.04);else if(k==5)g.arc(hx,hy+19,9,3.3,6.1);else g.arc(hx,hy+10,5,0,7);
 k>3?g.stroke():g.fill();return c.toDataURL()}
function addDef(i){CH['d'+i]={id:'d'+i,def:1,name:['Neon Rosa','Neon Azul','Neon Roxo','Neon Ciano'][i],imgs:[0,1,2,3,4,5].map(k=>img(defSprite(k,[320,200,270,175][i])))}}
function addChar(c){CH[c.id]={id:c.id,name:c.name,imgs:c.imgs.map(b=>img(URL.createObjectURL(b)))}}
const chOf=p=>CH[S.ch[p]]||CH['d'+p];

/* ===== Áudio ===== */
function ensureAudio(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination)}MG.gain.value=S.set.vol;AC.resume()}
const allSongs=()=>[{id:'demo',name:'Demo Night Funk (120 BPM)'},...songs];
async function getBuf(id){
 if(bufs[id])return bufs[id];ensureAudio();
 if(id=='demo'){const sr=AC.sampleRate,b=AC.createBuffer(1,32*sr,sr),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++){const t=i/sr,p=t%.5,q=t%.25,bt=Math.floor(t*2)%2;
   d[i]=Math.sin(6.283*(45*p+80*(1-Math.exp(-25*p))/25))*Math.exp(-8*p)*.8+(bt?(Math.random()*2-1)*Math.exp(-20*p)*.4:0)+(Math.random()*2-1)*Math.exp(-60*q)*.12}
  return bufs[id]=b}
 const s=songs.find(x=>x.id==id);return bufs[id]=await AC.decodeAudioData(await s.blob.arrayBuffer());
}
function scratch(){
 const n=AC.currentTime;if(n-lastSc<.18)return;lastSc=n;
 if(!noise){noise=AC.createBuffer(1,AC.sampleRate*.28|0,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),o=AC.createOscillator(),og=AC.createGain();
 s.buffer=noise;f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(4000,n);f.frequency.exponentialRampToValueAtTime(600,n+.28);
 g.gain.setValueAtTime(.5,n);g.gain.exponentialRampToValueAtTime(.001,n+.28);
 o.type='sawtooth';o.frequency.setValueAtTime(900,n);o.frequency.exponentialRampToValueAtTime(120,n+.25);og.gain.value=.12;
 o.connect(og);og.connect(g);s.connect(f);f.connect(g);g.connect(MG);s.start(n);o.start(n);o.stop(n+.28)}

/* ===== Detecção de batidas ===== */
function makeChart(b,sens){
 const d=b.getChannelData(0),sr=b.sampleRate,H=512,nb=Math.floor(d.length/H),rl=new Float32Array(nb),rh=new Float32Array(nb),a=1-Math.exp(-2*Math.PI*200/sr);let lp=0;
 for(let k=0;k<nb;k++){let sl=0,sh=0;for(let i=k*H,e=i+H;i<e;i++){const x=d[i];lp+=a*(x-lp);const h=x-lp;sl+=lp*lp;sh+=h*h}rl[k]=Math.sqrt(sl/H);rh[k]=Math.sqrt(sh/H)}
 const fl=new Float32Array(nb),fh=new Float32Array(nb);let ml=0,mh=0;
 for(let k=3;k<nb;k++){fl[k]=Math.max(0,rl[k]-(rl[k-1]+rl[k-2]+rl[k-3])/3);fh[k]=Math.max(0,rh[k]-(rh[k-1]+rh[k-2]+rh[k-3])/3);ml+=fl[k];mh+=fh[k]}
 ml=ml/nb+1e-9;mh=mh/nb+1e-9;const f=new Float32Array(nb),pre=new Float64Array(nb+1);
 for(let k=0;k<nb;k++){f[k]=fl[k]/ml+fh[k]/mh*.8;pre[k+1]=pre[k]+f[k]}
 const out=[],W=43,gap=Math.max(.12,.2/Math.sqrt(sens));let last=-9,seed=12345;
 for(let k=2;k<nb-1;k++){
  const lo=Math.max(0,k-W),hi=Math.min(nb,k+W),m=(pre[hi]-pre[lo])/(hi-lo);
  if(f[k]>m*1.5/sens+.2&&f[k]>=f[k-1]&&f[k]>f[k+1]){
   const t=k*H/sr;if(t<.4||t-last<gap)continue;last=t;
   seed=(seed*1103515245+12345)&0x7fffffff;const low=fl[k]/ml>=fh[k]/mh;
   out.push({t,l:(low?0:2)+((seed>>8)&1)})}}
 return out}

/* ===== Modo vocal: aproxima a voz pela banda 300-3000 Hz no canal central ===== */
function makeVocal(b,sens,off){
 const L=b.getChannelData(0),R=b.numberOfChannels>1?b.getChannelData(1):null,sr=b.sampleRate,H=512,nb=Math.floor(L.length/H),c=f=>1-Math.exp(-2*Math.PI*f/sr),a3=c(300),a1=c(1000),a2=c(3000);
 let m3=0,m1=0,m2=0,s3=0,s1=0,s2=0;const env=new Float32Array(nb),br=new Float32Array(nb);
 for(let k=0;k<nb;k++){let eA=0,eB=0,sS=0;
  for(let i=k*H,e=i+H;i<e;i++){const l=L[i],r=R?R[i]:l,m=(l+r)/2,s=(l-r)/2;
   m3+=a3*(m-m3);m1+=a1*(m-m1);m2+=a2*(m-m2);s3+=a3*(s-s3);s1+=a1*(s-s1);s2+=a2*(s-s2);
   const A=m1-m3,B=m2-m1,SA=s1-s3,SB=s2-s1;eA+=A*A;eB+=B*B;sS+=SA*SA+SB*SB}
  const me=eA+eB,w=me/(me+sS*1.5+1e-12);env[k]=Math.sqrt(me/H)*w*w;br[k]=eB/(me+1e-12)}
 const P=new Float64Array(nb+1);for(let k=0;k<nb;k++)P[k+1]=P[k]+env[k];
 const av=(k,w)=>{const a=Math.max(0,k-w),z=Math.min(nb,k+w+1);return(P[z]-P[a])/(z-a)},gm=P[nb]/nb+1e-12;
 const e3=new Float32Array(nb),act=new Uint8Array(nb),fa=new Float32Array(nb);
 for(let k=0;k<nb;k++){e3[k]=av(k,1);act[k]=av(k,4)>gm*.9/sens?1:0}
 let last=-1;for(let k=0;k<nb;k++)if(act[k]){if(last>=0&&k-last>1&&k-last<30)for(let j=last+1;j<k;j++)act[j]=1;last=k}
 for(let k=0;k<nb;){if(!act[k]){k++;continue}let z=k;while(z<nb&&act[z])z++;if(z-k<22)for(let j=k;j<z;j++)act[j]=0;k=z}
 for(let k=4;k<nb;k++)fa[k]=e3[k]-(e3[k-1]+e3[k-2]+e3[k-3]+e3[k-4])/4;
 const out=[],gap=Math.max(.15,.2/Math.sqrt(sens));let lt=-9,seed=999;
 for(let k=6;k<nb-10;k++){
  if(!act[k])continue;const t=k*H/sr+off/1000,st=!act[k-1];

function envSec(b){const d=b.getChannelData(0),sr=b.sampleRate,n=Math.floor(b.duration*2),e=new Float32Array(n);

function rMusic(){
 body('music').innerHTML=`<div class="pnl"><h3>Músicas (${songs.length}/4 importadas)</h3><div class="row">${allSongs().map(s=>`<div class="sg"><b>♫ ${esc(s.name)}</b>
  <button class="btn" data-a="prev" data-v="${s.id}">${pv&&pv.id==s.id?'■ Parar':'▶ Prévia'}</button>
  <button class="btn ${S.song==s.id?'sel':''}" data-a="song" data-v="${s.id}">${S.song==s.id?'✓ Selecionada':'Selecionar'}</button>
  ${s.id=='demo'?'':`<button class="btn" data-a="delsong" data-v="${s.id}">Excluir</button>`}</div>`).join('')}</div></div>
 <div class="pnl"><h3>Importar música</h3><label class="btn" style="display:block;text-align:center;${songs.length>=4?'opacity:.4;pointer-events:none':''}">＋ Escolher arquivo(s) de áudio<input type="file" accept="audio/*" multiple id="fs" style="display:none"></label></div>`}

function rKeys(){
 body('keys').innerHTML=`<div class="pc-only" style="display:contents">${Array.from({length:MAXP},(_,p)=>`<div class="pnl"><h3>Jogador ${p+1}</h3><div class="row">${[0,1,2,3].map(l=>`<button class="btn key" data-a="rb" data-p="${p}" data-l="${l}" style="border-color:${LC[l]}">${LN[l]}<small>${rebind&&rebind.p==p&&rebind.l==l?'Pressione…':kn(S.keys[p][l])}</small></button>`).join('')}</div></div>`).join('')}</div>
 <div class="pnl mob-only"><h3>Controles virtuais (prévia)</h3><div class="row">${[0,1].map(p=>`<div style="flex:1"><b>Jogador ${p+1}</b>${padHTML(p,1)}</div>`).join('')}</div></div>
 <button class="btn pc-only" data-a="rstk">Restaurar teclas padrão</button>`}

const SL=[['speed','Velocidade das setas',.5,2,.1,v=>v.toFixed(1)+'x'],['offset','Sincronia (ms) · positivo atrasa as setas',-300,300,10,v=>v+' ms'],['sens','Sensibilidade da batida',.5,2,.1,v=>v.toFixed(1)+'x'],['win','Acertos para vencer',10,100,5,v=>v+'%'],['vol','Volume',0,1,.05,v=>Math.round(v*100)+'%'],['tw','Acertos da equipe para vencer (Revezamento)',10,100,5,v=>v+'%'],['voc','Intensidade de detecção vocal',.5,2,.1,v=>v.toFixed(1)+'x'],['voff','Sincronia vocal (ms)',-300,300,10,v=>v+' ms']];
function rSet(){
 body('set').innerHTML=`<div class="pnl row" style="flex-direction:column;gap:16px">${SL.map(([k,n,a,b,s,f])=>`<label class="s">${n}<output>${f(S.set[k])}</output><input type="range" min="${a}" max="${b}" step="${s}" value="${S.set[k]}" data-k="${k}"></label>`).join('')}</div>
 <button class="btn" data-a="rsts">Restaurar padrões</button>`}

function rRes(){
 $('#res').innerHTML=(RT?`<div class="rc ${RT.win?'w':'l'}" style="flex:1 1 100%;max-width:520px"><h2>${RT.win?'VITÓRIA DA EQUIPE!':'DERROTA DA EQUIPE'}</h2><p>Pontuação total <b>${RT.score}</b></p><p>Acertos <b>${RT.hit}</b> · Erros <b>${RT.miss}</b> · Precisão <b>${RT.acc}%</b> (mínimo ${S.set.tw}%)</p></div>`:'')+RES.map(r=>`<div class="rc ${r.win?'w':'l'}"><img src="${chOf(r.p).imgs[r.win?4:5].src}" alt=""><b>Jogador ${r.p+1}</b><h2>${r.win?'VITÓRIA':'DERROTA'}</h2>
 <p>Pontos <b>${r.score}</b></p><p>Acertos <b>${r.hit}</b> · Erros <b>${r.miss}</b></p><p>Precisão <b>${r.acc}%</b></p><p>Combo máx. <b>${r.max}</b></p></div>`).join('')}

/* ===== Prévia de música ===== */
function stopPrev(){if(pv){try{pv.s.stop()}catch(e){}pv=null}}
async function preview(id){
 const same=pv&&pv.id==id;stopPrev();if(same)return rMusic();
 try{const b=await getBuf(id),s=AC.createBufferSource();s.buffer=b;s.connect(MG);s.start(0,Math.min(b.duration*.3,30));
  s.onended=()=>{if(pv&&pv.s==s){pv=null;rMusic()}};pv={s,id};rMusic()}catch(e){toast('Não foi possível reproduzir essa música.')}}

/* ===== Ações ===== */
const A={
 go:d=>go(d.v),mode:d=>{S.mode=d.v;save();rPlay()},
 async ana(){try{const b=await getBuf(S.song);S.cuts[S.song]=autoCuts(envSec(b),b.duration,S.n);save();rPlay()}catch(e){toast('Não foi possível analisar a música.')}},
 cut:d=>{const c=S.cuts[S.song].sort((a,b)=>a-b),i=+d.i,dd=+d.d,du=bufs[S.song].duration;if(!dd)c.splice(i,1);else c[i]=Math.min(Math.max(c[i]+dd,(c[i-1]??0)+1),(c[i+1]??du)-1);save();rPlay()},
 cutadd:()=>{const du=bufs[S.song].duration,c=S.cuts[S.song],p=[0,...c,du];let bi=0;for(let i=0;i<p.length-1;i++)if(p[i+1]-p[i]>p[bi+1]-p[bi])bi=i;c.push(Math.round((p[bi]+p[bi+1])*5)/10);c.sort((a,b)=>a-b);save();rPlay()},
start:()=>startGame(),pause,quit,
 n:d=>{S.n=+d.v;save();rPlay()},
 song:d=>{S.song=d.v;save();$('#s-play').classList.contains('on')?rPlay():rMusic()},
 cc:d=>{const ids=Object.keys(CH),p=+d.p,i=(ids.indexOf(S.ch[p])+ +d.d+ids.length)%ids.length;S.ch[p]=ids[i];save();rPlay()},
 vc:d=>{vc=d.v;rChars()},use:d=>{S.ch[+d.p]=vc;save();toast(`${CH[vc].name} → Jogador ${+d.p+1}`);rChars()},
 async savech(){
  const f=[0,1,2,3,4,5].map(i=>$('#f'+i).files[0]);if(f.some(x=>!x))return toast('Escolha as 6 imagens: esquerda, direita, cima, baixo, vitória e derrota.');
  const c={id:'c'+Date.now(),name:$('#cn').value.trim()||'Personagem '+Object.keys(CH).length,imgs:f};
  try{await DB.put('chars',c)}catch(e){toast('Aviso: não foi possível gravar no armazenamento local.')}
  addChar(c);vc=c.id;toast('Personagem salvo!');rChars()},
 async delch(d){try{await DB.del('chars',d.v)}catch(e){}delete CH[d.v];S.ch=S.ch.map((x,i)=>x==d.v?'d'+i:x);vc='d0';save();rChars()},
 prev:d=>preview(d.v),
 async delsong(d){stopPrev();try{await DB.del('songs',d.v)}catch(e){}songs=songs.filter(s=>s.id!=d.v);delete bufs[d.v];if(S.song==d.v)S.song='demo';save();rMusic()},
 rb:d=>{rebind={p:+d.p,l:+d.l};rKeys()},
 rstk:()=>{S.keys=DK.map(k=>[...k]);save();rKeys()},
 rsts:()=>{S.set={...DS};save();rSet()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset)});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.f)t.parentElement.classList.add('ok');
 if(t.id=='fs'){
  for(const f of [...t.files]){if(songs.length>=4){toast('Limite de 4 músicas atingido.');break}
   const s={id:'s'+Date.now()+Math.random().toString(36).slice(2,5),name:f.name.replace(/\.[^.]+$/,''),blob:f};
   try{await DB.put('songs',s)}catch(er){toast('Aviso: não foi possível gravar a música no armazenamento local.')}songs.push(s)}
  rMusic()}});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;
 S.set[k]=+e.target.value;e.target.previousElementSibling.textContent=SL.find(s=>s[0]==k)[5](S.set[k]);if(MG)MG.gain.value=S.set.vol;save()});

/* ===== Inicialização ===== */
(async()=>{
 document.body.classList.toggle('mob',MOB);
 [0,1,2,3].forEach(addDef);
 try{await DB.open();const r=await DB.get('kv','state');
  if(r)S={...S,...r.v,set:{...DS,...r.v.set}};
  (await DB.all('chars')).forEach(addChar);songs=await DB.all('songs')}
 catch(e){console.warn('Armazenamento indisponível',e)}
 S.n=Math.min(S.n,MAXP);if(S.song!='demo'&&!songs.some(s=>s.id==S.song))S.song='demo';
 go('menu')})();
</script></body></html>
