<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Olympic Stars 3D</title>
<style>
:root{--bg:#0a1a3c;--pn:rgba(10,26,60,.88);--or:#ff8a1f;--gd:#ffc933;--tx:#fff}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:600 15px system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 8px env(safe-area-inset-bottom,0);pointer-events:none;overflow:auto}
#ui>*{pointer-events:auto}
.p{background:var(--pn);border:3px solid var(--gd);border-radius:18px;padding:18px;max-width:900px;max-height:96%;overflow:auto;text-align:center}
h1{font-size:clamp(30px,6vw,56px);margin:0 0 4px;color:var(--gd);text-shadow:0 3px 0 var(--or);letter-spacing:2px}h2{margin:0 0 10px;color:var(--gd)}
button{font:800 17px system-ui;color:#fff;background:linear-gradient(#ffa63d,#e86a00);border:0;border-bottom:4px solid #a84a00;border-radius:12px;padding:10px 20px;margin:5px;cursor:pointer}
button:hover{filter:brightness(1.15);transform:scale(1.04)}button.b{background:linear-gradient(#3b8cff,#1856c8);border-bottom-color:#0d3a8a}
select,input{font:inherit;padding:6px;border-radius:8px;border:0;margin:3px;max-width:140px}
.g{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}.c{background:#0007;border-radius:12px;padding:10px;width:180px}.c img{height:80px}
table{margin:auto;border-collapse:collapse}td,th{padding:5px 10px;border-bottom:1px solid #fff3}
#hud{position:fixed;left:0;right:0;top:0;padding:8px;pointer-events:none;font-size:14px}
#hud .r{display:flex;gap:8px;align-items:center;background:#000a;border-radius:8px;margin:3px auto;padding:3px 8px;max-width:420px}
#hud .bar{flex:1;height:8px;background:#fff3;border-radius:4px}#hud .bar i{display:block;height:100%;background:var(--or);border-radius:4px}
#msg{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:clamp(30px,8vw,80px);font-weight:900;color:var(--gd);text-shadow:0 4px 0 #000;pointer-events:none}
#ctl{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;opacity:.85;pointer-events:none}
#pm{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);overflow:auto;padding:8px}

.gpf{outline:4px solid #fff!important;outline-offset:2px;box-shadow:0 0 0 7px var(--or),0 0 20px 8px #ffffff80!important;position:relative;z-index:2}
.gad{display:inline-block;width:12px;height:12px;border-radius:50%;background:#555}.gad.on{background:#3f6;box-shadow:0 0 8px #3f6}
.gst{width:76px;height:76px;border:3px solid var(--gd);border-radius:50%;position:relative;background:#0006}.gst i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--or)}
.gbx{min-width:34px;padding:3px 5px;border:2px solid #fff4;border-radius:6px;font-size:11px;background:#0005}.gbx.on{background:var(--or);border-color:#fff;color:#000}
.gbar{height:10px;background:#fff3;border-radius:5px}.gbar i{display:block;height:100%;width:0;background:var(--or);border-radius:5px}
#gpt{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:#000d;border:2px solid var(--gd);border-radius:12px;padding:6px 14px;font-size:14px;pointer-events:none;display:none;max-width:90vw;text-align:center}
#gph{position:fixed;left:0;right:0;bottom:6px;z-index:25;text-align:center;font-size:12px;color:var(--gd);text-shadow:0 1px 3px #000;pointer-events:none;display:none}
</style></head><body><div id="ui"></div><div id="hud"></div><div id="msg"></div><div id="ctl"></div><div id="pm"></div><button id="pb" title="Pausar (ESC)" onclick="pause()">⏸</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const CH=[{c:'#e63946',h:'#f1c27d'},{c:'#1d7cf2',h:'#8d5524'},{c:'#f4a300',h:'#ffdbac'},{c:'#2fbf71',h:'#c68642'}];
const SPORTS={sprint:'Corrida 100m',hurdles:'Corrida com Obstáculos',swim:'Natação',jump:'Salto em Distância',gym:'Ginástica Artística',ham:'Lançamento de Martelo',arc:'Tiro com Arco',rel:'Revezamento 4x100',box:'Boxe',vol:'Vôlei'};
const DK=[{a:'KeyA',b:'KeyD',j:'KeyW',m1:'KeyE',m2:'KeyQ',s:'KeyS'},{a:'ArrowLeft',b:'ArrowRight',j:'ArrowUp',m1:'Period',m2:'Comma',s:'ArrowDown'},{a:'KeyF',b:'KeyH',j:'KeyT',m1:'KeyY',m2:'KeyR',s:'KeyG'},{a:'KeyJ',b:'KeyL',j:'KeyI',m1:'KeyO',m2:'KeyU',s:'KeyK'}];
let S={};try{S=JSON.parse(localStorage.os3||'{}')}catch(e){}
S.names=S.names||['Alex','Max','Luna','Kai'];S.rec=S.rec||{};S.med=S.med||[0,0,0];S.hist=S.hist||[];S.keys=S.keys||JSON.parse(JSON.stringify(DK));S.vol=S.vol??.5;S.conf=S.conf||150;

function GDEF(){return{map:{a:[2],b:[1],j:[0,3],m1:[7],m2:[6],s:[4,5],ok:[0],bk:[1],ps:[9]},dz:.25,sens:1,aim:1,mv:1,dp:1}}
function gpNorm(x){const d=GDEF();if(!x||typeof x!='object')return d;const m=x.map&&typeof x.map=='object'?x.map:{};for(const k in d.map)if(Array.isArray(m[k]))d.map[k]=m[k].filter(v=>(Number.isInteger(v)&&v>=0&&v<32)||(typeof v=='string'&&/^a\d{1,2}[+-]$/.test(v))).slice(0,3);
const n=(v,a,b,f)=>{v=+v;return isFinite(v)?Math.max(a,Math.min(b,v)):f};d.dz=n(x.dz,.05,.6,.25);d.sens=n(x.sens,.5,2,1);d.aim=n(x.aim,.3,3,1);d.mv=x.mv===0?0:1;d.dp=x.dp===0?0:1;return d}
function fixGp(){const o=S.gp&&typeof S.gp=='object'&&!Array.isArray(S.gp)?S.gp:{},g=S.gp={};
g.src=(Array.isArray(o.src)?o.src:[]).concat(['kb','kb','kb','kb']).slice(0,4).map(x=>['kb','gp','both'].includes(x)?x:'kb');
g.dev=(Array.isArray(o.dev)?o.dev:[]).concat([null,null,null,null]).slice(0,4).map(x=>typeof x=='string'?x.slice(0,200):null);
g.ix=(Array.isArray(o.ix)?o.ix:[]).concat([0,0,0,0]).slice(0,4).map(x=>Number.isInteger(x)&&x>=0&&x<16?x:0);
g.pl=(Array.isArray(o.pl)?o.pl:[]).concat([null,null,null,null]).slice(0,4).map(gpNorm);
g.byId={};if(o.byId&&typeof o.byId=='object'&&!Array.isArray(o.byId))Object.keys(o.byId).slice(-12).forEach(k=>{g.byId[String(k).slice(0,200)]=gpNorm(o.byId[k])});
const nv=o.nav&&typeof o.nav=='object'?o.nav:{};g.nav={rep:Math.max(.5,Math.min(2,+nv.rep||1)),stick:nv.stick===0?0:1}}
const save=()=>{try{localStorage.os3=JSON.stringify(S)}catch(e){}};
const KN=c=>c.replace('Key','').replace('Arrow','');function fixKeys(){S.keys.forEach((k,i)=>{for(const x in DK[i])k[x]=k[x]||DK[i][x]});S.box=S.box||[];S.au=Object.assign({m:.7,e:1,mm:0,em:0,map:{}},S.au);S.au.map=S.au.map||{};S.cam=Object.assign({mode:'auto',sens:1},S.cam);fixGp()}fixKeys();
let AC;
// ---- sprites 2D procedurais ----
const tc={};
function texP(i,st,f){const k=i+st+f;if(tc[k])return tc[k];const ch=CH[i],c=document.createElement('canvas');c.width=64;c.height=96;const g=c.getContext('2d');g.lineCap='round';g.lineWidth=7;
const a=st=='run'?Math.sin(f*Math.PI/2)*.9:0,dy=st=='lose'?8:0;
g.strokeStyle='#223';[a,-a].forEach((q,j)=>{if(st=='jump')q=j?1:-.5;g.beginPath();g.moveTo(32,58);g.lineTo(32+Math.sin(q)*22,58+Math.cos(q)*34);g.stroke()});
g.fillStyle=ch.c;g.fillRect(22,32+dy,20,28);g.strokeStyle=ch.h;
[0,1].forEach(j=>{g.beginPath();g.moveTo(j?42:22,36+dy);if(st=='win')g.lineTo(j?56:8,10+((f+j)%2)*8);else g.lineTo(32+(j?20:-20)+(j?-a:a)*8,52+dy);g.stroke()});
g.fillStyle=ch.h;g.beginPath();g.arc(32,18+dy,13,0,7);g.fill();g.fillStyle=ch.c;g.beginPath();g.arc(32,18+dy,13,Math.PI,0);g.fill();g.fillStyle='#000';g.fillRect(28,21+dy,3,3);g.fillRect(36,21+dy,3,3);
return tc[k]=new THREE.CanvasTexture(c)}
function mkSp(i){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(i,'idle',0)}));s.scale.set(1.5,2.25,1);s.center.set(.5,0);return s}
const anim=(s,i,st,f)=>{s.material.map=tex(i,st,f&3)};
// ---- cena ----
const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(rd.domElement);
let sc,cam,G=null,mode='menu',setup={mode:'quick',sport:'sprint',h:1,d:1,ch:[0,1,2,3]},camp=null,SP=[],conf=null,cx=0,T=0,rebind=null;
const rs=()=>{rd.setSize(innerWidth,innerHeight);if(cam){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}};addEventListener('resize',rs);
function newScene(){if(sc)sc.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()});sc=new THREE.Scene();sc.background=new THREE.Color(0x87ceeb);sc.fog=new THREE.Fog(0x87ceeb,40,140);
sc.add(new THREE.AmbientLight(0xffffff,.8));const d=new THREE.DirectionalLight(0xffffff,.6);d.position.set(10,20,10);sc.add(d);cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,400);rs();SP=[];conf=null;
const gr=new THREE.Mesh(new THREE.PlaneGeometry(500,200),new THREE.MeshLambertMaterial({color:0x3a9d4a}));gr.rotation.x=-Math.PI/2;gr.position.y=-.02;sc.add(gr)}
const box=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);sc.add(m);return m};
function track(len,hur){box(len+60,.04,11,0xc4553a,len/2,0,0);for(let k=0;k<5;k++)box(len+60,.03,.1,0xffffff,len/2,.03,-4.4+2.2*k);
box(.6,.05,11,0xffffff,len,.04,0);box(.3,5,.3,0xffc933,len,2.5,-5.6);box(.3,5,.3,0xffc933,len,2.5,5.6);box(.4,.5,11.5,0xffc933,len,5,0);
box(len+60,4,5,0x3b5bdb,len/2,2,-9);for(let i=0;i<70;i++)box(.8,.8,.8,[0xff5555,0xffee55,0xffffff,0x55ddff][i%4],-25+Math.random()*(len+50),4.4,-9+Math.random()*3);
hur.forEach(x=>{for(let l=0;l<4;l++){const z=-3.3+2.2*l;box(.15,.12,1.6,0xffffff,x,.95,z);box(.1,.95,.1,0x666666,x,.5,z-.75);box(.1,.95,.1,0x666666,x,.5,z+.75)}})}
// ---- UI ----
let ui=h=>{(paused?$('#pm'):$('#ui')).innerHTML=h};
const opts=(o,s)=>Object.entries(o).map(([k,v])=>`<option value=${k} ${k==s?'selected':''}>${v}</option>`).join('');
function menu(){if(paused){showPause();return}mode='menu';G=null;$('#hud').innerHTML='';$('#ctl').textContent='';$('#msg').textContent='';newScene();track(100,[]);for(let i=0;i<4;i++){const s=mkSp(i);s.position.set(0,0,-3.3+2.2*i);sc.add(s);SP.push({sp:s,ci:i})}
ui(`<div class=p><h1>OLYMPIC STARS 3D</h1><div style="color:var(--or)">Atletismo arcade para até 4 jogadores</div><br><button onclick="scrSetup('quick')">⚡ Partida Rápida</button><button onclick="scrSetup('camp')">🏆 Campeonato</button><br><button class=b onclick="scrChars()">Personagens</button><button class=b onclick="scrEd()">🎨 Criar/Editar</button><button class=b onclick="scrHist()">📜 Histórico</button><button class=b onclick="scrCtl()">Controles</button><button class=b onclick="scrCfg()">Configurações</button><button class=b onclick="scrRec()">Recordes</button><button class=b onclick="scrBak()">Backup</button><button class=b onclick="scrAud()">🔊 Áudio</button><button class=b onclick="scrCred()">Créditos</button></div>`)}
function scrSetup(m){if(m)setup.mode=m;let h=`<div class=p><h2>${setup.mode=='quick'?'Partida Rápida':'Campeonato (todas as provas)'}</h2>`;
if(setup.mode=='quick')h+=`Modalidade <select onchange="setup.sport=this.value">${opts(SPORTS,setup.sport)}</select> `;
h+=`Humanos <select onchange="setup.h=+this.value;scrSetup()">${[1,2,3,4].map(n=>`<option ${n==setup.h?'selected':''}>${n}</option>`)}</select> Bots <select onchange="setup.d=+this.value">${['Fácil','Normal','Difícil','Especialista'].map((n,i)=>`<option value=${i} ${i==setup.d?'selected':''}>${n}</option>`)}</select><div class=g>`;
for(let i=0;i<4;i++){const ci=setup.ch[i],hu=i<setup.h;h+=`<div class=c><b>Jogador ${i+1} — ${hu?'Humano':'Bot'}</b><br><img src="${tex(ci,'idle',0).image.toDataURL()}"><br><select onchange="setup.ch[${i}]=+this.value;scrSetup()">${S.names.map((n,k)=>`<option value=${k} ${k==ci?'selected':''}>${n}</option>`)}</select><br><input value="${S.names[ci]}" onchange="renm(${ci},this.value)"><br><small>${hu?gpSrcLbl(i):'IA'}</small></div>`}
ui(h+`</div><div id=gps style="font-size:13px">🎮 Pressione START em um controle para associá-lo ao próximo jogador livre.</div><button onclick="startGame()">▶ Iniciar</button><button class=b onclick="scrGp()">🎮 Controles</button><button class=b onclick="menu()">Voltar</button></div>`)}
function scrChars(){ui(`<div class=p><h2>Personagens</h2><div class=g>${CH.map((_,i)=>`<div class=c><img src="${tex(i,'win',0).image.toDataURL()}"><br><input value="${S.names[i]}" onchange="renm(${i},this.value)"><br><small>${CH[i].cu?'⭐ Personalizado':'Padrão — todas as provas'}</small></div>`).join('')}</div><button class=b onclick="menu()">Voltar</button></div>`)}
function scrCtl(){ui(`<div class=p><h2>Controles (clique e pressione uma tecla)</h2><div style="font-size:13px;margin-bottom:6px">⌨ Teclas do teclado. 🎮 Controles detectados: ${padN()} — associação, botões, sensibilidade e teste ficam em “Gamepad”.</div><table><tr><th></th><th>Correr ◀</th><th>Correr ▶</th><th>Pular</th><th>Boxe: avançar</th><th>Boxe: recuar</th><th>Boxe: trocar</th></tr>${S.keys.map((k,p)=>`<tr><td>J${p+1}</td>${['a','b','j','m1','m2','s'].map(x=>`<td><button class=b onclick="rebind=[${p},'${x}'];this.textContent='...'">${KN(k[x])}</button></td>`).join('')}</tr>`).join('')}</table><button onclick="S.keys=JSON.parse(JSON.stringify(DK));save();scrCtl()">Restaurar</button><button class=b onclick="scrGp()">🎮 Gamepad</button><button class=b onclick="menu()">Voltar</button></div>`)}
function scrCfg(){ui(`<div class=p><h2>Configurações</h2><button onclick="scrAud()">🔊 Áudio e músicas</button><button onclick="scrCam()">🎥 Câmeras</button><button onclick="scrCtl()">🎮 Controles</button><br>Confetes <select onchange="S.conf=+this.value;save()">${[50,150,400].map(n=>`<option ${n==S.conf?'selected':''}>${n}</option>`)}</select><br><button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">Tela cheia</button><button class=b onclick="menu()">Voltar</button></div>`)}
function scrRec(){ui(`<div class=p><h2>Recordes</h2><table>${Object.entries(SPORTS).map(([k,v])=>`<tr><td>${v}</td><td>${S.rec[k]?S.rec[k].toFixed(2)+'s':'—'}</td></tr>`).join('')}<tr><td>Medalhas</td><td>🥇${S.med[0]} 🥈${S.med[1]} 🥉${S.med[2]}</td></tr></table><h3>Boxe — últimas lutas</h3>${(S.box||[]).slice(-6).reverse().map(b=>`<div>${b.d}: 🏆 ${b.w} venceu ${b.l} (vida ${b.r})</div>`).join('')||'Nenhuma ainda'}<h3>Campeonatos</h3>${S.hist.slice(-8).reverse().map(h=>`<div>${h}</div>`).join('')||'Nenhum ainda'}<br><button class=b onclick="menu()">Voltar</button></div>`)}
function scrCred(){ui(`<div class=p><h2>Créditos</h2>Olympic Stars 3D — jogo original.<br>Three.js, Canvas e Web Audio.<br><button class=b onclick="menu()">Voltar</button></div>`)}
// ---- corrida ----
function startGame(){if(setup.mode=='camp'){camp={seq:Object.keys(SPORTS),i:0,pts:[0,0,0,0]};startRace(camp.seq[0])}else startRace(setup.sport)}
function startRace(sport){if(sport=='jump')return startJump();if(sport=='gym')return startGym();if(sport=='ham')return startHam();if(sport=='arc')return startArc();if(sport=='rel')return startRel();if(sport=='box')return startBox();if(sport=='vol')return startVol();const hur=sport=='hurdles'?[15,28,41,54,67,80]:[];newScene();sport=='swim'?pool():track(100,hur);ui('');
const rate=[5,6.5,8,9.2][setup.d];G={sport,hur,ph:'wait',t:0,ct:-1.8,go:2.4+Math.random()*1.4,fin:[],cx:0,hc:0,R:[0,1,2,3].map(i=>{const ci=setup.ch[i],sp=mkSp(ci);sc.add(sp);return{i,ci,sp,hu:i<setup.h,x:0,v:0,last:-1,st:1,stun:0,j:0,fin:0,ft:0,fs:0,lt:0,bt:0,rate:rate*(.95+Math.random()*.1),pass:{},e:{}}})};mode='race';
$('#ctl').innerHTML=`${SPORTS[sport]}: alterne as teclas para correr${hur.length?' e pule os obstáculos':''}. `+G.R.filter(r=>r.hu).map(r=>`J${r.i+1}: ${KN(S.keys[r.i].a)}/${KN(S.keys[r.i].b)}${hur.length?'/'+KN(S.keys[r.i].j):''}`).join(' · ')}
function press(r,s){const g=G;if(g.ph=='wait'){if(r.stun<=0&&g.ct>=0){r.stun=1;r.fs=1;sfx('error')}return}
if(g.ph!='go'||r.fin||r.stun>0||r.tn>0)return;const dt=g.t-r.lt;r.lt=g.t;let gn=.42*(.6+.4*r.st);if(s==r.last)gn=.04;if(dt<.07)gn*=.3;r.st=Math.max(.05,r.st-.025);r.v=Math.min(r.v+gn,13);if(g.sport=='swim')swStroke(r,s!=r.last);r.last=s}
function jump(r){if(G.ph=='go'&&r.j<=0&&r.stun<=0&&!r.fin&&G.hur.length){r.j=.7;sfx('jump')}}
addEventListener('keydown',e=>{if(rebind){const[p,x]=rebind;if(S.keys.some(k=>Object.values(k).includes(e.code))){rebind=null;scrCtl();return}S.keys[p][x]=e.code;rebind=null;save();scrCtl();return}
if(e.code=='Escape'&&(paused||PM.includes(mode))){paused?resume():pause();e.preventDefault();return}if(paused)return;if(!G||e.repeat)return;if(mode=='jmp'){jkey(e);return}if(mode=='gym'){gkey(e);return}if(mode=='ham'){hkey(e);return}if(mode=='rel'){rkey(e);return}if(mode=='box'){bkey(e);return}if(mode=='vol'){vkey(e);return}if(mode=='arc'){if(e.code==S.keys[G.R[G.cur/5|0].i].j)ahold();return}if(mode!='race')return;G.R.forEach(r=>{if(!r.hu)return;const k=S.keys[r.i];if(e.code==k.a){press(r,0);e.preventDefault()}else if(e.code==k.b){press(r,1);e.preventDefault()}else if(e.code==k.j){jump(r);e.preventDefault()}})});
function upd(dt){const g=G;g.ct+=dt;const m=$('#msg');
if(g.ph=='wait'){m.textContent=g.ct<0?SPORTS[g.sport]:g.ct<g.go*.5?'Em suas marcas...':'Prontos...';{const cs=g.ct<0?0:g.ct<g.go*.5?1:2;if(cs!=g.cs){g.cs=cs;if(cs)sfx('count')}}if(g.ct>g.go){g.ph='go';g.t=0;sfx('start');}}
else if(g.ph=='go'){g.t+=dt;m.textContent=g.t<.8?'JÁ!':''}
const dn=g.ph=='go'||g.ph=='done';
g.R.forEach(r=>{if(g.ph=='wait'&&r.stun>0)r.stun-=0;
if(g.ph=='go'||g.ph=='done'){if(!r.hu&&!r.fin&&g.ph=='go'){r.bt-=dt;if(r.bt<=0){r.bt=(1/r.rate)*(.85+Math.random()*.3);press(r,r.last==0?1:0)}
const nh=g.hur.find(h=>h>r.x-.5&&!r.pass[h]);if(nh&&r.j<=0){if(r.e[nh]==null)r.e[nh]=(Math.random()-.5)*[1.4,.9,.45,.12][setup.d];if(nh-r.x<=r.v*.35+r.e[nh])jump(r)}}

const st=(id,x,y)=>{const d=document.getElementById(id);if(d)d.style.transform='translate('+x*30+'px,'+y*30+'px)'};st('gsl',g.axes[0]||0,g.axes[1]||0);st('gsr',g.axes[2]||0,g.axes[3]||0);

function gpSrcLbl(i){const s=S.gp.src[i],kb=KN(S.keys[i].a)+' / '+KN(S.keys[i].b)+' / pular '+KN(S.keys[i].j),pd=GP.as[i]>=0?'🎮 Controle '+(GP.as[i]+1):S.gp.dev[i]?'🎮 ⚠ desconectado':'🎮 ⚠ sem controle';return s=='kb'?'⌨ '+kb:s=='gp'?pd:pd+' + ⌨ '+kb}
// ---- tela Configurações → Controles → Gamepad ----
function scrGp(m){GP.msg=m||'';const pads=gpPadsNow(),ids=Object.keys(pads).map(Number),g=S.gp,p=GP.sel,c=g.pl[p],M=c.map,dv=[...new Set([0,1,2,3,...ids])].sort((a,b)=>a-b),cp=GP.cap,pe=GP.pend,nm=i=>escA(gpName(pads[i]));
if(GP.td==null||!pads[GP.td])GP.td=GP.as[p]>=0?GP.as[p]:ids[0];
const bn=(k,l)=>l&&l.length?l.map(gbn).join(' / '):GSYS.includes(k)?'— (usa '+GDM[k].map(gbn)+')':'—',td=pads[GP.td];
const dev=dv.map(i=>{const x=pads[i],q=GP.as.indexOf(i);return`<tr><td>Controle ${i+1}</td><td style="text-align:left">${x?nm(i)+(x.mapping!='standard'?' <small style="color:#ffc933">(mapeamento não padrão: confira os botões)</small>':''):'—'}</td><td>${x?'<b style="color:#6f6">● Conectado</b>':'<span style="color:#f88">○ Desconectado</span>'}</td><td>${x?(q>=0?'Jogador '+(q+1):'Não associado'):''}</td><td>${x?`<i class=gad id=gad${i}></i>`:''}</td></tr>`}).join('');
const asg=[0,1,2,3].map(q=>{const w=GP.as[q],wd=g.dev[q]&&w<0;return`<tr><td>Jogador ${q+1}${q<setup.h?'':' <small>(bot)</small>'}</td><td><select onchange="gpSrc(${q},this.value)">${[['kb','⌨ Somente teclado'],['gp','🎮 Somente controle'],['both','⌨+🎮 Teclado e controle']].map(([v,l])=>`<option value=${v} ${g.src[q]==v?'selected':''}>${l}</option>`).join('')}</select></td><td><select onchange="gpDev(${q},this.value)" style="max-width:220px"><option value=-1 ${w<0&&!wd?'selected':''}>— nenhum —</option>${wd?'<option value=-2 selected>⚠ aguardando: '+escA(g.dev[q].replace(/\s*\(.*\)\s*/g,' ').slice(0,30))+'</option>':''}${ids.map(i=>`<option value=${i} ${w==i?'selected':''}>Controle ${i+1} — ${nm(i)}</option>`).join('')}</select></td><td><button class=b onclick="gpJoin(${q})">${GP.join==q?'Aperte um botão…':'Detectar'}</button></td></tr>`}).join('');
const cmds=GGAME.concat(GSYS).map(k=>`<tr><td style="text-align:left">${GCMD[k]}</td><td><b>${bn(k,M[k])}</b></td><td>${cp&&cp.p==p&&cp.k==k?'<span id=gcd style="color:var(--gd)">…</span> <button onclick="gpCapEnd(\'Configuração cancelada.\')">Cancelar</button>':`<button class=b onclick="gpCapStart('${k}')">Configurar</button>`}</td></tr>`).join('');
const sl=(k,l,mn,mx,st)=>`<div style="display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0"><span style="width:190px;text-align:left">${l}</span><input type=range min=${mn} max=${mx} step=${st} value=${c[k]} oninput="gpNum('${k}',this.value,this)"><b style="width:60px">${gpFmt(k,c[k])}</b></div>`;
const tg=(k,l)=>`<button class="${c[k]?'':'b'}" onclick="gpTog('${k}')">${c[k]?'✔':'✖'} ${l}</button>`;
const tbx=td?Array.from({length:td.buttons.length},(_,k)=>`<span class=gbx id=gb${k}>${GBN[k]||k}</span>`).join(''):'';
ui(`<div id=gpr class=p style="max-width:960px"><h2>🎮 Gamepad</h2><div style="color:var(--gd);min-height:1.3em">${m||''}</div>
<h3>Controles conectados</h3><table style="font-size:13px">${dev}</table>${ids.length?'':'<small>Nenhum controle detectado. Conecte e aperte um botão (o navegador só mostra o controle após o primeiro toque).</small>'}
<h3>Associação dos jogadores</h3><table style="font-size:13px">${asg}</table><small>Um controle só controla um jogador. Pressione START num controle sem jogador para entrar no próximo slot livre. Bots preenchem as vagas restantes.</small>
<h3>Configurar botões — Jogador ${p+1}</h3><div>${[0,1,2,3].map(q=>`<button class="${q==p?'':'b'}" onclick="gpTab(${q})">J${q+1}</button>`).join('')}</div>
${pe?`<div style="border:2px solid var(--or);border-radius:10px;padding:8px;margin:6px 0">O botão <b>${gbn(pe.tok)}</b> já é usado em "${GCMD[pe.cf]}". Substituir?<br><button onclick="gpPendOk()">Substituir</button><button class=b onclick="gpPendNo()">Cancelar</button></div>`:''}
${cp?`<div style="color:var(--gd);margin:6px 0">Configurando: <b>${GCMD[cp.k]}</b> — aperte o botão no controle do Jogador ${p+1} (Esc ou Cancelar aborta).</div>`:''}
<table style="font-size:13px">${cmds}</table>
<h3>Movimento, mira e sensibilidade</h3><div>${tg('mv','Analógico esquerdo move (Vôlei/Boxe)')}${tg('dp','Direcional move/alterna')}</div>
${sl('dz','Deadzone',.05,.6,.01)}${sl('sens','Sensibilidade do analógico',.5,2,.05)}${sl('aim','Sensibilidade da mira (Arco)',.3,3,.05)}
<small>Analógico direito = mira no Tiro com Arco. Corridas, Natação, Ginástica, Martelo e Revezamento usam só botões/direcional (sem analógico).</small>
<div style="margin-top:6px">Navegação nos menus: velocidade <select onchange="gpNavSet('rep',this.value)">${[[1.5,'Lenta'],[1,'Normal'],[.6,'Rápida']].map(([v,l])=>`<option value=${v} ${S.gp.nav.rep==v?'selected':''}>${l}</option>`).join('')}</select> <button class="${S.gp.nav.stick?'':'b'}" onclick="gpNavSet('stick')">${S.gp.nav.stick?'✔':'✖'} Analógico navega</button></div>
<h3>Teste em tempo real</h3>${ids.length?`<div>Controle <select onchange="GP.td=+this.value;scrGp(GP.msg)">${ids.map(i=>`<option value=${i} ${i==GP.td?'selected':''}>${i+1} — ${nm(i)}</option>`).join('')}</select><button class=b onclick="gpVib()">📳 Testar vibração</button></div>
<div id=gtb style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0">${tbx}</div>
<div style="display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap"><div class=gst><i id=gsl></i></div><div class=gst><i id=gsr></i></div><div style="width:150px;text-align:left;font-size:12px">Gatilho LT<div class=gbar><i id=gtl></i></div>Gatilho RT<div class=gbar><i id=gtr></i></div></div></div>
<div id=gax style="font:11px monospace;margin-top:6px;word-break:break-all"></div><div id=gvm style="min-height:1.3em;color:var(--gd)"></div>`:'<small>Conecte um controle para testar botões, analógicos, gatilhos e vibração.</small>'}
<div style="margin-top:8px"><button onclick="gpReset(${p})">Restaurar Jogador ${p+1}</button><button onclick="gpResetAll()">Restaurar tudo</button><button class=b onclick="scrCtl()">Voltar</button></div></div>`)}
// ---- laço único de leitura ----
function padPoll(){if(!navigator.getGamepads||document.hidden)return;const now=performance.now(),dt=Math.min(.05,(now-GP.t0)/1000||0);GP.t0=now;const pads=gpPadsNow();let ch=0;
for(const i in pads){const s=GP.st[i];if(!s||s.id!=pads[i].id){GP.st[i]=gpNewSt(pads[i]);ch=1}}for(const i in GP.st)if(!pads[i]){delete GP.st[i];ch=1}
if(ch||GP.dirty){const old=GP.as.slice();GP.dirty=0;gpReconcile(pads);
if(!GP.boot){for(let p=0;p<4;p++){if(old[p]>=0&&GP.as[p]<0)gpToast('🎮 CONTROLE DO JOGADOR '+(p+1)+' DESCONECTADO — Reconecte o controle para continuar.',5500);else if(old[p]<0&&GP.as[p]>=0){GP.rec.push(p);gpGain(p);gpToast('🎮 Controle do Jogador '+(p+1)+' reconectado — associação recuperada.')}}
const nk=Object.keys(pads).filter(i=>!(GP.known&&GP.known[i]==pads[i].id)&&!GP.as.includes(+i));if(nk.length)gpToast('🎮 Controle '+(+nk[0]+1)+' conectado — não associado. Em Controles → Gamepad (ou START na Partida) associe a um jogador.',4500)}
GP.known={};for(const i in pads)GP.known[i]=pads[i].id;gpRefresh()}
if(rebind){gpRelAll();return}
for(const i in pads){const s=GP.st[i],g=pads[i];let a=0;for(const b of g.buttons)if(b.pressed||b.value>.5)a=1;for(const v of g.axes)if(Math.abs(v)>.4)a=1;if(a)s.act=now}
gpLostUpd();
if(GP.cap)gpCapUpd(pads,now);else{const game=gpPlay();gpGame(pads,game,dt);gpUI(pads,game,now)}
gpTestUpd(pads);gpHint();for(const i in GP.st)GP.st[i].init=0;GP.boot=0}
function gpRefresh(){if(GP.sc=='gp')scrGp(GP.msg);else if(GP.sc=='setup')scrSetup();gpRefreshPause()}
function gpHint(){let e=document.getElementById('gph');if(!e){e=document.createElement('div');e.id='gph';document.body.appendChild(e)}const n=Object.keys(GP.st).length;let t='';
if(n){if(paused)t='🎮 D-pad/analógico: navegar · A: confirmar · B: voltar · START: continuar';else if(mode=='podium')t='🎮 RB: avançar · Y: pular · X: rever · A: confirmar';else if(mode=='menu'&&GP.navOn)t='🎮 D-pad/analógico: navegar · A: confirmar · B: voltar'}
if(e.textContent!=t){e.textContent=t;e.style.display=t?'block':'none'}}
// ---- listeners (registrados uma única vez) ----
addEventListener('gamepadconnected',()=>{GP.dirty=1});addEventListener('gamepaddisconnected',()=>{GP.dirty=1});
addEventListener('mousemove',()=>{if(GP.navOn){GP.navOn=0;GP.fe&&GP.fe.classList.remove('gpf')}},{passive:true});
['keydown','keyup'].forEach(t=>addEventListener(t,e=>{if(!e.isTrusted||rebind)return;
if(t=='keydown'&&e.code=='Escape'&&GP.cap){gpCapEnd('Configuração cancelada.');e.stopImmediatePropagation();e.preventDefault();return}
if(t=='keydown'&&GP.navOn&&e.code!='Escape'){GP.navOn=0;GP.fe&&GP.fe.classList.remove('gpf')}
if(!gpPlay())return;const p=S.keys.findIndex(k=>GGAME.some(x=>k[x]==e.code));if(p>=0&&p<4&&S.gp.src[p]=='gp'){e.stopImmediatePropagation()}},true));
// ---- integração com ui / pausa / menu ----
{const o=ui;let lk='',ln=0;ui=function(h){const f=GP.fe,L=gpFoc(),ix=f?L.indexOf(f):-1,k=String(h).slice(0,70),same=k==lk;lk=k;
GP.sc=/id=gpr\b/.test(h)?'gp':/id=gps\b/.test(h)?'setup':'';if(GP.sc!='gp'){GP.cap=null;GP.pend=null;GP.join=-1}
const r=o.apply(this,arguments);GP.lock=performance.now()+(mode=='podium'?1500:250);
if(h){const L2=gpFoc();gpSetF(L2.length?L2[same&&ix>=0?Math.min(ix,L2.length-1):0]:null)}else{GP.fe=null}return r}}
{const op=pause,or=resume,os=showPause,om=menu;
pause=function(){const w=paused;op.apply(this,arguments);if(paused&&!w){GP.own=GP.nextOwn;GP.nextOwn=null;GP.psT=performance.now();gpRelAll()}};
resume=function(){const w=paused;or.apply(this,arguments);if(!w)return;GP.own=null;GP.psT=performance.now();GP.fe=null;GP.rec=[];GP.lock=performance.now()+300};
showPause=function(){os.apply(this,arguments);gpPauseExtra()};
menu=function(){if(!paused){GP.ign=[0,0,0,0];GP.sub=[0,0,0,0];GP.rec=[]}return om.apply(this,arguments)}}

// ---- loop ----
const clk=new THREE.Clock();menu();
(function loop(){requestAnimationFrame(loop);const dt=paused?(clk.getDelta(),0):Math.min(clk.getDelta(),.05);const pl=PM.includes(mode);if(pl!=pbv){pbv=pl;$('#pb').style.display=pl?'block':'none'}T+=dt;padPoll();
if(paused){}else if(mode=='race'&&G)upd(dt);else if(mode=='jmp')updJump(dt);else if(mode=='gym')updGym(dt);else if(mode=='ham')updHam(dt);else if(mode=='arc')updArc(dt);else if(mode=='rel')updRel(dt);else if(mode=='box')updBox(dt);else if(mode=='vol')updVol(dt);
else if(mode=='menu'){SP.forEach((s,i)=>anim(s.sp,s.ci,'run',(T*8+i)|0));cam.position.set(Math.sin(T*.3)*3,3,12);cam.lookAt(0,1.3,0)}
else if(mode=='podium'){pcUpd(dt);SP.forEach(s=>{anim(s.sp,s.ci,s.k>=(s.tm?2:3)?'lose':'win',s.tm?(T*5)|0:(T*(s.k?3:5)+s.k)|0);s.sp.position.y=s.h+(s.k<(s.tm?2:3)?Math.abs(Math.sin(T*5+(s.tm?0:s.k)))*.2:0)});if(conf){const a=conf.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-dt*2.5;if(y<0)y=8;a.setY(i,y)}a.needsUpdate=true}}
camUpd(dt);renderAll()})();
</script></body></html>
